 degree of trauma induced coagulopathy.","cls":"IIb","lvl":"C","sec":"四肢","page":38,"det":"四肢外傷患者の術中全身ヘパリン化は、修復範囲、血流遮断時間、合併損傷、出血リスク全体、外傷性凝固障害の程度を踏まえて個別に考慮してもよい。後ろ向き研究は全身術中ヘパリン化について相反する結果を示しており、解析は選択バイアスを伴う後ろ向きデザインにより妨げられている（ヘパリン化を受けた患者はしばしば重症度が低かった）。多施設後ろ向き研究では、全身術中ヘパリン化後に動脈修復の開存性が高く、出血の増加はなかった。一方、前向きPROOVIT研究では、全身ヘパリン化後に出血関連の血液製剤使用が増加し、血栓症や肢喪失への利益はなかった。\n\n実務的な整理としては、①短時間の阻血で単純修復できる症例ではヘパリン不使用が合理的、②長時間の阻血、複雑な再建、グラフト使用、末梢血栓摘除を伴う症例では局部または低用量全身ヘパリン化を考慮、③頭部外傷・実質臓器損傷・活動性出血・凝固障害がある症例では差し控える、④術中のACTモニタリングで用量を個別化するという流れである。ヘパリン化の判断を術前に明文化し、チームで共有することが安全策となる。実務的な整理としては、短時間の阻血で単純修復できる症例ではヘパリン不使用が合理的、長時間の阻血・複雑な再建・グラフト使用・末梢血栓摘除を伴う症例では局所または低用量の全身ヘパリン化を考慮、頭部外傷・実質臓器損傷・活動性出血・凝固障害がある症例では差し控える、術中ACTで用量を個別化する、という流れになる。","detp":["四肢外傷患者の術中全身ヘパリン化は、修復範囲、血流遮断時間、合併損傷、出血リスク全体、外傷性凝固障害の程度を踏まえて個別に考慮してもよい。後ろ向き研究は全身術中ヘパリン化について相反する結果を示しており、解析は選択バイアスを伴う後ろ向きデザインにより妨げられている（ヘパリン化を受けた患者はしばしば重症度が低かった）。多施設後ろ向き研究では、全身術中ヘパリン化後に動脈修復の開存性が高く、出血の増加はなかった。","一方、前向きPROOVIT研究では、全身ヘパリン化後に出血関連の血液製剤使用が増加し、血栓症や肢喪失への利益はなかった。実務的な整理としては、①短時間の阻血で単純修復できる症例ではヘパリン不使用が合理的、②長時間の阻血、複雑な再建、グラフト使用、末梢血栓摘除を伴う症例では局部または低用量全身ヘパリン化を考慮、③頭部外傷・実質臓器損傷・活動性出血・凝固障害がある症例では差し控える、④術中のACTモニタリングで用量を個別化するという流れである。","ヘパリン化の判断を術前に明文化し、チームで共有することが安全策となる。実務的な整理としては、短時間の阻血で単純修復できる症例ではヘパリン不使用が合理的、長時間の阻血・複雑な再建・グラフト使用・末梢血栓摘除を伴う症例では局所または低用量の全身ヘパリン化を考慮、頭部外傷・実質臓器損傷・活動性出血・凝固障害がある症例では差し控える、術中ACTで用量を個別化する、という流れになる。"]},{"n":95,"ja":"血力学的に安定した患者では、局在性大腿/膝窩静脈損傷は結紮より修復を考慮すべき","en":"Repair of localised femoral or popliteal venous injury should be considered over ligation in haemodynamically stable patients.","cls":"IIa","lvl":"B","sec":"四肢","page":39,"det":"血力学的に安定した患者では、局在性大腿静脈または膝窩静脈損傷は結紮より修復を考慮すべきとされる。四肢静脈損傷は単独または動脈損傷との合併で生じ、修復か結紮かの決定には個別化されたアプローチが必要である。動静脈合併損傷はより大きな外傷重症度と四肢損傷の複雑性の markerであり、切断・筋膜切開・肢合併症の率が全体に高い。鈍的外傷では多系統損傷と競合する治療優先順位（体幹出血の制御による救命優先）を伴うことが多い。\n\nベトナム戦争以降、民間と軍の多数の研究があり、メタ解析では静脈修復後は静脈結紮と比較して二次切断のリスクが6倍低く、静脈血栓塞栓のリスク増加はなかった。しかし、どちらか一方を決定的に支持するエビデンスはなく、患者の生理、肢への損傷負担、他部位の損傷、静脈損傷の複雑性をすべて考慮して手術戦略を決める。最近では、静脈損傷を伴う四肢血管外傷の米軍戦傷例で、静脈修復と結紮の間に血管・肢合併症や切断率の差は見られなかった。大・膝窩静脈は側副路が乏しく結紮後のうっ血・コンパートメント症候群のリスクが高いため、安定例では修復を優先する。大腿・膝窩静脈は側副路が乏しく、結紮後のうっ血・コンパートメント症候群のリスクが高いため、安定例では修復を優先する。一方、不安定例や広範な組織破壊では結紮が許容され、下腿腫脹とコンパートメント徴候の観察を強化する。動静脈合併損傷は肢合併症の率が高く、筋膜切開の閾値を低く保つ。","detp":["血力学的に安定した患者では、局在性大腿静脈または膝窩静脈損傷は結紮より修復を考慮すべきとされる。四肢静脈損傷は単独または動脈損傷との合併で生じ、修復か結紮かの決定には個別化されたアプローチが必要である。動静脈合併損傷はより大きな外傷重症度と四肢損傷の複雑性の markerであり、切断・筋膜切開・肢合併症の率が全体に高い。鈍的外傷では多系統損傷と競合する治療優先順位（体幹出血の制御による救命優先）を伴うことが多い。","ベトナム戦争以降、民間と軍の多数の研究があり、メタ解析では静脈修復後は静脈結紮と比較して二次切断のリスクが6倍低く、静脈血栓塞栓のリスク増加はなかった。しかし、どちらか一方を決定的に支持するエビデンスはなく、患者の生理、肢への損傷負担、他部位の損傷、静脈損傷の複雑性をすべて考慮して手術戦略を決める。最近では、静脈損傷を伴う四肢血管外傷の米軍戦傷例で、静脈修復と結紮の間に血管・肢合併症や切断率の差は見られなかった。","大・膝窩静脈は側副路が乏しく結紮後のうっ血・コンパートメント症候群のリスクが高いため、安定例では修復を優先する。大腿・膝窩静脈は側副路が乏しく、結紮後のうっ血・コンパートメント症候群のリスクが高いため、安定例では修復を優先する。一方、不安定例や広範な組織破壊では結紮が許容され、下腿腫脹とコンパートメント徴候の観察を強化する。動静脈合併損傷は肢合併症の率が高く、筋膜切開の閾値を低く保つ。"]},{"n":96,"ja":"外傷性虚血後下腿コンパートメント症候群の治療には、緊急4コンパートメント筋膜切開を推奨する","en":"Emergency four compartment fasciotomy is recommended to treat traumatic post-ischaemic lower limb compartment syndrome.","cls":"I","lvl":"B","sec":"四肢","page":39,"det":"外傷性虚血後下腿コンパートメント症候群の治療には、緊急4コンパートメント筋膜切開が推奨される。急性四肢コンパートメント症候群は、迅速に管理しなければ有意な罹患を生じる外科的緊急症である。US National Trauma Data Bankのデータでは、下肢動脈外傷患者の最大30%程度が筋膜切開を要したとされ、より最近の全国データ（TQIP 2017–2019）では下肢血管損傷後の筋膜切開率は以前の報告から有意に低下している。診断で最も重要な道具は臨床的疑いを高く保つことで、古典的な臨床徴候を呈する患者はさらなる検査を要さず緊急筋膜切開を受けるべきである。\n\n動脈血管外傷後の虚血時間が数時間を超えることは筋膜切開の強い予測因子であった。コンパートメント圧はルーチンには測定されないが、意識障害などで評価不能な患者では用いられる。診断と治療の閾値についての合意は少ない。動脈修復後8時間以内の早期筋膜切開は、切断リスクを4倍低くし（OR 0.25、95% CI 0.16–0.39; p<.0001）、入院期間を短縮した。皮膚と筋膜の切開は組織を loosening し術後腫脹を許容できる長さを要し、下腿では2皮切4コンパートメント法が標準である。","detp":["外傷性虚血後下腿コンパートメント症候群の治療には、緊急4コンパートメント筋膜切開が推奨される。急性四肢コンパートメント症候群は、迅速に管理しなければ有意な罹患を生じる外科的緊急症である。US National Trauma Data Bankのデータでは、下肢動脈外傷患者の最大30%程度が筋膜切開を要したとされ、より最近の全国データ（TQIP 2017–2019）では下肢血管損傷後の筋膜切開率は以前の報告から有意に低下している。","診断で最も重要な道具は臨床的疑いを高く保つことで、古典的な臨床徴候を呈する患者はさらなる検査を要さず緊急筋膜切開を受けるべきである。動脈血管外傷後の虚血時間が数時間を超えることは筋膜切開の強い予測因子であった。コンパートメント圧はルーチンには測定されないが、意識障害などで評価不能な患者では用いられる。診断と治療の閾値についての合意は少ない。動脈修復後8時間以内の早期筋膜切開は、切断リスクを4倍低くし（OR 0.25、95% CI 0.16–0.39; p<.0001）、入院期間を短縮した。","皮膚と筋膜の切開は組織を loosening し術後腫脹を許容できる長さを要し、下腿では2皮切4コンパートメント法が標準である。"]},{"n":97,"ja":"四肢血管損傷・血管再建後の患者には、修復1か月後(異常所見・症状出現時はそれ以前)の臨床診察とduplex ultrasoundフォローアップを考慮してもよい","en":"Post-operative follow up with clinical examination and duplex ultrasound one month after repair, or earlier if abnormal findings or symptoms develop, may be considered for patients with extremity vascular injury and vascular reconstruction.","cls":"IIb","lvl":"C","sec":"四肢","page":40,"det":"四肢血管損傷・血管再建後の患者には、修復1か月後（異常所見・症状出現時はそれ以前）の臨床診察とduplex ultrasoundフォローアップを考慮してもよい。四肢血管外傷再建後のフォローアップとmodalityは文献でばらつき、臨床診察、ABI測定、color-coded DUS、CTAが様々な間隔で用いられている。臨床徴候の悪化や狭窄の証拠を示す患者には、DUS、CTA、MRI、血管造影が提案されてきた。末梢動脈疾患集団では、最近のCochrane解析で下肢血行再建後の切断・罹患・死亡の予防にDUSと標準サーベイランスの明確な差は示されなかった。\n\nInfrainguinal静脈グラフトのルーチンDUSサーベイランスの推奨は低品質エビデンスに依存するが、非侵襲性・低コスト・介入の機会を考慮すれば、末梢動脈疾患の下肢静脈グラフトのフォローアップにDUSを用いてよい。四肢血管外傷再建後のDUSサーベイランスプログラムの臨床利益を示すデータは不十分だが、bypass、interposition graft、stent graftの亜群はサーベイランスから利益を受けうると考えるのが合理的である。実務では1か月時の診察で脈拍・創・神経所見・腫脹を評価し、DUSで開存・狭窄・偽動脈瘤を確認する。異常があればCTAへ進む。","detp":["四肢血管損傷・血管再建後の患者には、修復1か月後（異常所見・症状出現時はそれ以前）の臨床診察とduplex ultrasoundフォローアップを考慮してもよい。四肢血管外傷再建後のフォローアップとmodalityは文献でばらつき、臨床診察、ABI測定、color-coded DUS、CTAが様々な間隔で用いられている。臨床徴候の悪化や狭窄の証拠を示す患者には、DUS、CTA、MRI、血管造影が提案されてきた。","末梢動脈疾患集団では、最近のCochrane解析で下肢血行再建後の切断・罹患・死亡の予防にDUSと標準サーベイランスの明確な差は示されなかった。Infrainguinal静脈グラフトのルーチンDUSサーベイランスの推奨は低品質エビデンスに依存するが、非侵襲性・低コスト・介入の機会を考慮すれば、末梢動脈疾患の下肢静脈グラフトのフォローアップにDUSを用いてよい。四肢血管外傷再建後のDUSサーベイランスプログラムの臨床利益を示すデータは不十分だが、bypass、interposition graft、stent graftの亜群はサーベイランスから利益を受けうると考えるのが合理的である。","実務では1か月時の診察で脈拍・創・神経所見・腫脹を評価し、DUSで開存・狭窄・偽動脈瘤を確認する。異常があればCTAへ進む。"]},{"n":98,"ja":"open/血管内修復を受けた血管外傷患者には、術後単剤抗血小板療法を考慮してもよい","en":"Post-operative single antiplatelet therapy may be considered for patients with vascular trauma who have undergone open or endovascular repair.","cls":"IIb","lvl":"C","sec":"術後","page":41,"det":"Openまたは血管内修復を受けた血管外傷患者には、術後単剤抗血小板療法を考慮してもよい。末梢動脈硬化性疾患の血管修復後の抗血栓療法の文献は、四肢血管外傷の動脈・静脈修復の大多数に一般化できない。術後抗血栓薬に関する文献は限られる。Khanらのメタ解析では、抗凝固は末梢四肢血管外傷手術の術中・術後合併症の減少にいくらかの利益がありうるが、抗凝固使用による負の転帰の増加は認められなかった。対照的に、ACS Trauma Quality Improvement Programを用いた最近の報告では、術後の未分画ヘパリン投与は末梢動脈損傷患者の出血合併症の増加と関連した。\n\n静脈グラフトで修復された動脈損傷患者の前向き観察多施設研究では、抗血栓なしと各種regimenの間で院内再介入や血栓症の差はなかったが、長期使用は検討範囲外であった。小規模後ろ向きマッチ解析でも、治療用量のアスピリンまたは静脈ヘパリンと抗血栓なしの間に出血・血栓症の差はなかった。術後出血の懸念と再建血栓症の競合リスクがあり、実践は施設間で大きく異なる。個別化された術後抗血栓戦略が助言されており、出血リスクと血栓リスク、血管修復の複雑さを評価してregimenを決める。","detp":["Openまたは血管内修復を受けた血管外傷患者には、術後単剤抗血小板療法を考慮してもよい。末梢動脈硬化性疾患の血管修復後の抗血栓療法の文献は、四肢血管外傷の動脈・静脈修復の大多数に一般化できない。術後抗血栓薬に関する文献は限られる。Khanらのメタ解析では、抗凝固は末梢四肢血管外傷手術の術中・術後合併症の減少にいくらかの利益がありうるが、抗凝固使用による負の転帰の増加は認められなかった。","対照的に、ACS Trauma Quality Improvement Programを用いた最近の報告では、術後の未分画ヘパリン投与は末梢動脈損傷患者の出血合併症の増加と関連した。静脈グラフトで修復された動脈損傷患者の前向き観察多施設研究では、抗血栓なしと各種regimenの間で院内再介入や血栓症の差はなかったが、長期使用は検討範囲外であった。小規模後ろ向きマッチ解析でも、治療用量のアスピリンまたは静脈ヘパリンと抗血栓なしの間に出血・血栓症の差はなかった。","術後出血の懸念と再建血栓症の競合リスクがあり、実践は施設間で大きく異なる。個別化された術後抗血栓戦略が助言されており、出血リスクと血栓リスク、血管修復の複雑さを評価してregimenを決める。"]},{"n":99,"ja":"血力学的に安定した小児外傷患者で血管損傷の確認・否定のためCTAを第一選択とする","en":"Computed tomography angiography is recommended as the first line investigation to identify or rule out vascular injury in haemodynamically stable paediatric trauma patients.","cls":"I","lvl":"C","sec":"小児","page":41,"det":"血力学的に安定した小児外傷患者で、血管損傷の確認・否定のためCTAを第一選択とする。小児の外傷性血管損傷は比較的にまれで、臨床エビデンスの全般的な欠如により確固たる管理推奨が難しい。小児血管外傷は、血管痙攣を起こしやすい小さな動脈、少ない循環血液量、将来の血管成長（縦断・周方向）の必要性、長期durabilityの考慮という特有の課題を poserする。小児は有効な代償能力を持ち、これが非手術管理アプローチを正当化することもある。\n\n診断検査としては、CTAが鈍的・穿通性のいずれの血管外傷でも高い感受性と特異性を示す、最も報告の多い画像modalityである。被曝低減のため小児用の低線量プロトコルを用い、撮影範囲を必要最小限に絞る。不安定例では画像を優先せず手術へ進む（成人と同様、推奨9の論理）。小児では血管径が小さく、画像上の内膜flapやvasospasmを損傷と誤認しうるため、読影は小児外傷に習熟した放射線科医と臨床像の突き合わせで行う。血管損傷が否定できない場合はDUSや経過観察での反復評価を組み合わせる。不安定例では画像を優先せず手術へ進む（成人と同様）。小児では血管径が小さく、画像上の内膜flapやvasospasmを損傷と誤認しうるため、読影は小児外傷に習熟した放射線科医と臨床像の突き合わせで行う。血管損傷が否定できない場合はDUSや経過観察での反復評価を組み合わせる。","detp":["血力学的に安定した小児外傷患者で、血管損傷の確認・否定のためCTAを第一選択とする。小児の外傷性血管損傷は比較的にまれで、臨床エビデンスの全般的な欠如により確固たる管理推奨が難しい。小児血管外傷は、血管痙攣を起こしやすい小さな動脈、少ない循環血液量、将来の血管成長（縦断・周方向）の必要性、長期durabilityの考慮という特有の課題を poserする。小児は有効な代償能力を持ち、これが非手術管理アプローチを正当化することもある。","診断検査としては、CTAが鈍的・穿通性のいずれの血管外傷でも高い感受性と特異性を示す、最も報告の多い画像modalityである。被曝低減のため小児用の低線量プロトコルを用い、撮影範囲を必要最小限に絞る。不安定例では画像を優先せず手術へ進む（成人と同様、推奨9の論理）。小児では血管径が小さく、画像上の内膜flapやvasospasmを損傷と誤認しうるため、読影は小児外傷に習熟した放射線科医と臨床像の突き合わせで行う。","血管損傷が否定できない場合はDUSや経過観察での反復評価を組み合わせる。不安定例では画像を優先せず手術へ進む（成人と同様）。小児では血管径が小さく、画像上の内膜flapやvasospasmを損傷と誤認しうるため、読影は小児外傷に習熟した放射線科医と臨床像の突き合わせで行う。血管損傷が否定できない場合はDUSや経過観察での反復評価を組み合わせる。"]},{"n":100,"ja":"鈍的低グレード頸動脈損傷(Grade 1/2)の小児には、早期抗血栓療法を推奨する","en":"Early antithrombotic therapy is recommended for children with blunt, low grade carotid artery injury (ESVS Grade 1 or 2).","cls":"I","lvl":"C","sec":"小児","page":41,"det":"鈍的低グレード頸動脈損傷（ESVS Grade 1/2）の小児には、早期抗血栓療法を推奨する。小児におけるBCVIの発生率は成人と同程度でありうるが、小児の頸部血管損傷の管理とCTA所見の解釈に関するデータは少ない。小規模研究は、選択的で個別化された管理戦略が安全であることを示唆する。軽微な病変（ESVS Grade 1/2）は抗血小板薬または抗凝固薬で治療できる。特定の抗血栓薬を推奨する強いエビデンスはなく、最近のメタ解析は単剤抗血小板薬を支持したが、小児（16歳未満）の研究をすべて除外していた。\n\n16歳未満でBCVIと診断された患者の小規模後ろ向き研究では、抗凝固と抗血小板の間に出血合併症率の差は観察されなかったが、フォローアップ画像での治癒率は抗血小板療法群で非有意に良好であった。増大する偽動脈瘤または活動性出血（ESVS Grade 2/3）は塞栓術またはopen repairで対処できる。動脈の有効なリモデリングを確実にするため、フォローアップは長期でなければならない。実務では、頭蓋内出血や実質臓器損傷とのバランスを取りつつ診断時から抗血栓療法を開始し、少なくとも3か月、画像で治癒が確認できるまで継続する。","detp":["鈍的低グレード頸動脈損傷（ESVS Grade 1/2）の小児には、早期抗血栓療法を推奨する。小児におけるBCVIの発生率は成人と同程度でありうるが、小児の頸部血管損傷の管理とCTA所見の解釈に関するデータは少ない。小規模研究は、選択的で個別化された管理戦略が安全であることを示唆する。軽微な病変（ESVS Grade 1/2）は抗血小板薬または抗凝固薬で治療できる。特定の抗血栓薬を推奨する強いエビデンスはなく、最近のメタ解析は単剤抗血小板薬を支持したが、小児（16歳未満）の研究をすべて除外していた。","16歳未満でBCVIと診断された患者の小規模後ろ向き研究では、抗凝固と抗血小板の間に出血合併症率の差は観察されなかったが、フォローアップ画像での治癒率は抗血小板療法群で非有意に良好であった。増大する偽動脈瘤または活動性出血（ESVS Grade 2/3）は塞栓術またはopen repairで対処できる。動脈の有効なリモデリングを確実にするため、フォローアップは長期でなければならない。","実務では、頭蓋内出血や実質臓器損傷とのバランスを取りつつ診断時から抗血栓療法を開始し、少なくとも3か月、画像で治癒が確認できるまで継続する。"]},{"n":101,"ja":"適切解剖を伴う鈍的胸部大動脈損傷(Grade 2/3)の小児には、第一選択手術治療として血管内ステントグラフト修復を考慮すべき","en":"Endovascular stent graft repair should be considered as the first line operative treatment for children with blunt thoracic aortic injury (ESVS Grade 2 or 3) and appropriate anatomy.","cls":"IIa","lvl":"C","sec":"小児","page":42,"det":"適切解剖を伴う鈍的胸部大動脈損傷（ESVS Grade 2/3）の小児には、第一選択手術治療として血管内ステントグラフト修復を考慮すべきとされる。小児のBTAIはまれで、鈍的機転の小児のうち数%が胸部大動脈損傷を受傷し、その相当数が死亡する。重度の頭部・体幹・下肢損傷を伴う交通事故の年長児が高リスク群である。成人と同様、来院時の生理状態と合併損傷がopen repairを危うくしうる一方、血管内修復は小径の大動脈・アクセス血管と敵対的な大動脈弓形態により複雑化する。長期成績は利用不能である。\n\nこれらの不利にもかかわらず、TEVARは救命またはbridging手技として（ESVS Grade 2/3）受け入れられている。小児のBTAIに対するTEVARの公開経験は限られ、Hosnらは14歳未満で血管内修復を受けた患者を少数同定したに過ぎず、RaulliらはNational Trauma Data Bank解析で、成人が小児より有意に高いTEVAR率を示し（小児数%、青少年十数%、成人数十%）、小児が非手術管理を最も受けやすい（小児半数前後、青少年約4割、成人約2割）と報告した。小さな偽動脈瘤（Grade 1）への初期非手術アプローチは小児で合理的と思われる。小児・若年の中期合併症はオーバーサイジングとbird-beakに起因するcollapse、migration、狭窄、閉塞であり、急性期には狭窄・完全血栓症・collapseが突然の高血圧、跛行、脊髄虚血、急性腎障害、内臓虚血として現れる最悪の合併症である。","detp":["適切解剖を伴う鈍的胸部大動脈損傷（ESVS Grade 2/3）の小児には、第一選択手術治療として血管内ステントグラフト修復を考慮すべきとされる。小児のBTAIはまれで、鈍的機転の小児のうち数%が胸部大動脈損傷を受傷し、その相当数が死亡する。重度の頭部・体幹・下肢損傷を伴う交通事故の年長児が高リスク群である。成人と同様、来院時の生理状態と合併損傷がopen repairを危うくしうる一方、血管内修復は小径の大動脈・アクセス血管と敵対的な大動脈弓形態により複雑化する。","長期成績は利用不能である。これらの不利にもかかわらず、TEVARは救命またはbridging手技として（ESVS Grade 2/3）受け入れられている。小児のBTAIに対するTEVARの公開経験は限られ、Hosnらは14歳未満で血管内修復を受けた患者を少数同定したに過ぎず、RaulliらはNational Trauma Data Bank解析で、成人が小児より有意に高いTEVAR率を示し（小児数%、青少年十数%、成人数十%）、小児が非手術管理を最も受けやすい（小児半数前後、青少年約4割、成人約2割）と報告した。","小さな偽動脈瘤（Grade 1）への初期非手術アプローチは小児で合理的と思われる。小児・若年の中期合併症はオーバーサイジングとbird-beakに起因するcollapse、migration、狭窄、閉塞であり、急性期には狭窄・完全血栓症・collapseが突然の高血圧、跛行、脊髄虚血、急性腎障害、内臓虚血として現れる最悪の合併症である。"]},{"n":102,"ja":"ショック状態で持続出血があり腹部大血管損傷が疑われる小児には、即時の外科的探索と止血を推奨する","en":"Immediate surgical exploration and bleeding control are recommended for children in shock with ongoing haemorrhage and suspicion of major abdominal vascular injury.","cls":"I","lvl":"C","sec":"小児","page":42,"det":"ショック状態で持続出血があり、腹部大血管損傷が疑われる小児には、即時の外科的探索と止血を推奨する。小児血管損傷のNational Trauma Data Bank研究（Barmparasら）では、腹部血管損傷（AVI）は2番目にcommonな損傷部位で、数%に報告された。AVI診断のgold standardはCTAで、高い感受性・特異性・陽性適中率・陰性適中率を示す。小児腹部外傷の大多数は非手術的に管理されるが、最大限の蘇生努力にもかかわらず血行動態が不安定な場合には緊急開腹が必須となる。\n\n小児AVIの管理戦略は成人外傷集団と 並行する。Open・血管内の治療modalityは遭遇する血管のサイズにより 課題となり、グラフトとデバイスの選択に適切な accommodationが必要となる。成長に伴う血管狭窄を防ぐ注意が必要で、これにはinterrupted sutureによるbevelled吻合、やや長めのDacronグラフトの使用が含まれうる。小児は循環血液量が少なく、出血に対する代償が急激に破綻するため、成人よりも早期に手術適応を判断する。蘇生は体重ベースの大量輸血プロトコルに沿って進める。","detp":["ショック状態で持続出血があり、腹部大血管損傷が疑われる小児には、即時の外科的探索と止血を推奨する。小児血管損傷のNational Trauma Data Bank研究（Barmparasら）では、腹部血管損傷（AVI）は2番目にcommonな損傷部位で、数%に報告された。AVI診断のgold standardはCTAで、高い感受性・特異性・陽性適中率・陰性適中率を示す。小児腹部外傷の大多数は非手術的に管理されるが、最大限の蘇生努力にもかかわらず血行動態が不安定な場合には緊急開腹が必須となる。","小児AVIの管理戦略は成人外傷集団と 並行する。Open・血管内の治療modalityは遭遇する血管のサイズにより 課題となり、グラフトとデバイスの選択に適切な accommodationが必要となる。成長に伴う血管狭窄を防ぐ注意が必要で、これにはinterrupted sutureによるbevelled吻合、やや長めのDacronグラフトの使用が含まれうる。小児は循環血液量が少なく、出血に対する代償が急激に破綻するため、成人よりも早期に手術適応を判断する。","蘇生は体重ベースの大量輸血プロトコルに沿って進める。"]},{"n":103,"ja":"上肢・下肢外傷のすべての小児に、成人ガイダンスに準じた臨床的血管診察を推奨する","en":"Clinical vascular examination in line with adult guidance is recommended in all children with upper or lower extremity trauma to identify potential haemorrhagic or ischaemic vascular injuries.","cls":"I","lvl":"C","sec":"小児","page":42,"det":"上肢・下肢外傷のすべての小児に、成人ガイダンスに準じた臨床的血管診察を推奨する。四肢は小児血管外傷で支配的な解剖学的位置である。最近の系統的レビューでは、小児では下肢より上肢が血管外傷を受けやすいとされた。年幼児では鈍的四肢損傷が最もcommonで（交通事故、転落、スポーツ関連）で、年長児では穿通性四肢損傷（ガラス、銃創、刺創）がより多くなる。ほとんどの場合primary repairが可能である。残念ながら修復の类型や手技に関する比較研究は存在しない。\n\n成長に伴う吻合部狭窄を防ぐためinterrupted sutureが言及されている。四肢血管外傷修復後の長期合併症はまれで、最近の系統的レビューによればバイパスグラフトが閉塞した場合でも臨床的結果は生じず、脚長不等の事例も発見されなかった。実務では、成人と同様にhard sign（活動性出血、拡大する血腫、無脈）とsoft sign（既往出血、神経損傷、近接創）を系統的に評価し、脈拍触知が不能または疑わしければCTAへ進む。小児はvasospasmにより一時的に脈拍が消失しうるため、温環境での再評価やDUSによる確認を組み合わせる。","detp":["上肢・下肢外傷のすべての小児に、成人ガイダンスに準じた臨床的血管診察を推奨する。四肢は小児血管外傷で支配的な解剖学的位置である。最近の系統的レビューでは、小児では下肢より上肢が血管外傷を受けやすいとされた。年幼児では鈍的四肢損傷が最もcommonで（交通事故、転落、スポーツ関連）で、年長児では穿通性四肢損傷（ガラス、銃創、刺創）がより多くなる。ほとんどの場合primary repairが可能である。","残念ながら修復の类型や手技に関する比較研究は存在しない。成長に伴う吻合部狭窄を防ぐためinterrupted sutureが言及されている。四肢血管外傷修復後の長期合併症はまれで、最近の系統的レビューによればバイパスグラフトが閉塞した場合でも臨床的結果は生じず、脚長不等の事例も発見されなかった。実務では、成人と同様にhard sign（活動性出血、拡大する血腫、無脈）とsoft sign（既往出血、神経損傷、近接創）を系統的に評価し、脈拍触知が不能または疑わしければCTAへ進む。","小児はvasospasmにより一時的に脈拍が消失しうるため、温環境での再評価やDUSによる確認を組み合わせる。"]},{"n":104,"ja":"上顆上腕骨骨折整復後に粉色で温かいが無脈の手を呈する小児には、急性虚血発症の綿密な観察付き非手術管理を考慮すべき","en":"Non-operative management should be considered in a child with a pink and warm, but pulseless, hand post-supracondylar humeral fracture reduction with close observation for the development of acute ischaemia.","cls":"IIa","lvl":"C","sec":"小児","page":42,"det":"上顆上腕骨骨折整復後にピンクで温かいが無脈の手を呈する小児には、急性虚血発症の綿密な観察付きの非手術管理を考慮すべきとされる。小児の上顆上腕骨骨折は肘部で最もcommonな骨折で、上腕動脈損傷は約8〜12%に生じる。無脈の上顆上腕骨骨折の全例で骨折のclosed reductionと固定が優先され、整復後に灌流不良の蒼白な手が残る場合には動脈の即時外科的探索が適応となる。一方、整復後にピンクで温かい無脈の手を呈する小児は、血管 compromiseの追加徴候が発現しない限りexpectantに管理できるとする支持が文献で継続している。\n\nこの方針の根拠は、①側副血行（尺骨側副動脈など）により手の灌流が保たれていること、②上腕動脈の内膜損傷や痙攣は時間とともに改善しうること、③不要な探索による神経（正中・桡骨・尺骨神経）損傷リスクを避けられること、である。観察は、手の色調・温度・毛細血管再充満・疼痛・感覚・運動を定時に評価し、蒼白・冷感・疼痛の増悪・コンパートメント徴候が出現すれば直ちに探索へ方針を変える。DUSやCTAは灌流の評価と病変の同定に補助的に用い、抗血栓療法の要否は個別に判断する。","detp":["上顆上腕骨骨折整復後にピンクで温かいが無脈の手を呈する小児には、急性虚血発症の綿密な観察付きの非手術管理を考慮すべきとされる。小児の上顆上腕骨骨折は肘部で最もcommonな骨折で、上腕動脈損傷は約8〜12%に生じる。無脈の上顆上腕骨骨折の全例で骨折のclosed reductionと固定が優先され、整復後に灌流不良の蒼白な手が残る場合には動脈の即時外科的探索が適応となる。一方、整復後にピンクで温かい無脈の手を呈する小児は、血管 compromiseの追加徴候が発現しない限りexpectantに管理できるとする支持が文献で継続している。","この方針の根拠は、①側副血行（尺骨側副動脈など）により手の灌流が保たれていること、②上腕動脈の内膜損傷や痙攣は時間とともに改善しうること、③不要な探索による神経（正中・桡骨・尺骨神経）損傷リスクを避けられること、である。観察は、手の色調・温度・毛細血管再充満・疼痛・感覚・運動を定時に評価し、蒼白・冷感・疼痛の増悪・コンパートメント徴候が出現すれば直ちに探索へ方針を変える。DUSやCTAは灌流の評価と病変の同定に補助的に用い、抗血栓療法の要否は個別に判断する。"]},{"n":105,"ja":"バイパス/間置グラフトで再建した四肢血管損傷の小児には、修復1か月後(異常時はそれ以前)の臨床診察とduplex ultrasoundフォローアップを考慮してもよい","en":"Post-operative follow up with clinical examination and duplex ultrasound one month after repair, or earlier if abnormal findings or symptoms develop, may be considered for children with extremity vascular injury reconstructed with bypass or interposition graft.","cls":"IIb","lvl":"C","sec":"小児","page":43,"det":"バイパスまたは間置グラフトで再建した四肢血管損傷の小児には、修復1か月後（異常所見・症状出現時はそれ以前）の臨床診察とduplex ultrasoundフォローアップを考慮してもよい。血管外傷後の小児患者に対する抗血栓療法の標準プロトコルは存在しない。アスピリンまたはclopidogrelを用いた抗血小板療法と、体重ベース投与のLMWHが提案されてきた。いくつかの研究のフォローアップ推奨は、血管修復後の臨床診察とcolor-coded DUS、および外傷後の動脈虚血で治療された小児のグラフトサーベイランスから構成された。\n\nサーベイランスCTAは、絶対必要でない限り小児では避けるべきである（被曝の生涯リスク）。フォローアップ頻度に関するエビデンスは少ない。実務では、1か月時の診察で脈拍・肢の成長・創・神経所見を評価し、DUSでグラフトの開存・狭窄・偽動脈瘤・拡張を確認する。小児の静脈グラフトは成長とともに拡張することが期待され、合成グラフトは相対的に狭窄リスクを持つため、画像での経時比較が重要となる。異常があればCTAまたは血管造影へ進み、必要な再介入を計画する。長期フォローアップは成長が完了するまで継続することが望ましい。","detp":["バイパスまたは間置グラフトで再建した四肢血管損傷の小児には、修復1か月後（異常所見・症状出現時はそれ以前）の臨床診察とduplex ultrasoundフォローアップを考慮してもよい。血管外傷後の小児患者に対する抗血栓療法の標準プロトコルは存在しない。アスピリンまたはclopidogrelを用いた抗血小板療法と、体重ベース投与のLMWHが提案されてきた。いくつかの研究のフォローアップ推奨は、血管修復後の臨床診察とcolor-coded DUS、および外傷後の動脈虚血で治療された小児のグラフトサーベイランスから構成された。","サーベイランスCTAは、絶対必要でない限り小児では避けるべきである（被曝の生涯リスク）。フォローアップ頻度に関するエビデンスは少ない。実務では、1か月時の診察で脈拍・肢の成長・創・神経所見を評価し、DUSでグラフトの開存・狭窄・偽動脈瘤・拡張を確認する。小児の静脈グラフトは成長とともに拡張することが期待され、合成グラフトは相対的に狭窄リスクを持つため、画像での経時比較が重要となる。","異常があればCTAまたは血管造影へ進み、必要な再介入を計画する。長期フォローアップは成長が完了するまで継続することが望ましい。"]}],"figs":{"fig1":{"title":"図1 ESVS 動脈外傷グレーディング","panels":[{"label":"Grade 1:内膜損傷・外膜輪郭は正常","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAEEA70DASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECBAUDBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfpCaOdezXto5+lRvTNq6Ne9aKtxWsWXFUtkVHaZULbimXFLULBLXLJJXLDKxZcVXZcVS04qFwKZdcUi64ol8iiXyKBoBnvQIzzQcmcaLM16JGctMMx6iMw1CMs1AyzUEyzUDLeoGWtVGWagZZqFZT0wzFplZhpqs00kZy0lWcaBWeaCrPL5ZQLyqkryqkXVVMtmlQtIrK0VVLXWygXjUoq8VRLpVIuFU3adV+8+ydL9a7nFu1Xs4z1acgAc69iu3TpXaW/RTr2K7vzTTYAAGTYA1xzeVfp6fybwTep88Zpea0C+FAvhQL6KLvFUXeZnu+7M932Z5oOs56DTONEM56JZnGi6zjRZmmkGaaQZppCZppozTSZmGkGaaTMw0hc00gzTSDNNJGaaSjOWkGaaJLnLSRnGgGcaBLnrQIzy+Lnl8KBfUUS+iiXgol4KJe7mPS9fwszOuNte/mk105Ca1UBomBLtx7Jau0rueV2zWs8+XVp5wAHOvYrt06V2lv0U69iu78002AA1LIAgybvXh01+kvP+TjV7WtD6HryzTW2aaQuaaQmaaIZy0gzlpKzONCEUnaRWVk       h('section', { className: 'block', id: 'figsec-p' },
        h('h3', { className: 'bhead' }, '患者説明用の図'),
        h(FigGrid, { fig: FIGS.fig5, onZoom: p.onZoom }),
        h(FigGrid, { fig: FIGS.fig6, onZoom: p.onZoom })
      )
    );
  }

  /* ---------------- 拡大ビューア ---------------- */
  function Zoomer(p) {
    var st = useState(false), big = st[0], setBig = st[1];
    useEffect(function () {
      var prev = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      function onKey(e) { if (e.key === 'Escape') p.onClose(); }
      window.addEventListener('keydown', onKey);
      return function () {
        document.body.style.overflow = prev;
        window.removeEventListener('keydown', onKey);
      };
    }, []);
    return h('div', { className: 'zoomer', role: 'dialog', 'aria-modal': 'true', 'aria-label': p.z.title + '：' + p.z.label },
      h('div', { className: 'zbar' },
        h('span', { className: 'zlabel' }, p.z.label),
        h('button', { className: 'zbtn', type: 'button', onClick: function () { setBig(!big); }, 'aria-pressed': big ? 'true' : 'false' },
          big ? '全体表示' : '拡大'),
        h('button', { className: 'zbtn close', type: 'button', onClick: p.onClose, 'aria-label': '閉じる' }, '✕')
      ),
      h('div', { className: 'zstage' + (big ? ' big' : '') },
        h('img', { src: p.z.src, alt: p.z.title + '：' + p.z.label })
      ),
      h('p', { className: 'zhint' }, big ? 'スクロールで細部を確認できます' : '「拡大」で細部を確認できます')
    );
  }

  /* ---------------- ルート ---------------- */
  function App() {
    var stTab = useState('home'), tab = stTab[0], setTab = stTab[1];
    var stQ = useState(''), q = stQ[0], setQ = stQ[1];
    var stSec = useState('all'), sec = stSec[0], setSec = stSec[1];
    var stCls = useState('all'), cls = stCls[0], setCls = stCls[1];
    var stOpen = useState({}), open = stOpen[0], setOpen = stOpen[1];
    var stBm = useState(function () {
      try {
        var a = JSON.parse(localStorage.getItem(BMKEY) || '[]'), o = {};
        a.forEach(function (k) { o[k] = true; });
        return o;
      } catch (e) { return {}; }
    }), bm = stBm[0], setBm = stBm[1];
    var stFocus = useState(null), focus = stFocus[0], setFocus = stFocus[1];
    var stZoom = useState(null), zoom = stZoom[0], setZoom = stZoom[1];

    useEffect(function () {
      try {
        localStorage.setItem(BMKEY, JSON.stringify(Object.keys(bm).filter(function (k) { return bm[k]; })));
      } catch (e) { /* プライベートモード等 */ }
    }, [bm]);

    useEffect(function () {
      if (focus === null) return undefined;
      setOpen(function (o) { var n = Object.assign({}, o); n[focus] = true; return n; });
      var t = setTimeout(function () {
        var el = document.getElementById('rec-' + focus);
        if (el) el.scrollIntoView({ block: 'center' });
      }, 160);
      setFocus(null);
      return function () { clearTimeout(t); };
    }, [focus]);

    useEffect(function () { window.scrollTo(0, 0); }, [tab]);

    var list = useMemo(function () {
      var qq = low(q).trim();
      return RECS.filter(function (r) {
        if (sec !== 'all' && r.sec !== sec) return false;
        if (cls !== 'all' && r.cls !== cls) return false;
        if (qq && low(r.ja + ' ' + r.det + ' ' + r.en + ' ' + r.n + ' ' + r.sec + ' ' + r.cls).indexOf(qq) === -1) return false;
        return true;
      });
    }, [q, sec, cls]);

    function onBm(n) {
      setBm(function (o) { var x = Object.assign({}, o); if (x[n]) delete x[n]; else x[n] = true; return x; });
    }
    function onOpen(n) {
      setOpen(function (o) { var x = Object.assign({}, o); x[n] = !x[n]; return x; });
    }
    function goRec(n) {
      setTab('recs'); setSec('all'); setCls('all'); setQ(''); setFocus(n);
    }
    function onType(e) {
      setQ(e.target.value);
      if (tab !== 'recs') setTab('recs');
    }

    return h('div', { className: 'app' },
      h('header', { className: 'top' },
        h('div', { className: 'toprow' },
          h('span', { className: 'brandmark', 'aria-hidden': 'true' }),
          h('h1', { className: 'apptitle' }, '血管外傷', h('small', null, 'ESVS 2025'))
        ),
        h('div', { className: 'searchwrap' },
          h('svg', { className: 'sicon', viewBox: '0 0 24 24', 'aria-hidden': 'true' },
            h('path', { d: 'M10 4a6 6 0 104.24 10.24l4.26 4.26 1.42-1.42-4.26-4.26A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z' })
          ),
          h('input', {
            className: 'search', type: 'search', enterKeyHint: 'search',
            placeholder: '番号・キーワードで検索（例：シャント、47）',
            value: q, onInput: onType, 'aria-label': '推奨を検索'
          })
        )
      ),

      h('main', { className: 'main' },
        tab === 'home' ? h(Home, { bm: bm, goRec: goRec, setTab: setTab, onZoom: setZoom }) : null,
        tab === 'recs' ? h(Recs, {
          list: list, q: q, sec: sec, setSec: setSec, cls: cls, setCls: setCls,
          bm: bm, open: open, onBm: onBm, onOpen: onOpen
        }) : null,
        tab === 'figs' ? h(Figs, { onZoom: setZoom }) : null,
        h('p', { className: 'disclaimer' },
          '本アプリは ESVS 2025 血管外傷診療ガイドライン（Eur J Vasc Endovasc Surg 2025;69:179–237、CC BY 4.0）の要点を日本語で参照するためのものです。実際の診療では必ず原著本文および施設プロトコルに従ってください。')
      ),

      h('nav', { className: 'botnav', 'aria-label': '画面切り替え' },
        h('button', {
          className: 'navbtn' + (tab === 'home' ? ' on' : ''), type: 'button',
          'aria-current': tab === 'home' ? 'page' : 'false',
          onClick: function () { setTab('home'); }
        },
          h('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' }, h('path', { d: 'M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z' })),
          h('span', null, 'ホーム')
        ),
        h('button', {
          className: 'navbtn' + (tab === 'recs' ? ' on' : ''), type: 'button',
          'aria-current': tab === 'recs' ? 'page' : 'false',
          onClick: function () { setTab('recs'); }
        },
          h('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' }, h('path', { d: 'M4 5h16v2H4zm0 6h16v2H4zm0 6h11v2H4z' })),
          h('span', null, '推奨 105')
        ),
        h('button', {
          className: 'navbtn' + (tab === 'figs' ? ' on' : ''), type: 'button',
          'aria-current': tab === 'figs' ? 'page' : 'false',
          onClick: function () { setTab('figs'); }
        },
          h('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' },
            h('path', { d: 'M4 4h16v16H4zm2 2v12h12V6zm1.5 10l3.5-4.6 2.6 3.4 1.7-1.9 2.2 3.1z' })),
          h('span', null, '図表')
        )
      ),

      zoom ? h(Zoomer, { z: zoom, onClose: function () { setZoom(null); } }) : null
    );
  }

  RD.createRoot(rootEl).render(h(App, null));
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', window.__vtBoot);
} else {
  window.__vtBoot();
}

</script>
</body>
</html>

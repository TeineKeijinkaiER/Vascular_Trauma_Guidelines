<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1a22">
<meta name="color-scheme" content="light">
<meta name="description" content="ESVS 2025 血管外傷ガイドラインの105推奨と図表を、日本語でスマホから素早く確認できるクイックリファレンス。各推奨をタップすると、ガイドライン本文に基づく500字超の日本語解説と英文原文が開きます。">
<title>血管外傷 ESVS 2025 クイックリファレンス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>

*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#e9edee;
  --surface:#ffffff;
  --surface-2:#f4f6f7;
  --ink:#0d1a22;
  --ink-2:#26363f;
  --muted:#5b6d78;
  --line:rgba(13,26,34,.12);
  --line-strong:rgba(13,26,34,.22);
  --do:#a8102c;          /* 推奨する系 */
  --do-tint:#fbeaed;
  --do-deep:#770a1e;
  --dont:#31424c;        /* 適応でない系 */
  --dont-tint:#e8ecee;
  --g1:#e6a0aa;
  --g2:#c94a5c;
  --g3:#a8102c;
  --gx:#31424c;
  --radius:16px;
  --radius-sm:10px;
  --shadow-1:0 1px 1px rgba(13,26,34,.05),0 2px 6px -3px rgba(13,26,34,.14);
  --shadow-2:0 1px 2px rgba(13,26,34,.06),0 10px 28px -16px rgba(13,26,34,.34);
  --step--1:clamp(.74rem,.71rem + .16vw,.8rem);
  --step-0:clamp(.94rem,.91rem + .2vw,1rem);
  --step-1:clamp(1.06rem,1rem + .4vw,1.18rem);
  --step-2:clamp(1.32rem,1.15rem + 1vw,1.72rem);
  --step-3:clamp(1.9rem,1.5rem + 2.4vw,2.7rem);
  --pad:clamp(14px,4vw,20px);
  --nav-h:calc(58px + env(safe-area-inset-bottom,0px));
  --head-h:calc(96px + env(safe-area-inset-top,0px));
  --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-disp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Noto Sans JP",system-ui,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:var(--step-0);line-height:1.85;
  font-feature-settings:"palt" 0;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2.5px solid var(--do);outline-offset:2px;border-radius:4px}

/* ---------- シェル ---------- */
.app{
  max-width:640px;margin:0 auto;min-height:100vh;background:var(--surface-2);
  box-shadow:0 0 0 1px rgba(13,26,34,.06),0 24px 60px -40px rgba(13,26,34,.5);
  display:flex;flex-direction:column;position:relative;
}
.top{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(10px + env(safe-area-inset-top,0px)) var(--pad) 12px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.toprow{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.brandmark{
  width:9px;height:22px;border-radius:2px;flex:0 0 auto;
  background:linear-gradient(180deg,var(--g1),var(--g3));
}
.apptitle{
  font-family:var(--font-disp);font-weight:900;font-size:1.06rem;letter-spacing:.02em;
  margin:0;display:flex;align-items:baseline;gap:8px;line-height:1.2;
}
.apptitle small{
  font-family:var(--font-num);font-weight:600;font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,255,255,.62);
}
.searchwrap{position:relative;display:flex;align-items:center}
.sicon{position:absolute;left:11px;width:17px;height:17px;fill:rgba(255,255,255,.5);pointer-events:none}
.search{
  width:100%;appearance:none;-webkit-appearance:none;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  border-radius:11px;padding:10px 12px 10px 34px;color:#fff;font-size:.9rem;line-height:1.4;
}
.search::placeholder{color:rgba(255,255,255,.55)}
.search::-webkit-search-cancel-button{-webkit-appearance:none;height:14px;width:14px;background:rgba(255,255,255,.4);clip-path:polygon(0 0,100% 100%,100% 0,0 100%)}

.main{flex:1 0 auto;padding-bottom:calc(var(--nav-h) + 14px)}
.page{padding:0 0 6px}

/* ---------- ヒーロー ---------- */
.hero{
  background:var(--ink);color:#fff;padding:6px var(--pad) 26px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:auto 0 0 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28) 18%,rgba(255,255,255,.28) 82%,transparent);
}
.hero-eye{
  font-family:var(--font-num);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
  color:#e08b98;margin:0 0 10px;font-weight:600;
}
.hero-title{
  font-family:var(--font-disp);font-weight:900;font-size:var(--step-3);line-height:1.14;
  letter-spacing:-.01em;margin:0 0 12px;
}
.hero-title em{
  display:block;font-style:normal;font-size:.52em;letter-spacing:.04em;
  color:#f0b7c0;margin-top:4px;font-weight:700;
}
.hero-sub{margin:0 0 20px;font-size:.86rem;line-height:1.8;color:rgba(255,255,255,.78);max-width:34em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.14);border-radius:12px;overflow:hidden}
.stat{background:var(--ink);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.statn{font-family:var(--font-num);font-weight:600;font-size:1.5rem;line-height:1;color:#fff;letter-spacing:.02em}
.statl{font-size:.66rem;color:rgba(255,255,255,.62);letter-spacing:.06em}

/* ---------- ブロック ---------- */
.block{padding:24px var(--pad) 6px}
.block + .block{border-top:1px solid var(--line);margin-top:6px}
.bhead{
  font-family:var(--font-disp);font-size:1.02rem;font-weight:700;letter-spacing:.01em;
  margin:0 0 14px;display:flex;align-items:center;gap:9px;line-height:1.4;
}
.bhead::before{content:"";width:14px;height:2px;background:var(--do);border-radius:2px;flex:0 0 auto}
.bcount{
  font-family:var(--font-num);font-size:.78rem;font-weight:600;letter-spacing:.06em;
  background:var(--do-tint);color:var(--do-deep);border-radius:999px;padding:1px 8px;
}
.empty{
  margin:0;padding:18px 16px;background:var(--surface);border:1px dashed var(--line-strong);
  border-radius:var(--radius-sm);color:var(--muted);font-size:.85rem;line-height:1.8;
}

/* ---------- 要点カード ---------- */
.kp{
  display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--do);
  border-radius:var(--radius-sm);padding:14px 15px 12px;margin-bottom:10px;
  box-shadow:var(--shadow-1);transition:transform .16s ease,box-shadow .16s ease;
}
.kp:hover{transform:translateY(-1px);box-shadow:var(--shadow-2)}
.kpt{display:block;font-family:var(--font-disp);font-weight:700;font-size:.95rem;line-height:1.5;margin-bottom:5px}
.kpb{display:block;font-size:.82rem;line-height:1.8;color:var(--ink-2)}
.kpr{
  display:block;margin-top:9px;font-size:.74rem;font-weight:600;color:var(--do);
  letter-spacing:.03em;
}
.kpr::after{content:" →"}

/* ---------- 図 ---------- */
.figblock{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-1)}
.figtitle{
  display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:.84rem;font-weight:700;
  line-height:1.6;border-bottom:1px solid var(--line);background:var(--surface);
  font-family:var(--font-disp);letter-spacing:.01em;
}
.figtag{
  font-family:var(--font-num);font-size:.66rem;letter-spacing:.1em;font-weight:600;
  background:var(--ink);color:#fff;border-radius:4px;padding:2px 6px;flex:0 0 auto;
}
.panels{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.panels.carousel{
  flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding:10px;gap:10px;background:var(--surface-2);
}
.panels.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.panel{
  display:block;width:100%;padding:0;background:var(--surface);text-align:left;position:relative;
}
.panels.carousel .panel{
  flex:0 0 74%;scroll-snap-align:center;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;background:var(--surface);
}
.panelimg{
  display:flex;align-items:center;justify-content:center;background:#fff;
  padding:6px;min-height:96px;overflow:hidden;
}
.panels.carousel .panelimg{min-height:180px}
.panelimg img{width:100%;height:auto;object-fit:contain}
.panels.carousel .panelimg img{max-height:260px;width:auto}
.plabel{
  display:flex;align-items:center;gap:7px;padding:9px 12px;font-size:.78rem;line-height:1.6;
  color:var(--ink-2);border-top:1px solid var(--line);background:var(--surface-2);
  font-weight:500;
}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--do);flex:0 0 auto}
.pzoom{
  margin-left:auto;font-size:.66rem;color:var(--muted);letter-spacing:.06em;flex:0 0 auto;
  border:1px solid var(--line-strong);border-radius:999px;padding:1px 7px;
}
.fignote{margin:0;padding:11px 14px;font-size:.76rem;line-height:1.8;color:var(--muted);border-top:1px solid var(--line);background:var(--surface)}

/* ---------- 表ブロック ---------- */
.tblock{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-1)}
.ttitle{
  font-family:var(--font-disp);font-size:.9rem;font-weight:700;line-height:1.6;
  margin:0;padding:13px 14px;border-bottom:1px solid var(--line);letter-spacing:.01em;
}
.tnote{margin:0;padding:10px 14px;font-size:.74rem;line-height:1.8;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.tnote:last-child{border-bottom:0;border-top:1px solid var(--line)}

/* グレード行 */
.grows{display:flex;flex-direction:column}
.grow{padding:13px 14px;border-bottom:1px solid var(--line);position:relative;padding-left:18px}
.grow:last-child{border-bottom:0}
.grow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gx)}
.grow.g-1::before{background:var(--g1)}
.grow.g-2::before{background:var(--g2)}
.grow.g-3::before{background:var(--g3)}
.grow.g-X::before{background:var(--gx)}
.ghead{display:flex;align-items:flex-start;gap:9px}
.gbadge{
  flex:0 0 auto;font-family:var(--font-num);font-weight:600;font-size:.72rem;letter-spacing:.05em;
  border-radius:5px;padding:2px 7px;color:#fff;background:var(--gx);margin-top:2px;white-space:nowrap;
}
.grow.g-1 .gbadge{background:var(--g1);color:#5a1c25}
.grow.g-2 .gbadge{background:var(--g2)}
.grow.g-3 .gbadge{background:var(--g3)}
.gdesc{margin:0;font-size:.84rem;line-height:1.75;font-weight:500}
.gcols{margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.gcol{display:grid;grid-template-columns:5.2em 1fr;gap:8px;align-items:baseline}
.gcol dt{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.gcol dd{margin:0;font-size:.81rem;line-height:1.75;color:var(--ink-2)}

/* 対応表 */
.pairs{display:flex;flex-direction:column}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:.82rem}
.pair:last-child{border-bottom:0}
.pa{color:var(--ink-2)}
.parrow{color:var(--do);font-weight:700;font-size:.85rem}
.pb{font-weight:600}

/* リスト表 */
.lgroup{padding:13px 14px;border-bottom:1px solid var(--line)}
.lgroup:last-child{border-bottom:0}
.lghead{
  margin:0 0 8px;font-size:.72rem;font-weight:700;letter-spacing:.08em;
  color:var(--do-deep);text-transform:none;
}
.llist{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.llist li{
  font-size:.78rem;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:5px 9px;color:var(--ink-2);
}
.warnlist{margin:0;padding:13px 14px 13px 14px;list-style:none;display:flex;flex-direction:column;gap:8px}
.warnlist li{
  position:relative;padding-left:20px;font-size:.83rem;line-height:1.7;
}
.warnlist li::before{
  content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;
  background:var(--do);box-shadow:0 0 0 2px var(--do-tint);
}

/* フロー */
.flow{list-style:none;margin:0;padding:14px;display:flex;flex-direction:column;gap:0}
.flowstep{display:flex;align-items:center;gap:11px;position:relative;padding-bottom:16px}
.flowstep:last-child{padding-bottom:0}
.flowstep::before{
  content:"";position:absolute;left:12px;top:26px;bottom:2px;width:2px;
  background:linear-gradient(180deg,var(--g2),rgba(168,16,44,.18));
}
.flowstep:last-child::before{display:none}
.flowi{
  flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:var(--do);color:#fff;
  font-family:var(--font-num);font-size:.82rem;font-weight:600;display:grid;place-items:center;
  line-height:1;z-index:1;
}
.flowt{font-size:.85rem;line-height:1.7;font-weight:500}

/* ---------- 凡例 ---------- */
.legend{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.legrow{display:flex;align-items:baseline;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px}
.legt{font-size:.79rem;line-height:1.7;color:var(--ink-2)}
.legt b{color:var(--ink)}

/* ---------- チップ ---------- */
.chip{
  display:inline-flex;align-items:center;font-size:.68rem;font-weight:700;line-height:1.5;
  border-radius:999px;padding:2px 9px;letter-spacing:.04em;white-space:nowrap;
  border:1px solid transparent;
}
.chip.cl{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink-2)}
.cl-I .chip.cl{background:var(--do);color:#fff;border-color:var(--do)}
.legrow.cl-I .chip.cl{background:var(--do);color:#fff;border-color:var(--do)}
.cl-IIa .chip.cl,.legrow.cl-IIa .chip.cl{background:var(--do-tint);color:var(--do-deep);border-color:rgba(168,16,44,.34)}
.cl-IIb .chip.cl,.legrow.cl-IIb .chip.cl{background:#fff;color:var(--do-deep);border-color:rgba(168,16,44,.3);border-style:dashed}
.cl-IIIa .chip.cl,.legrow.cl-IIIa .chip.cl{background:var(--dont);color:#fff;border-color:var(--dont)}
.cl-IIIb .chip.cl,.legrow.cl-IIIb .chip.cl{background:#1b2a33;color:#fff;border-color:#1b2a33}
.chip.lv{
  background:#eef4f6;color:#1c5a6b;border-color:rgba(28,90,107,.22);
  font-family:var(--font-num);letter-spacing:.08em;font-size:.72rem;
}
.chip.sec{background:var(--surface-2);color:var(--muted);border-color:var(--line);font-weight:500}
.chip.more{
  margin-left:auto;background:var(--surface);color:var(--ink-2);border-color:var(--line-strong);
  font-weight:600;font-size:.66rem;
}
.chip.more[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.f{
  background:var(--surface);border-color:var(--line-strong);color:var(--ink-2);
  font-size:.74rem;padding:5px 11px;font-weight:600;letter-spacing:.02em;
}
.chip.f.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.f.on.cl-I{background:var(--do);border-color:var(--do)}
.chip.f.on.cl-IIIa{background:var(--dont);border-color:var(--dont)}
.chip.f.on.cl-IIIb{background:#1b2a33;border-color:#1b2a33}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- フィルタ ---------- */
.filters{
  position:sticky;top:var(--head-h);z-index:15;background:var(--surface-2);
  padding:12px var(--pad) 10px;border-bottom:1px solid var(--line);
  box-shadow:0 6px 12px -12px rgba(13,26,34,.5);
  display:flex;flex-direction:column;gap:7px;
}
.fcount{margin:2px 0 0;font-size:.72rem;color:var(--muted);letter-spacing:.04em;font-family:var(--font-num);font-weight:500}
.jumpbar{
  position:sticky;top:var(--head-h);z-index:15;display:flex;gap:6px;overflow-x:auto;
  padding:11px var(--pad);background:rgba(244,246,247,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);scrollbar-width:none;
}
.jumpbar::-webkit-scrollbar{display:none}

/* ---------- 推奨カード ---------- */
.reclist{padding:12px var(--pad) 4px;display:flex;flex-direction:column;gap:9px}
.rec{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gx);
  border-radius:var(--radius-sm);padding:12px 13px 11px;box-shadow:var(--shadow-1);
  scroll-margin-top:calc(var(--head-h) + 128px);
}
.rec.cl-I{border-left-color:var(--do)}
.rec.cl-IIa{border-left-color:var(--g2)}
.rec.cl-IIb{border-left-color:var(--g1)}
.rec.cl-IIIa{border-left-color:var(--dont)}
.rec.cl-IIIb{border-left-color:#1b2a33}
.rec-top{display:flex;align-items:flex-start;gap:6px}
.rec-main{
  display:flex;align-items:flex-start;gap:10px;flex:1 1 auto;min-width:0;
  text-align:left;padding:2px 0 0;border-radius:8px;
}
.rec-main:active{opacity:.7}
.rec-caret{
  flex:0 0 auto;align-self:flex-start;margin-left:auto;margin-top:1px;
  font-size:.64rem;font-weight:700;color:var(--muted);letter-spacing:.04em;
  border:1px solid var(--line-strong);border-radius:999px;padding:1px 8px;
  white-space:nowrap;background:var(--surface-2);
}
.rec.is-open .rec-caret{background:var(--ink);color:#fff;border-color:var(--ink)}
.rec-num{
  flex:0 0 auto;font-family:var(--font-num);font-weight:600;font-size:.86rem;line-height:1.35;
  min-width:26px;height:24px;display:grid;place-items:center;border-radius:6px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.rec.cl-I .rec-num{background:var(--do);border-color:var(--do);color:#fff}
.rec.cl-IIIa .rec-num{background:var(--dont);border-color:var(--dont);color:#fff}
.rec.cl-IIIb .rec-num{background:#1b2a33;border-color:#1b2a33;color:#fff}
.rec-num.sm{font-size:.74rem;min-width:23px;height:21px}
.rec-ja{display:block;margin:0;font-size:.88rem;line-height:1.82;font-weight:500;letter-spacing:.005em;flex:1 1 auto}
.star{
  flex:0 0 auto;font-size:1.05rem;line-height:1;color:#c3ced3;padding:2px 2px;
  transition:color .15s ease,transform .15s ease;
}
.star.on{color:#e0a92e;transform:scale(1.06)}
.rec-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding-left:36px}
.rec.is-open{border-left-width:5px;box-shadow:var(--shadow-2)}
.rec-body{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong)}
.rec-sec + .rec-sec{margin-top:13px}
.rec-sh{
  margin:0 0 5px;font-family:var(--font-num);font-size:.66rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--do);
}
.rec-sec + .rec-sec .rec-sh{color:var(--muted)}
.rec-det{
  margin:0;font-size:.845rem;line-height:1.92;color:var(--ink);
  letter-spacing:.005em;
}
.rec-det + .rec-det{margin-top:9px}
.rec-en{
  margin:0;font-size:.76rem;line-height:1.7;color:var(--muted);
  font-family:"Noto Sans JP",system-ui,sans-serif;
  background:var(--surface-2);border-radius:8px;padding:9px 11px;
  border:1px solid var(--line);
}
.rec-src{
  margin:8px 0 0;font-family:var(--font-num);font-size:.7rem;letter-spacing:.06em;
  color:var(--muted);
}

/* ---------- ブックマーク ---------- */
.bmlist{display:flex;flex-direction:column;gap:7px}
.bmrow{
  display:flex;align-items:flex-start;gap:9px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:10px 12px;box-shadow:var(--shadow-1);
}
.bmtext{font-size:.82rem;line-height:1.75}
.ghost{
  display:inline-block;margin:0 0 16px;font-size:.78rem;font-weight:700;color:var(--do);
  border-bottom:1.5px solid rgba(168,16,44,.35);padding-bottom:1px;
}

/* ---------- ボトムナビ ---------- */
.botnav{
  position:sticky;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
}
.navbtn{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;
  font-size:.66rem;letter-spacing:.03em;color:var(--muted);font-weight:600;position:relative;
  transition:color .15s ease;
}
.navbtn svg{width:21px;height:21px;fill:currentColor;opacity:.72}
.navbtn.on{color:var(--do)}
.navbtn.on svg{opacity:1}
.navbtn.on::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--do);
}

/* ---------- 免責 ---------- */
.disclaimer{
  margin:18px var(--pad) 24px;padding:13px 14px;font-size:.71rem;line-height:1.85;
  color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
}

/* ---------- ビューア ---------- */
.zoomer{
  position:fixed;inset:0;z-index:80;background:rgba(9,17,23,.94);
  display:flex;flex-direction:column;
  animation:fadein .16s ease-out;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.zbar{
  display:flex;align-items:center;gap:8px;padding:calc(9px + env(safe-area-inset-top,0px)) 12px 9px;
  color:#fff;border-bottom:1px solid rgba(255,255,255,.14);
}
.zlabel{
  flex:1 1 auto;font-size:.78rem;line-height:1.5;color:rgba(255,255,255,.88);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.zbtn{
  flex:0 0 auto;font-size:.74rem;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.3);
  border-radius:8px;padding:5px 11px;background:rgba(255,255,255,.08);
}
.zbtn.close{padding:5px 9px;font-size:.82rem}
.zstage{
  flex:1 1 auto;overflow:auto;display:grid;place-items:center;padding:12px;
  -webkit-overflow-scrolling:touch;
}
.zstage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#fff;border-radius:8px}
.zstage.big{display:block;overflow:auto}
.zstage.big img{max-width:none;max-height:none;width:200%;margin:0 auto}
.zhint{
  margin:0;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:.68rem;color:rgba(255,255,255,.6);letter-spacing:.04em;
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
@media print{
  body{background:#fff}
  .top,.botnav,.jumpbar,.filters,.zoomer{display:none !important}
  .app{box-shadow:none;max-width:none}
  .hero{background:#fff;color:#000;border-bottom:1px solid #000}
  .hero-title em{color:#000}
  .figblock,.tblock,.rec,.kp{break-inside:avoid;box-shadow:none}
}
@page{size:A4;margin:14mm}

<script id="guidedata" type="application/json">{"recs":[{"n":1,"ja":"生命・四肢を脅かす血管損傷の管理には、止血と開胸・開腹/血管内手術の両方に習熟した臨床チームへの24時間365日のアクセスを確保する","en":"Rapid access to a clinical team 24/7 competent in haemorrhage control and delivery of both open and endovascular surgery is recommended for the management of patients with life or limb threatening vascular injuries.","cls":"I","lvl":"C","sec":"総論","page":10,"det":"本節は「血管外傷の手術を誰が担うか」を扱う。生命・四肢を脅かす血管損傷への介入は、勤務時間外でも決断と正確さを同時に要求され、待機的な血管手術とは判断・展開・手技が異なる。欧州各国・世界各地でopen手技と血管内手技の訓練状況は大きく異なり、急性期の血管外傷診療を実際に提供できる血管外科医は決して多くない。血管外科のレジデンシーやフェローシップ（または同等の訓練）を経ていない術者の役割は縮小すべきとの合意が形成されつつあるが、同時に一般救急外科医のopen血管手技の経験は近年さらに限られ、能力の獲得・維持が難しいという矛盾がある。それでもあらゆる環境で人材と訓練の解を用意する必要がある。\n\n実務上は、症例数の多い外傷センターの外傷一般外科医が穿通性損傷の多くのopen手術を担えるが、膝下（infrapopliteal）損傷は血管外科医の領域として残る傾向がある。救急・一般外科医は血管内手技に習熟していることがまれで、治療選択肢の幅を狭めうる。小児血管外傷は専門家がさらに少なく複数科の関与が必須である。多くの施設では一般外科・血管外科・IVR（interventional radiology）の多職種チームで24時間365日対応しうる体制を組むことが現実的であり、軍・災害環境では血管外傷の頻度が高いのに専門家へのアクセスが乏しい点も前提に置く。本推奨は「特定の専門医の単独完結」ではなく「必要な技能集合に確実に到達できる経路の保証」を求めている点が要点である。","detp":["本節は「血管外傷の手術を誰が担うか」を扱う。生命・四肢を脅かす血管損傷への介入は、勤務時間外でも決断と正確さを同時に要求され、待機的な血管手術とは判断・展開・手技が異なる。欧州各国・世界各地でopen手技と血管内手技の訓練状況は大きく異なり、急性期の血管外傷診療を実際に提供できる血管外科医は決して多くない。血管外科のレジデンシーやフェローシップ（または同等の訓練）を経ていない術者の役割は縮小すべきとの合意が形成されつつあるが、同時に一般救急外科医のopen血管手技の経験は近年さらに限られ、能力の獲得・維持が難しいという矛盾がある。","それでもあらゆる環境で人材と訓練の解を用意する必要がある。実務上は、症例数の多い外傷センターの外傷一般外科医が穿通性損傷の多くのopen手術を担えるが、膝下（infrapopliteal）損傷は血管外科医の領域として残る傾向がある。救急・一般外科医は血管内手技に習熟していることがまれで、治療選択肢の幅を狭めうる。小児血管外傷は専門家がさらに少なく複数科の関与が必須である。多くの施設では一般外科・血管外科・IVR（interventional radiology）の多職種チームで24時間365日対応しうる体制を組むことが現実的であり、軍・災害環境では血管外傷の頻度が高いのに専門家へのアクセスが乏しい点も前提に置く。","本推奨は「特定の専門医の単独完結」ではなく「必要な技能集合に確実に到達できる経路の保証」を求めている点が要点である。"]},{"n":2,"ja":"血管外傷の意思決定と手技スキルを習得・維持するため、市民・軍向けの血管外傷カリキュラムと専門訓練を実施する","en":"Implementation of civilian and military vascular trauma curricula and dedicated training are recommended for the development and maintenance of vascular trauma decision making and technical skills.","cls":"I","lvl":"C","sec":"総論","page":10,"det":"血管外傷手術に必要な技能集合は、単一の標準専門領域の中には収まらない。損傷血管の迅速な露出と制御は胸部・腹部・骨盤・頸部・四肢のすべての主要動静脈を対象とし、ダメージコントロール手技として血栓摘除、一次縫合修復、シャント、結紮、筋膜切開、切断があり、確定的修復として血管内治療、吻合、間置グラフトがある。四肢外傷は日常の救急・待機血管手術に最も近いが、意思決定・アプローチ・手技に重要な相違があり、体幹血管では移植・肝胆膵・胸部外科など他科との協働が必要になる。\n\nこの技能を一人の術者で開発・維持するのは、手術量の多い高volume外傷センター以外では困難である。加えて、活動性出血で循環が破綻しつつある患者の「血の溜まった術野」から手技を始めることに慣れておく必要がある。シミュレーション・献体・動物モデルを用いた血管確保と制御のコースは技能の獲得と維持に有用であり、外傷手術は他の血管緊急症よりも多職種チームが複雑であるため、リーダーシップ・チームワーク・communicationを目的とした学際的・多職種チーム訓練が転帰に直結する。最終的には高volume外傷センターでの専従期間に代わるものはなく、それを民間・軍のキャリアを通じて反復訪問で維持することが現実的な解となる。","detp":["血管外傷手術に必要な技能集合は、単一の標準専門領域の中には収まらない。損傷血管の迅速な露出と制御は胸部・腹部・骨盤・頸部・四肢のすべての主要動静脈を対象とし、ダメージコントロール手技として血栓摘除、一次縫合修復、シャント、結紮、筋膜切開、切断があり、確定的修復として血管内治療、吻合、間置グラフトがある。四肢外傷は日常の救急・待機血管手術に最も近いが、意思決定・アプローチ・手技に重要な相違があり、体幹血管では移植・肝胆膵・胸部外科など他科との協働が必要になる。","この技能を一人の術者で開発・維持するのは、手術量の多い高volume外傷センター以外では困難である。加えて、活動性出血で循環が破綻しつつある患者の「血の溜まった術野」から手技を始めることに慣れておく必要がある。シミュレーション・献体・動物モデルを用いた血管確保と制御のコースは技能の獲得と維持に有用であり、外傷手術は他の血管緊急症よりも多職種チームが複雑であるため、リーダーシップ・チームワーク・communicationを目的とした学際的・多職種チーム訓練が転帰に直結する。","最終的には高volume外傷センターでの専従期間に代わるものはなく、それを民間・軍のキャリアを通じて反復訪問で維持することが現実的な解となる。"]},{"n":3,"ja":"血管損傷を伴う外傷患者の手術治療には、ハイブリッド機能を持つ手術室への緊急アクセスを確保する","en":"Emergency access to an operating room with hybrid capability is recommended for the operative treatment of the trauma patient with a vascular injury.","cls":"I","lvl":"C","sec":"総論","page":11,"det":"急性血管損傷と関連損傷の最大25%で血管内手技が用いられるようになったが、その大半は血力学的に安定した患者である。最も多いのは活動性出血血管の塞栓術で、外科的到達が困難な骨盤内、胸壁、臀部・四肢の深部血管、さらに安定患者の実質臓器損傷で有用性が高い。鈍的胸部大動脈損傷は、open手術に対する手技的・転帰的な優位性が明確な唯一の領域であり、その他の血管損傷では症例報告と小規模seriesに留まりエビデンス基盤は低い。\n\nもっとも有効なのは到達困難部位、すなわち胸部大動脈や鎖骨下動脈で、中枢側制御と確定的ステントグラフト（被覆ステント）修復を組み合わせたハイブリッド戦略が可能になる。一方、末梢動脈損傷にステントグラフトを用いると、デブリードマンや合併する静脈・神経損傷の評価が不十分になり、長期開存性とdurability、フォローアップ困難な患者集団という問題が残る。段階的止血（ダメージコントロール）の一部としては位置づけがある。ハイブリッド手術室は困難な血管確保と出血制御を多面的に扱え、適切な場所と人員体制が整えば蘇生と確定的血管制御までの時間を短縮しうる。血管内・ハイブリッド管理の潜在能力はまだ引き出されていないというのが本文の見立てである。","detp":["急性血管損傷と関連損傷の最大25%で血管内手技が用いられるようになったが、その大半は血力学的に安定した患者である。最も多いのは活動性出血血管の塞栓術で、外科的到達が困難な骨盤内、胸壁、臀部・四肢の深部血管、さらに安定患者の実質臓器損傷で有用性が高い。鈍的胸部大動脈損傷は、open手術に対する手技的・転帰的な優位性が明確な唯一の領域であり、その他の血管損傷では症例報告と小規模seriesに留まりエビデンス基盤は低い。","もっとも有効なのは到達困難部位、すなわち胸部大動脈や鎖骨下動脈で、中枢側制御と確定的ステントグラフト（被覆ステント）修復を組み合わせたハイブリッド戦略が可能になる。一方、末梢動脈損傷にステントグラフトを用いると、デブリードマンや合併する静脈・神経損傷の評価が不十分になり、長期開存性とdurability、フォローアップ困難な患者集団という問題が残る。段階的止血（ダメージコントロール）の一部としては位置づけがある。","ハイブリッド手術室は困難な血管確保と出血制御を多面的に扱え、適切な場所と人員体制が整えば蘇生と確定的血管制御までの時間を短縮しうる。血管内・ハイブリッド管理の潜在能力はまだ引き出されていないというのが本文の見立てである。"]},{"n":4,"ja":"ダメージコントロール蘇生の原則と大量輸血プロトコルを、血管外傷患者にも適用する","en":"Damage control resuscitation principles and massive transfusion protocols used for patients with traumatic haemorrhage are recommended for patients with vascular trauma.","cls":"I","lvl":"A","sec":"総論","page":11,"det":"出血性外傷の管理は集中的に研究されてきた領域で、現在のガイドラインは全血またはバランスの取れた血漿製剤の等価比による容量蘇生を中心に据える。活動性出血に対する現代のダメージコントロール蘇生（DCR）は、凝固障害と、重度虚血・大量輸血に伴う病態生理変化の予防・同定・治療を目標とし、許容的低血圧、止血蘇生、ダメージコントロール手術を統合する。重要なのは、血管損傷に特化した蘇生研究は存在せず、他の出血源と異なるアプローチを示すエビデンスも見つかっていない点である。したがって外傷性出血で確立した原則をそのまま適用する。\n\n実務では、来院早期からの大量輸血プロトコル起動、血漿・血小板を含む比率を意識した輸血、凝固能モニタリング（粘弾性検査を含む）、低体温・アシドーシス・低カルシウムの是正を並行して進める。血管外傷では長時間の阻血と大量輸血が重なるため、再灌流障害と凝固障害の二方向に注意を払う。許容的低血圧は「止血までのつなぎ」であり、重度外傷性脳損傷など脳灌流を保つ必要がある症例では標的血圧を引き上げる。本推奨は特定の輸液戦略の細部ではなく、血管外傷を「出血性外傷の一亜型」として標準プロトコルに乗せることを求めており、その点でエビデンスレベルAとされている。","detp":["出血性外傷の管理は集中的に研究されてきた領域で、現在のガイドラインは全血またはバランスの取れた血漿製剤の等価比による容量蘇生を中心に据える。活動性出血に対する現代のダメージコントロール蘇生（DCR）は、凝固障害と、重度虚血・大量輸血に伴う病態生理変化の予防・同定・治療を目標とし、許容的低血圧、止血蘇生、ダメージコントロール手術を統合する。重要なのは、血管損傷に特化した蘇生研究は存在せず、他の出血源と異なるアプローチを示すエビデンスも見つかっていない点である。","したがって外傷性出血で確立した原則をそのまま適用する。実務では、来院早期からの大量輸血プロトコル起動、血漿・血小板を含む比率を意識した輸血、凝固能モニタリング（粘弾性検査を含む）、低体温・アシドーシス・低カルシウムの是正を並行して進める。血管外傷では長時間の阻血と大量輸血が重なるため、再灌流障害と凝固障害の二方向に注意を払う。許容的低血圧は「止血までのつなぎ」であり、重度外傷性脳損傷など脳灌流を保つ必要がある症例では標的血圧を引き上げる。","本推奨は特定の輸液戦略の細部ではなく、血管外傷を「出血性外傷の一亜型」として標準プロトコルに乗せることを求めており、その点でエビデンスレベルAとされている。"]},{"n":5,"ja":"重度出血を伴うすべての血管外傷患者に、トラネキサム酸の早期投与を行う","en":"Early administration of tranexamic acid is recommended for all severely bleeding patients with vascular trauma.","cls":"I","lvl":"A","sec":"総論","page":11,"det":"CRASH-2試験は81か国の病院で2万人超の成人外傷患者を対象に、有意出血またはそのリスクを有する患者をトラネキサム酸（10分かけて1gの負荷投与、その後8時間で1gの持続投与）とプラセボに無作為割付した。全死亡はトラネキサム酸群14.5%、プラセボ群16.0%（相対リスク0.91、95%信頼区間0.85–0.97）と有意に低下し、出血による死亡も4.9%対5.7%（相対リスク0.85、0.76–0.96）と有意に減少した。7件の無作為化試験を含む系統的レビューでは、投与後の血管閉塞性事象の増加を示す説得力のあるエビデンスは得られていない。PROOVITレジストリでも、大血管修復を要する外傷においてトラネキサム酸は血栓関連の手技的失敗のリスク上昇と関連しなかった。\n\nしたがって、重度出血を伴う血管外傷患者には早期投与を行い、用量は既存のRCTに基づく各国の外傷ガイドラインに従う。実務上の要点は「早期」であり、受傷後3時間を超えた投与では利益が減衰し、出血リスクの高い投与設計に注意する。血管外傷では「止血した血管の血栓閉塞」を懸念する声があるが、現時点のエビデンスはそれを支持しない。線維素溶解の亢進した凝固障害例では特に利益が大きいと考えられ、蘇生プロトコルの中に組み込んでおくことが望ましい。","detp":["CRASH-2試験は81か国の病院で2万人超の成人外傷患者を対象に、有意出血またはそのリスクを有する患者をトラネキサム酸（10分かけて1gの負荷投与、その後8時間で1gの持続投与）とプラセボに無作為割付した。全死亡はトラネキサム酸群14.5%、プラセボ群16.0%（相対リスク0.91、95%信頼区間0.85–0.97）と有意に低下し、出血による死亡も4.9%対5.7%（相対リスク0.85、0.76–0.96）と有意に減少した。","7件の無作為化試験を含む系統的レビューでは、投与後の血管閉塞性事象の増加を示す説得力のあるエビデンスは得られていない。PROOVITレジストリでも、大血管修復を要する外傷においてトラネキサム酸は血栓関連の手技的失敗のリスク上昇と関連しなかった。したがって、重度出血を伴う血管外傷患者には早期投与を行い、用量は既存のRCTに基づく各国の外傷ガイドラインに従う。実務上の要点は「早期」であり、受傷後3時間を超えた投与では利益が減衰し、出血リスクの高い投与設計に注意する。","血管外傷では「止血した血管の血栓閉塞」を懸念する声があるが、現時点のエビデンスはそれを支持しない。線維素溶解の亢進した凝固障害例では特に利益が大きいと考えられ、蘇生プロトコルの中に組み込んでおくことが望ましい。"]},{"n":6,"ja":"四肢血管外傷のコントロール不能な出血で局所圧迫・パッキングが不十分な場合、病院前でできるだけ末梢に駆血帯を装着する","en":"A pre-hospital tourniquet, applied as distally as possible, is recommended for patients with uncontrolled bleeding from extremity vascular trauma when local compression and or packing are not suf ficient.","cls":"I","lvl":"C","sec":"総論","page":12,"det":"四肢血管外傷からの出血の多くは直接圧迫で制御でき、これが初期治療の主柱である。しかし一部は局所圧迫やパッキングで制御できず、あるいは環境要因（多数傷病者、狭所、夜間、長時間の搬送）が圧迫の継続を妨げる。こうした状況では、病院前の駆血帯装着が止血の改善と輸血必要量の低下をもたらすことが、軍・民間いずれの設定でも示されている。無作為化試験は存在しないが、前向き・後ろ向き研究の結果は一致している。ショック発症前、可能な限り末梢側への装着が失血死を防ぎ、報告されている合併症リスクは低い。\n\n実務では、装着時刻を必ず記録し、搬送が遷延する場合は位置の再確認や止血帯・圧迫包帯への転換を検討する。不要になれば管理下で可及的に早期に解除し、解除後は再出血と、長時間阻血に伴う再灌流・コンパートメント症候群の徴候を評価する。鎮痛と鎮静を忘れないことも重要である（駆血帯による疼痛は血圧変動と体動を招く）。なお、装着前の圧迫で止血できている症例に漫然と駆血帯を追加しない。本推奨は「圧迫で足りない場合に限る」という適用条件と「装着時刻の記録」という運用条件を明確にしている点が実践的である。現場での判断として、圧迫で止血できている間は駆血帯を追加しないこと、装着したら時刻を創部近くに明記すること、搬送が長引く場合は位置の再確認と止血帯・圧迫包帯への転換を検討すること、解除後は再出血と再灌流（コンパートメント症候群）の両方を評価すること、鎮痛を忘れないこと（疼痛は血圧変動と体動を招く）が要点となる。","detp":["四肢血管外傷からの出血の多くは直接圧迫で制御でき、これが初期治療の主柱である。しかし一部は局所圧迫やパッキングで制御できず、あるいは環境要因（多数傷病者、狭所、夜間、長時間の搬送）が圧迫の継続を妨げる。こうした状況では、病院前の駆血帯装着が止血の改善と輸血必要量の低下をもたらすことが、軍・民間いずれの設定でも示されている。無作為化試験は存在しないが、前向き・後ろ向き研究の結果は一致している。","ショック発症前、可能な限り末梢側への装着が失血死を防ぎ、報告されている合併症リスクは低い。実務では、装着時刻を必ず記録し、搬送が遷延する場合は位置の再確認や止血帯・圧迫包帯への転換を検討する。不要になれば管理下で可及的に早期に解除し、解除後は再出血と、長時間阻血に伴う再灌流・コンパートメント症候群の徴候を評価する。鎮痛と鎮静を忘れないことも重要である（駆血帯による疼痛は血圧変動と体動を招く）。","なお、装着前の圧迫で止血できている症例に漫然と駆血帯を追加しない。本推奨は「圧迫で足りない場合に限る」という適用条件と「装着時刻の記録」という運用条件を明確にしている点が実践的である。現場での判断として、圧迫で止血できている間は駆血帯を追加しないこと、装着したら時刻を創部近くに明記すること、搬送が長引く場合は位置の再確認と止血帯・圧迫包帯への転換を検討すること、解除後は再出血と再灌流（コンパートメント症候群）の両方を評価すること、鎮痛を忘れないこと（疼痛は血圧変動と体動を招く）が要点となる。"]},{"n":7,"ja":"四肢血管外傷のコントロール不能な出血における駆血帯管理の一部として、ヘパリン化は適応ではない","en":"Heparinisation is not indicated as part of tourniquet management in patients with uncontrolled bleeding from extremity vascular trauma.","cls":"IIIa","lvl":"C","sec":"総論","page":12,"det":"駆血帯を用いたという理由だけでヘパリン化を行うことは適応ではない。これを支持するエビデンスは存在せず、出血リスクを高める方向に働く。駆血帯装着は四肢の血流を完全に遮断する操作であり、長時間の阻血は局所の血栓形成や再灌流障害につながりうるため、現場では「血栓予防にヘパリンを」と考えたくなる状況があるが、外傷急性期には全身ヘパリン化が望ましくない場面が多い。実際、頭部外傷や実質臓器損傷の合併、止血が不完全な創、凝固障害が併存することが多く、抗凝固は出血を助長しうる。\n\n術中の全身ヘパリン化の是非は別途、修復範囲・血流遮断時間・合併損傷・出血リスク・外傷性凝固障害を踏まえて個別に判断される（推奨94）。本推奨は、駆血帯の管理を理由にした一律のヘパリン化という誤った習慣を明示的に否定するものであり、クラスIIIa（適応ではない）に位置づけられている。実務では、駆血帯の管理は装着時刻の記録、位置の再確認、可及的早期の解除、解除後の再出血・再灌流評価で構成され、抗凝固の追加ではない点をチームで共有しておく。外傷急性期には、頭部外傷・実質臓器損傷の合併、止血が不完全な創、凝固障害が併存することが多く、抗凝固は出血を助長しうる。仮に血栓予防が必要な場合は、損傷部位と凝固能を評価したうえで、術後の抗血小板療法（推奨98）や下肢の機械的予防法など、出血リスクの低い手段から検討する。","detp":["駆血帯を用いたという理由だけでヘパリン化を行うことは適応ではない。これを支持するエビデンスは存在せず、出血リスクを高める方向に働く。駆血帯装着は四肢の血流を完全に遮断する操作であり、長時間の阻血は局所の血栓形成や再灌流障害につながりうるため、現場では「血栓予防にヘパリンを」と考えたくなる状況があるが、外傷急性期には全身ヘパリン化が望ましくない場面が多い。実際、頭部外傷や実質臓器損傷の合併、止血が不完全な創、凝固障害が併存することが多く、抗凝固は出血を助長しうる。","術中の全身ヘパリン化の是非は別途、修復範囲・血流遮断時間・合併損傷・出血リスク・外傷性凝固障害を踏まえて個別に判断される（推奨94）。本推奨は、駆血帯の管理を理由にした一律のヘパリン化という誤った習慣を明示的に否定するものであり、クラスIIIa（適応ではない）に位置づけられている。実務では、駆血帯の管理は装着時刻の記録、位置の再確認、可及的早期の解除、解除後の再出血・再灌流評価で構成され、抗凝固の追加ではない点をチームで共有しておく。","外傷急性期には、頭部外傷・実質臓器損傷の合併、止血が不完全な創、凝固障害が併存することが多く、抗凝固は出血を助長しうる。仮に血栓予防が必要な場合は、損傷部位と凝固能を評価したうえで、術後の抗血小板療法（推奨98）や下肢の機械的予防法など、出血リスクの低い手段から検討する。"]},{"n":8,"ja":"致死的体幹出血を伴う外傷患者の一時的止血として、REBOA(大動脈内バルーン閉塞)をルーチンに推奨しない","en":"Resuscitative endovascular balloon occlusion of the aorta (REBOA) is not recommended as a routine approach for temporary haemorrhage control in trauma patients with exsanguinating torso haemorrhage.","cls":"IIIb","lvl":"B","sec":"総論","page":12,"det":"非圧迫性の体幹外傷による制御不能な出血は死亡率が非常に高く、REBOA（大動脈内バルーン閉塞）は確定的手術までの一時的止血手段として研究されてきた。バルーンを大動脈内に留置して中枢側の制御を得る手技であり、確定的止血を遅らせてはならないことが前提となる。適応患者の選択は依然として困難で、系統的レビューでは収縮期血圧のトリガー値、予防的鼠径部穿刺、胸部外傷や外傷性心停止での使用にばらつきがある。観察研究のデータは相反し、バイアスも大きい。\n\n決定的だったのは無作為化試験で、救急外来でのREBOA＋標準治療は標準治療単独と比べて死亡率を低下させず、むしろ増加させる可能性が示された（90日時点の全死亡はREBOA群54%［25/46］、標準治療群42%［18/43］、オッズ比1.58、95%信用区間0.72–3.52、オッズ比>1の事後確率96.9%）。REBOA使用に伴う血管合併症は8%（95%信頼区間5–13%）と報告されている。適応、閉塞時間、使用デバイス、訓練、資格認定のいずれも今後さらなる検討が必要である。したがって致死的体幹出血の一時的止血としてルーチンに用いることは推奨せず、用いる場合も「確定的止血までのbridgeに過ぎない」「血管損傷とアクセス部位合併症のリスクを負う」ことを前提に、施設のプロトコルと習熟した要員が担保される状況に限定する。","detp":["非圧迫性の体幹外傷による制御不能な出血は死亡率が非常に高く、REBOA（大動脈内バルーン閉塞）は確定的手術までの一時的止血手段として研究されてきた。バルーンを大動脈内に留置して中枢側の制御を得る手技であり、確定的止血を遅らせてはならないことが前提となる。適応患者の選択は依然として困難で、系統的レビューでは収縮期血圧のトリガー値、予防的鼠径部穿刺、胸部外傷や外傷性心停止での使用にばらつきがある。","観察研究のデータは相反し、バイアスも大きい。決定的だったのは無作為化試験で、救急外来でのREBOA＋標準治療は標準治療単独と比べて死亡率を低下させず、むしろ増加させる可能性が示された（90日時点の全死亡はREBOA群54%［25/46］、標準治療群42%［18/43］、オッズ比1.58、95%信用区間0.72–3.52、オッズ比>1の事後確率96.9%）。REBOA使用に伴う血管合併症は8%（95%信頼区間5–13%）と報告されている。","適応、閉塞時間、使用デバイス、訓練、資格認定のいずれも今後さらなる検討が必要である。したがって致死的体幹出血の一時的止血としてルーチンに用いることは推奨せず、用いる場合も「確定的止血までのbridgeに過ぎない」「血管損傷とアクセス部位合併症のリスクを負う」ことを前提に、施設のプロトコルと習熟した要員が担保される状況に限定する。"]},{"n":9,"ja":"CTAが不適当と判断された血力学的に不安定な患者は、直ちに手術室へ移し外科的介入を行う","en":"Haemodynamically unstable patients, deemed unsuitable for computed tomography angiography, are recommended to be immediately transferred to the operating room for surgical intervention.","cls":"I","lvl":"C","sec":"総論","page":13,"det":"血力学的に不安定で、CTAが不適当と判断される患者は、画像を待たず直ちに手術室へ移送し外科的介入を行う。CTAの診断能は高いが、撮影・再構成・読影には必ず時間がかかり、循環が破綻しつつある患者ではその時間が致死的となる。この判断は「画像で損傷部位を確定してから」という順序を捨て、「出血源の制御を優先する」という外傷外科の原則に戻ることを意味する。\n\n実務では、FASTや単純X線、臨床所見（穿通創の部位、触知不能な脈拍、拡大する血腫、ショックの遷延）で手術適応を決め、手術室で必要なら術中DSAやon-table angiographyを併用する。ハイブリッド手術室があれば、開腹・開胸と血管内制御を同じ場所で切れ目なく行えるため、こうした患者の移送判断が単純化する。特に「安定化してから撮影」を待つ間に自由破裂するBTAIや、後腹膜血腫の拡大があることを念頭に置く。なお、この推奨はCTAを否定するものではなく、不安定患者における優先順位を明確にしたもので、安定患者ではCTAが第一選択（推奨10）である。この方針を実行するには、外傷室から手術室までの動線、緊急開胸・開腹の準備、大量輸血プロトコルの同時起動が整っている必要がある。搬送中も輸血を継続し、手術室到着時の凝固能・カルシウム・体温を確認する。術中に必要となればon-table angiographyやDSAを併用し、画像診断を手術と切り離さない運用が望ましい。","detp":["血力学的に不安定で、CTAが不適当と判断される患者は、画像を待たず直ちに手術室へ移送し外科的介入を行う。CTAの診断能は高いが、撮影・再構成・読影には必ず時間がかかり、循環が破綻しつつある患者ではその時間が致死的となる。この判断は「画像で損傷部位を確定してから」という順序を捨て、「出血源の制御を優先する」という外傷外科の原則に戻ることを意味する。実務では、FASTや単純X線、臨床所見（穿通創の部位、触知不能な脈拍、拡大する血腫、ショックの遷延）で手術適応を決め、手術室で必要なら術中DSAやon-table angiographyを併用する。","ハイブリッド手術室があれば、開腹・開胸と血管内制御を同じ場所で切れ目なく行えるため、こうした患者の移送判断が単純化する。特に「安定化してから撮影」を待つ間に自由破裂するBTAIや、後腹膜血腫の拡大があることを念頭に置く。なお、この推奨はCTAを否定するものではなく、不安定患者における優先順位を明確にしたもので、安定患者ではCTAが第一選択（推奨10）である。この方針を実行するには、外傷室から手術室までの動線、緊急開胸・開腹の準備、大量輸血プロトコルの同時起動が整っている必要がある。","搬送中も輸血を継続し、手術室到着時の凝固能・カルシウム・体温を確認する。術中に必要となればon-table angiographyやDSAを併用し、画像診断を手術と切り離さない運用が望ましい。"]},{"n":10,"ja":"活動性出血の臨床徴候がない外傷患者で、血管損傷の確認・否定のため動脈相・静脈相を含むCTAを第一選択とする","en":"Computed tomography angiography, including arterial and venous phase, is recommended as the first line investigation to identify or rule out vascular injury in trauma patients without clinical signs of active bleeding.","cls":"I","lvl":"C","sec":"総論","page":13,"det":"活動性出血の臨床徴候がない外傷患者では、動脈相・静脈相を含むCTAが血管損傷の確認・否定の第一選択となる。CTAは臨床的に有意な血管損傷の同定において感受性・特異性がほぼ100%に達し、この検査に伴う遅延が転帰を左右しない安定患者では確立した第一選択である。動静脈相を適切に設定した現代のCTAは、あらゆる種類の血管損傷で conventional angiographyと同等以上に機能する。静脈相を加えることは、静脈損傷や遅延相で描出される病変の評価に有用である。\n\n注意点として、CTAは臨床的に問題にならない損傷を過剰に拾うことがあり、所見は必ず患者の臨床像と突き合わせて解釈する。金属片や弾丸によるアーチファクト、肘・膝より末梢の小血管では評価が難しく、必要ならDSAを補完的に用いる。また、CTAは術後や安定化後の血管評価にも適している。撮影範囲は損傷機転と身体所見から想定される血管領域を外さないことが重要で、頸部・胸部・腹部・骨盤・四肢を一体として計画する。本推奨は「出血の徴候がない＝損傷がない」ではないという前提に立ち、見逃しを防ぐための画像戦略を定めている。撮影範囲は損傷機転と身体所見から想定される血管領域を外さないことが重要で、頸部・胸部・腹部・骨盤・四肢を一体として計画する。静脈相を加えることで、静脈損傷や遅延相で描出される病変の評価精度が上がる。","detp":["活動性出血の臨床徴候がない外傷患者では、動脈相・静脈相を含むCTAが血管損傷の確認・否定の第一選択となる。CTAは臨床的に有意な血管損傷の同定において感受性・特異性がほぼ100%に達し、この検査に伴う遅延が転帰を左右しない安定患者では確立した第一選択である。動静脈相を適切に設定した現代のCTAは、あらゆる種類の血管損傷で conventional angiographyと同等以上に機能する。","静脈相を加えることは、静脈損傷や遅延相で描出される病変の評価に有用である。注意点として、CTAは臨床的に問題にならない損傷を過剰に拾うことがあり、所見は必ず患者の臨床像と突き合わせて解釈する。金属片や弾丸によるアーチファクト、肘・膝より末梢の小血管では評価が難しく、必要ならDSAを補完的に用いる。また、CTAは術後や安定化後の血管評価にも適している。撮影範囲は損傷機転と身体所見から想定される血管領域を外さないことが重要で、頸部・胸部・腹部・骨盤・四肢を一体として計画する。","本推奨は「出血の徴候がない＝損傷がない」ではないという前提に立ち、見逃しを防ぐための画像戦略を定めている。撮影範囲は損傷機転と身体所見から想定される血管領域を外さないことが重要で、頸部・胸部・腹部・骨盤・四肢を一体として計画する。静脈相を加えることで、静脈損傷や遅延相で描出される病変の評価精度が上がる。"]},{"n":11,"ja":"生命・四肢を脅かしうる血管損傷が疑われる血力学的に安定した患者で、腎機能障害の可能性を理由にCTAを回避・延期することは推奨しない","en":"Avoiding or postponing computed tomography angiography because of possible renal impairment is not recommended in haemodynamically stable patients with potentially life or limb threatening vascular injuries.","cls":"IIIb","lvl":"C","sec":"総論","page":13,"det":"造影剤投与後の急性腎障害リスクは、全体としては非常に低い。生命・四肢を脅かしうる血管損傷が疑われる血力学的に安定した患者では、腎機能障害の可能性を理由にCTAを回避したり延期したりしないことが推奨される。これは、見逃された血管損傷（未治療のBTAI、頸動脈損傷による脳梗塞、四肢動脈閉塞による切断）の害が、造影剤関連腎症のリスクを大きく上回るという判断に基づく。\n\n実際、外傷領域で問題となるのはむしろ「撮影の遅れ」であり、腎機能の数値を待つ間に出血が進行する。既往の腎機能障害、糖尿病、脱水、高齢はリスク因子ではあるが、予防的処置（水分負荷が可能な症例では輸液、造影剤量の最適化、必要十分な範囲の撮影）で対応し、診断の遅延と引き換えにしない。透析患者や腎機能が極端に低下している症例でも、生命・四肢を脅かす損傷が疑われる限り撮影を優先する。本推奨はクラスIIIb（回避・延期は推奨しない）であり、日常診療で散見される「腎機能が悪いので造影は控える」という判断に明確に歯止めをかけるものである。透析患者や腎機能が高度に低下した症例でも、生命・四肢を脅かす損傷が疑われる限り撮影を優先し、造影剤量の最適化と撮影範囲の必要最小限化でリスクを抑える。既往の腎機能障害、糖尿病、脱水、高齢はリスク因子ではあるが、予防的処置（可能な症例での輸液、造影剤量の調整）で対応し、診断の遅延と引き換えにしない。","detp":["造影剤投与後の急性腎障害リスクは、全体としては非常に低い。生命・四肢を脅かしうる血管損傷が疑われる血力学的に安定した患者では、腎機能障害の可能性を理由にCTAを回避したり延期したりしないことが推奨される。これは、見逃された血管損傷（未治療のBTAI、頸動脈損傷による脳梗塞、四肢動脈閉塞による切断）の害が、造影剤関連腎症のリスクを大きく上回るという判断に基づく。実際、外傷領域で問題となるのはむしろ「撮影の遅れ」であり、腎機能の数値を待つ間に出血が進行する。","既往の腎機能障害、糖尿病、脱水、高齢はリスク因子ではあるが、予防的処置（水分負荷が可能な症例では輸液、造影剤量の最適化、必要十分な範囲の撮影）で対応し、診断の遅延と引き換えにしない。透析患者や腎機能が極端に低下している症例でも、生命・四肢を脅かす損傷が疑われる限り撮影を優先する。本推奨はクラスIIIb（回避・延期は推奨しない）であり、日常診療で散見される「腎機能が悪いので造影は控える」という判断に明確に歯止めをかけるものである。","透析患者や腎機能が高度に低下した症例でも、生命・四肢を脅かす損傷が疑われる限り撮影を優先し、造影剤量の最適化と撮影範囲の必要最小限化でリスクを抑える。既往の腎機能障害、糖尿病、脱水、高齢はリスク因子ではあるが、予防的処置（可能な症例での輸液、造影剤量の調整）で対応し、診断の遅延と引き換えにしない。"]},{"n":12,"ja":"四肢・終末臓器を脅かす血管外傷では、一時的または確定的なin-line動脈血流の回復を最優先とする","en":"Restoration of inline arterial flow, temporarily or definitively, is recommended to be prioritised in the management of limb or end organ threatening vascular trauma.","cls":"I","lvl":"C","sec":"総論","page":14,"det":"四肢への動脈血流の途絶は、神経・筋の虚血を急速に進行させ、疼痛、機能喪失、壊死、切断に至る。in-lineの動脈血流回復の遅れは、血管外傷関連の四肢喪失を許容できない高い率で生じさせる。機能障害は四肢損傷後2〜3時間以内に始まり、しかもその時間の多くは病院前と術前の段階で費やされる。腹部や頸部の動脈血流途絶は終末臓器虚血を生じ、死亡や脳卒中につながる。したがって、可能な限り速やかに手術室で動脈血流を回復することが不可欠である。\n\n回復の方法は、確定的修復（一次縫合、直接修復、端々吻合、グラフト再建）と、シャントによる一時的回復に大別され、損傷の複雑さ、受傷からの時間、患者の血力学的状態で選択する。判断が分かれるのは「今、確定的に直せる状態か」という点であり、生理が破綻している、あるいは他に致死的損傷がある場合には、時間のかかる再建より血流の迅速な再開を優先する。実務では、搬送・CT・手術室準備の各段階で待ち時間を削る運用（並行作業、手術室への直接搬入、駆血帯の適切な使用）が、この推奨を実行に移す鍵になる。実務では、搬送・CT・手術室準備の各段階で待ち時間を削る運用（並行作業、手術室への直接搬入、駆血帯の適切な使用）が、この推奨を実行に移す鍵になる。四肢の虚血は疼痛・知覚異常・受動伸展痛として現れ、所見が乏しいまま進行することもあるため、脈拍の触知だけで安心しない。","detp":["四肢への動脈血流の途絶は、神経・筋の虚血を急速に進行させ、疼痛、機能喪失、壊死、切断に至る。in-lineの動脈血流回復の遅れは、血管外傷関連の四肢喪失を許容できない高い率で生じさせる。機能障害は四肢損傷後2〜3時間以内に始まり、しかもその時間の多くは病院前と術前の段階で費やされる。腹部や頸部の動脈血流途絶は終末臓器虚血を生じ、死亡や脳卒中につながる。したがって、可能な限り速やかに手術室で動脈血流を回復することが不可欠である。","回復の方法は、確定的修復（一次縫合、直接修復、端々吻合、グラフト再建）と、シャントによる一時的回復に大別され、損傷の複雑さ、受傷からの時間、患者の血力学的状態で選択する。判断が分かれるのは「今、確定的に直せる状態か」という点であり、生理が破綻している、あるいは他に致死的損傷がある場合には、時間のかかる再建より血流の迅速な再開を優先する。実務では、搬送・CT・手術室準備の各段階で待ち時間を削る運用（並行作業、手術室への直接搬入、駆血帯の適切な使用）が、この推奨を実行に移す鍵になる。","実務では、搬送・CT・手術室準備の各段階で待ち時間を削る運用（並行作業、手術室への直接搬入、駆血帯の適切な使用）が、この推奨を実行に移す鍵になる。四肢の虚血は疼痛・知覚異常・受動伸展痛として現れ、所見が乏しいまま進行することもあるため、脈拍の触知だけで安心しない。"]},{"n":13,"ja":"血管外傷患者には、一時的手段よりも一次的確定的修復を優先する","en":"Primary definitive repair for patients with vascular trauma is recommended over temporary solutions.","cls":"I","lvl":"C","sec":"総論","page":15,"det":"血管外傷患者では、一時的な手段よりも一次的な確定的修復が優先される。確定的修復とは、一次縫合や直接修復、端々吻合、グラフト再建など、その時点で完結する修復を指し、シャントや一時的バルーン、仮止血はあくまでbridgeとして位置づけられる。理由は、シャントや一時止血は閉塞・逸脱・塞栓のリスクを抱え、後日の再手術を前提とするため、患者の生理が許すなら一度で終えるほうが合併症と入院期間の両面で有利だからである。\n\n実務では、開腹・開胸して血管を露出した時点で、損傷の性状（部分損傷か完全断裂か、外壁輪郭の異常の有無）、組織のviability、合併損傷の程度を見て「今、確定的に修復できるか」を判断する。デブリードマンと血管端の正常組織までの切除が可能で、緊張なく吻合できるなら確定的修復を行う。他方、凝固障害、アシドーシス、低体温、大量輸血、多発外傷で生理が破綻している場合には、時間短縮を優先しシャントやパッキングで一時的に制御して集中治療室へ、というダメージコントロール戦略が正当化される（推奨14・15）。「確定的修復が原則、シャントは例外」という優先順位をチームで共有することが重要である。逆に、生理が破綻している症例では、時間短縮を優先したシャントやパッキングによる一時的制御と集中治療室への移送が正当化される。つまり本推奨は「確定的修復こそ原則、シャントは例外」という優先順位を示しており、両者を状況に応じて使い分ける判断が術者に求められる。","detp":["血管外傷患者では、一時的な手段よりも一次的な確定的修復が優先される。確定的修復とは、一次縫合や直接修復、端々吻合、グラフト再建など、その時点で完結する修復を指し、シャントや一時的バルーン、仮止血はあくまでbridgeとして位置づけられる。理由は、シャントや一時止血は閉塞・逸脱・塞栓のリスクを抱え、後日の再手術を前提とするため、患者の生理が許すなら一度で終えるほうが合併症と入院期間の両面で有利だからである。","実務では、開腹・開胸して血管を露出した時点で、損傷の性状（部分損傷か完全断裂か、外壁輪郭の異常の有無）、組織のviability、合併損傷の程度を見て「今、確定的に修復できるか」を判断する。デブリードマンと血管端の正常組織までの切除が可能で、緊張なく吻合できるなら確定的修復を行う。他方、凝固障害、アシドーシス、低体温、大量輸血、多発外傷で生理が破綻している場合には、時間短縮を優先しシャントやパッキングで一時的に制御して集中治療室へ、というダメージコントロール戦略が正当化される（推奨14・15）。","「確定的修復が原則、シャントは例外」という優先順位をチームで共有することが重要である。逆に、生理が破綻している症例では、時間短縮を優先したシャントやパッキングによる一時的制御と集中治療室への移送が正当化される。つまり本推奨は「確定的修復こそ原則、シャントは例外」という優先順位を示しており、両者を状況に応じて使い分ける判断が術者に求められる。"]},{"n":14,"ja":"患者の生理状態や損傷パターンにより時機を逃さず一次的確定的修復ができない場合、血流を迅速に回復させる一時的血管シャントの使用を推奨する","en":"The use of temporary vascular shunts to rapidly restore blood flow is recommended when timely primary definitive vascular repair is not feasible due to patient physiology or injury pattern.","cls":"I","lvl":"C","sec":"総論","page":15,"det":"患者の生理状態や損傷パターンにより、時機を逃さず一次的な確定的修復ができない場合には、血流を迅速に回復させる一時的血管シャントの使用が推奨される。シャントはダメージコントロール外傷手術の一部として確立しており、動脈の流入と、必要なら静脈の流出を、整形外科的固定や静脈採取による再建の前に回復させる役割を持つ。軍・民間の双方で報告があり、小児例でも使用されている。\n\n作成の実際として、シャントは可能な限り短く、内径はflowを増やすために最大限にするが、血管内膜を損傷しない太さにとどめる。滅菌プラスチックチューブ（NGチューブや細い胸部ドレーン）でも、内径が血管のそれに概ね一致していれば作成可能であり、市販の頸動脈用シャントも使用できる。市販品が improvisation より優れるという強いデータはない。挿入前には損傷血管のinflowとbackflowを制御し、必要なら末梢の血栓摘除を考慮する。留置したシャントは後日必ず確定的修復へ転換する前提であり、その時点で修復の選択肢が変わりうることも意識しておく。留置中はシャントの拍動と血流を確認し、kinkや圧迫がない体位を保つ。抗凝固のroutine投与に利益は示されておらず、末梢の灌流と代謝（乳酸、pH、CK）の改善で効果を判断する。小児でも使用報告があるが、口径のmismatchと成長への配慮が必要となる。","detp":["患者の生理状態や損傷パターンにより、時機を逃さず一次的な確定的修復ができない場合には、血流を迅速に回復させる一時的血管シャントの使用が推奨される。シャントはダメージコントロール外傷手術の一部として確立しており、動脈の流入と、必要なら静脈の流出を、整形外科的固定や静脈採取による再建の前に回復させる役割を持つ。軍・民間の双方で報告があり、小児例でも使用されている。作成の実際として、シャントは可能な限り短く、内径はflowを増やすために最大限にするが、血管内膜を損傷しない太さにとどめる。","滅菌プラスチックチューブ（NGチューブや細い胸部ドレーン）でも、内径が血管のそれに概ね一致していれば作成可能であり、市販の頸動脈用シャントも使用できる。市販品が improvisation より優れるという強いデータはない。挿入前には損傷血管のinflowとbackflowを制御し、必要なら末梢の血栓摘除を考慮する。留置したシャントは後日必ず確定的修復へ転換する前提であり、その時点で修復の選択肢が変わりうることも意識しておく。","留置中はシャントの拍動と血流を確認し、kinkや圧迫がない体位を保つ。抗凝固のroutine投与に利益は示されておらず、末梢の灌流と代謝（乳酸、pH、CK）の改善で効果を判断する。小児でも使用報告があるが、口径のmismatchと成長への配慮が必要となる。"]},{"n":15,"ja":"血管シャントは、可能な限り早期に(理想は初回手術時に)確定的修復へ転換することを考慮すべき","en":"Vascular shunts should be considered for conversion to definitive repair as soon as possible, ideally at the primary operation.","cls":"IIa","lvl":"C","sec":"総論","page":15,"det":"シャント留置後は、可能な限り早期に、理想としては初回手術のうちに確定的修復へ転換することを考慮する。シャントはあくまで一時的手段で、閉塞・逸脱・塞栓などの合併症が最大20%に報告されており、留置期間が延びるほどリスクが上がる。実験データと限られたヒトのデータでは、6時間を超えると合併症率が上昇する。ただし重症外傷患者では、集中治療での安定化と確定的手術の調整に時間がかかり、6時間以内に再手術となる例は少数である。したがって「初回手術で転換するのが理想、できなければ患者状態が許す限り速やかに、実務的には留置後12〜24時間以内」という時間軸が提示されている。\n\nまた、シャントの開存性は流量の多い中枢側血管損傷で良好であり、末梢の細径血管では不良となりやすい。サイジングと血管口径が閉塞に関与するとされるが、血栓形成因子の合意はない。routineの術後ヘパリン化に利益は示されていない。転換時には、シャント周囲の血栓と内膜損傷の評価、吻合部のdebridement、グラフト再建か一次修復かの再判断を行う。転換の時機を失うと、当初は「つなぎ」だったはずのシャントが結果として長期留置となり、感染・閉塞・四肢喪失のリスクを高める点を避けるべきである。","detp":["シャント留置後は、可能な限り早期に、理想としては初回手術のうちに確定的修復へ転換することを考慮する。シャントはあくまで一時的手段で、閉塞・逸脱・塞栓などの合併症が最大20%に報告されており、留置期間が延びるほどリスクが上がる。実験データと限られたヒトのデータでは、6時間を超えると合併症率が上昇する。ただし重症外傷患者では、集中治療での安定化と確定的手術の調整に時間がかかり、6時間以内に再手術となる例は少数である。","したがって「初回手術で転換するのが理想、できなければ患者状態が許す限り速やかに、実務的には留置後12〜24時間以内」という時間軸が提示されている。また、シャントの開存性は流量の多い中枢側血管損傷で良好であり、末梢の細径血管では不良となりやすい。サイジングと血管口径が閉塞に関与するとされるが、血栓形成因子の合意はない。routineの術後ヘパリン化に利益は示されていない。転換時には、シャント周囲の血栓と内膜損傷の評価、吻合部のdebridement、グラフト再建か一次修復かの再判断を行う。","転換の時機を失うと、当初は「つなぎ」だったはずのシャントが結果として長期留置となり、感染・閉塞・四肢喪失のリスクを高める点を避けるべきである。"]},{"n":16,"ja":"再建を要する血管外傷患者には、短い間置グラフト(interposition graft)を推奨する","en":"Short interposition grafts are recommended in patients with vascular trauma requiring reconstruction.","cls":"I","lvl":"C","sec":"総論","page":15,"det":"動脈の損傷範囲が広く一次縫合が不可能な場合、グラフト再建が必要になる。選択肢はin-lineの間置グラフト（interposition）と、待機血管手術で用いられるようなバイパスグラフトである。前向き比較研究は存在せず、長期開存性の記録も一貫せず、転帰指標のheterogeneityも大きい。血管外科医はバイパス手技に習熟していることが多いが、外傷では間置法に利点が多い。\n\n第1に、間置グラフトは大幅に短く、開存性がより良好である。若年の外傷患者では長期抗凝固薬の服薬継続が難しく、フォローアップから脱落しやすいため、この差は特に重要になる。第2に、間置法では損傷部を直視でき、viabilityのない組織のdebridementと、合併する静脈・神経損傷の同定と評価が可能になる。第3に、緊張のない吻合が得やすい。一方、胸部出口のように解剖的に展開が困難な部位では短い間置グラフトが成立せず、バイパス再建のほうが適切となる。広範な軟部組織欠損を伴う場合はextra-anatomic bypassも記述されている。したがって「原則は短い間置グラフト、解剖的に無理な部位ではバイパス」という使い分けを、術前のCTAと術中の展開所見の両方で判断する。","detp":["動脈の損傷範囲が広く一次縫合が不可能な場合、グラフト再建が必要になる。選択肢はin-lineの間置グラフト（interposition）と、待機血管手術で用いられるようなバイパスグラフトである。前向き比較研究は存在せず、長期開存性の記録も一貫せず、転帰指標のheterogeneityも大きい。血管外科医はバイパス手技に習熟していることが多いが、外傷では間置法に利点が多い。第1に、間置グラフトは大幅に短く、開存性がより良好である。","若年の外傷患者では長期抗凝固薬の服薬継続が難しく、フォローアップから脱落しやすいため、この差は特に重要になる。第2に、間置法では損傷部を直視でき、viabilityのない組織のdebridementと、合併する静脈・神経損傷の同定と評価が可能になる。第3に、緊張のない吻合が得やすい。一方、胸部出口のように解剖的に展開が困難な部位では短い間置グラフトが成立せず、バイパス再建のほうが適切となる。","広範な軟部組織欠損を伴う場合はextra-anatomic bypassも記述されている。したがって「原則は短い間置グラフト、解剖的に無理な部位ではバイパス」という使い分けを、術前のCTAと術中の展開所見の両方で判断する。"]},{"n":17,"ja":"緊急的確定的血管修復に合成間置グラフトを用いることを考慮してもよい","en":"Synthetic interposition grafts may be considered for emergency de finitive vascular repair.","cls":"IIb","lvl":"C","sec":"総論","page":16,"det":"緊急の確定的血管修復に合成間置グラフトを用いることは考慮してよい。古典的教訓として反転静脈グラフトが推奨されてきたが、そのエビデンス基盤は歴史的で、慢性動脈疾患で長いバイパスを要する待機手術の知見に由来する。外傷における合成グラフトと自家グラフトの無作為化試験は存在せず、後ろ向きseriesは患者選択のバイアスが大きい（重症例ほど合成グラフトが用いられやすい）。複雑な軍陣血管外傷で健常な静脈conduitの確保が限られる状況では、合成グラフトの緊急使用が救肢戦略として有効となり、安定化・高次施設への搬送後に、残された静脈を用いた待機的血行再建を行うという段階的アプローチも提示されている。\n\n実務では、汚染創や組織欠損が大きい症例では、創が清潔になり十分なデブリードマンと軟部組織被覆が得られるまでの一時的再建として合成グラフトを用いる考え方が支持される。コホート研究では動脈・静脈損傷の早期開存率は同等と報告され、長期開存の報告は乏しい。大規模データバンク解析では静脈conduitのほうが予定外の再手術と四肢喪失が少ないとされたが、合成バイパスは上肢損傷の1%、下肢の8%に限られており選択バイアスの可能性がある。感染率に差を示した研究はない。感染時の破綻様式が異なり、静脈は融解して出血し、合成グラフトは吻合部で偽動脈瘤を形成する。このため「止血の迅速性を優先するなら合成、汚染と長期開存を重視するなら静脈」というトレードオフを意識する。","detp":["緊急の確定的血管修復に合成間置グラフトを用いることは考慮してよい。古典的教訓として反転静脈グラフトが推奨されてきたが、そのエビデンス基盤は歴史的で、慢性動脈疾患で長いバイパスを要する待機手術の知見に由来する。外傷における合成グラフトと自家グラフトの無作為化試験は存在せず、後ろ向きseriesは患者選択のバイアスが大きい（重症例ほど合成グラフトが用いられやすい）。複雑な軍陣血管外傷で健常な静脈conduitの確保が限られる状況では、合成グラフトの緊急使用が救肢戦略として有効となり、安定化・高次施設への搬送後に、残された静脈を用いた待機的血行再建を行うという段階的アプローチも提示されている。","実務では、汚染創や組織欠損が大きい症例では、創が清潔になり十分なデブリードマンと軟部組織被覆が得られるまでの一時的再建として合成グラフトを用いる考え方が支持される。コホート研究では動脈・静脈損傷の早期開存率は同等と報告され、長期開存の報告は乏しい。大規模データバンク解析では静脈conduitのほうが予定外の再手術と四肢喪失が少ないとされたが、合成バイパスは上肢損傷の1%、下肢の8%に限られており選択バイアスの可能性がある。","感染率に差を示した研究はない。感染時の破綻様式が異なり、静脈は融解して出血し、合成グラフトは吻合部で偽動脈瘤を形成する。このため「止血の迅速性を優先するなら合成、汚染と長期開存を重視するなら静脈」というトレードオフを意識する。"]},{"n":18,"ja":"長いバイパス導管や細径末梢血管を要する動脈損傷の再建には、静脈グラフトを考慮すべき","en":"Vein grafts should be considered for vascular reconstruction of arterial injury requiring longer bypass conduits or for small calibre distal vessels.","cls":"IIa","lvl":"C","sec":"総論","page":16,"det":"長いバイパスconduitを要する動脈損傷、あるいは細径の末梢血管（小児損傷や膝・肘より末梢）の再建には静脈グラフトを考慮する。合成材料は間置グラフトによる迅速な確定的血流回復に適し、静脈は長いバイパスや細径血管に向くというのが本文の整理である。バイオ bovine patchや脱細胞化ヒトマトリックスなどの他材料は、評価できるだけのエビデンスが不足している。\n\n静脈採取部位については、古典的教訓は「健側（非損傷肢）から採取」であるが、これは高品質のデータに支持されておらず、健側肢に長期の罹患を生じうる。反対のエビデンスがない以上、同側（損傷側）下肢からの採取も合理的とされる。実務では、静脈の口径と長さを術前に評価し（duplexやCTA）、panel状の採取、valveの方向（反転か非反転か）、吻合部の緊張に注意する。外傷では血流再開までの時間が予後を左右するため、採取に時間をかけすぎない判断も必要である。小児では成長に伴う口径変化とmismatchを想定し、間欠縫合や余裕を持たせた吻合が選択されることがある。なお、合成と自家のどちらが優れるかを断定できる高品質エビデンスは今も存在しない。","detp":["長いバイパスconduitを要する動脈損傷、あるいは細径の末梢血管（小児損傷や膝・肘より末梢）の再建には静脈グラフトを考慮する。合成材料は間置グラフトによる迅速な確定的血流回復に適し、静脈は長いバイパスや細径血管に向くというのが本文の整理である。バイオ bovine patchや脱細胞化ヒトマトリックスなどの他材料は、評価できるだけのエビデンスが不足している。静脈採取部位については、古典的教訓は「健側（非損傷肢）から採取」であるが、これは高品質のデータに支持されておらず、健側肢に長期の罹患を生じうる。","反対のエビデンスがない以上、同側（損傷側）下肢からの採取も合理的とされる。実務では、静脈の口径と長さを術前に評価し（duplexやCTA）、panel状の採取、valveの方向（反転か非反転か）、吻合部の緊張に注意する。外傷では血流再開までの時間が予後を左右するため、採取に時間をかけすぎない判断も必要である。小児では成長に伴う口径変化とmismatchを想定し、間欠縫合や余裕を持たせた吻合が選択されることがある。","なお、合成と自家のどちらが優れるかを断定できる高品質エビデンスは今も存在しない。"]},{"n":19,"ja":"穿通性頸部損傷で創部からの活動性出血または拡大する血腫を伴う場合、即時の外科的探索を推奨する","en":"Immediate open surgical exploration is recommended for patients with penetrating neck injury and active haemorrhage from the wound or expanding haematoma.","cls":"I","lvl":"C","sec":"頸部","page":16,"det":"穿通性頸部損傷で、創部からの活動性出血または拡大する血腫がある場合は、画像を待たずに即時の外科的探索が推奨される。これらはhard signと呼ばれ、気道・血管・消化管のいずれかの重篤損傷を強く示唆し、出血性ショックや気道閉塞が差し迫っている状況では撮影のために手術室を離れること自体が危険となる。頸部は3つのzoneに分けて論じられてきたが、近年はzone分類に依存せず頸部全体を一体として評価する「whole neck approach」が提唱されており、損傷血管の同定には術中超音波や術中血管造影を併用する。\n\n一方で、活動性出血がなく循環が安定している症例では、漫然と explorative surgeryを行うのではなく、CTAで損傷の局在とグレードを確定してから方針を決めるのが標準である。頸部の創は外見上小さくても、弾道や刺創のtrajectoryは三次元的に周囲血管へ及ぶため、創の観察だけでは評価できない。なお、静脈性の出血は撮影時点で止血していればCTAで見逃されうる点は留意する。実務では、hard signの有無を最初の数分で判定し、あれば手術室へ、なければCTAへという分岐をプロトコル化しておくと迷いが少ない。","detp":["穿通性頸部損傷で、創部からの活動性出血または拡大する血腫がある場合は、画像を待たずに即時の外科的探索が推奨される。これらはhard signと呼ばれ、気道・血管・消化管のいずれかの重篤損傷を強く示唆し、出血性ショックや気道閉塞が差し迫っている状況では撮影のために手術室を離れること自体が危険となる。頸部は3つのzoneに分けて論じられてきたが、近年はzone分類に依存せず頸部全体を一体として評価する「whole neck approach」が提唱されており、損傷血管の同定には術中超音波や術中血管造影を併用する。","一方で、活動性出血がなく循環が安定している症例では、漫然と explorative surgeryを行うのではなく、CTAで損傷の局在とグレードを確定してから方針を決めるのが標準である。頸部の創は外見上小さくても、弾道や刺創のtrajectoryは三次元的に周囲血管へ及ぶため、創の観察だけでは評価できない。なお、静脈性の出血は撮影時点で止血していればCTAで見逃されうる点は留意する。","実務では、hard signの有無を最初の数分で判定し、あれば手術室へ、なければCTAへという分岐をプロトコル化しておくと迷いが少ない。"]},{"n":20,"ja":"即時手術の適応がないすべての穿通性頸部外傷患者にCTAを推奨する","en":"Computed tomography angiography is recommended for all patients with penetrating neck trauma without an indication for immediate operative intervention.","cls":"I","lvl":"B","sec":"頸部","page":17,"det":"即時手術の適応がない穿通性頸部外傷の全例にCTAが推奨される。穿通性頸部血管損傷に対するCTAの特異度と陰性適中率は97〜100%と報告されており、臨床的に有意な血管損傷を否定する精度はきわめて高い。頸部外傷後の脳卒中で血力学的に安定している患者にも、直ちにCTAを行うことが適切である。撮影は大動脈弓から頭蓋内血管までを含め、頸動脈と椎骨動脈の起始部から頭蓋内区間までを連続して評価できる範囲設定とする。\n\n注意点として、撮影時点で活動性出血のない大きな静脈損傷はCTAで見逃されることがある。そのため、所見が陰性でも臨床像と食い違う場合（拡大する腫脹、気道偏位、神経所見の変動、持続する出血）には、反復評価やDSA、超音波、外科的探索を躊躇しない。また、金属片によるアーチファクトは頸部では問題になりやすく、必要なら再構成や複数相での評価を行う。本推奨の実質的な意味は「穿通性頸部外傷は原則CTAで評価する」という標準化にあり、これにより不要な explorative surgeryを減らしつつ、見逃しを防ぐ体制を整えることにある。撮影範囲は大動脈弓から頭蓋内血管までを含め、頸動脈と椎骨動脈の起始部から頭蓋内区間までを連続して評価できる設定とする。本推奨の実質的な意味は「穿通性頸部外傷は原則CTAで評価する」という標準化にあり、これにより不要な探索手術を減らしつつ見逃しを防ぐ体制を整えることにある。","detp":["即時手術の適応がない穿通性頸部外傷の全例にCTAが推奨される。穿通性頸部血管損傷に対するCTAの特異度と陰性適中率は97〜100%と報告されており、臨床的に有意な血管損傷を否定する精度はきわめて高い。頸部外傷後の脳卒中で血力学的に安定している患者にも、直ちにCTAを行うことが適切である。撮影は大動脈弓から頭蓋内血管までを含め、頸動脈と椎骨動脈の起始部から頭蓋内区間までを連続して評価できる範囲設定とする。","注意点として、撮影時点で活動性出血のない大きな静脈損傷はCTAで見逃されることがある。そのため、所見が陰性でも臨床像と食い違う場合（拡大する腫脹、気道偏位、神経所見の変動、持続する出血）には、反復評価やDSA、超音波、外科的探索を躊躇しない。また、金属片によるアーチファクトは頸部では問題になりやすく、必要なら再構成や複数相での評価を行う。本推奨の実質的な意味は「穿通性頸部外傷は原則CTAで評価する」という標準化にあり、これにより不要な explorative surgeryを減らしつつ、見逃しを防ぐ体制を整えることにある。","撮影範囲は大動脈弓から頭蓋内血管までを含め、頸動脈と椎骨動脈の起始部から頭蓋内区間までを連続して評価できる設定とする。本推奨の実質的な意味は「穿通性頸部外傷は原則CTAで評価する」という標準化にあり、これにより不要な探索手術を減らしつつ見逃しを防ぐ体制を整えることにある。"]},{"n":21,"ja":"穿通外傷による軽微(ESVS Grade 1)頸動脈損傷患者に、単剤抗血小板療法の非手術管理を考慮してもよい","en":"Non-operative management with single antiplatelet therapy may be considered for patients with minor (ESVS Grade 1) carotid artery injury due to penetrating trauma.","cls":"IIb","lvl":"C","sec":"頸部","page":17,"det":"穿通外傷によるESVS Grade 1（内膜損傷・外壁輪郭は正常）の頸動脈損傷では、単剤抗血小板療法による非手術管理を考慮してよい。銃創の近接損傷（proximity injury）として撮影されたCTAで内膜のflapのみが描出されるような症例が典型で、外壁の輪郭が保たれているため破裂や拡大の危険は低く、問題は血栓塞栓による脳梗塞である。したがって治療の主眼は抗血栓療法となる。\n\n具体的な薬剤についてのデータはなく、エビデンスは一般的に単剤抗血小板薬を支持する。抗凝固薬やdual antiplatelet therapyが優れるというデータはなく、外傷患者では出血リスクを高めるため、まずはアスピリン等の単剤で開始するのが現実的である。経過中は神経所見の観察と、フォローアップ画像（CTAまたは超音波）による病変の安定性・治癒の確認を行う。神経症状が出現した場合や、病変が進行・拡大した場合には、抗血栓療法の継続だけでなく、血管内治療や手術の適応を再検討する。なお外傷全体として、抗血栓療法の開始は「診断がついた時点で速やかに」が原則であり、頭蓋内出血や実質臓器損傷の合併があっても、差し控える閾値は高く設定すべきとされている。","detp":["穿通外傷によるESVS Grade 1（内膜損傷・外壁輪郭は正常）の頸動脈損傷では、単剤抗血小板療法による非手術管理を考慮してよい。銃創の近接損傷（proximity injury）として撮影されたCTAで内膜のflapのみが描出されるような症例が典型で、外壁の輪郭が保たれているため破裂や拡大の危険は低く、問題は血栓塞栓による脳梗塞である。したがって治療の主眼は抗血栓療法となる。","具体的な薬剤についてのデータはなく、エビデンスは一般的に単剤抗血小板薬を支持する。抗凝固薬やdual antiplatelet therapyが優れるというデータはなく、外傷患者では出血リスクを高めるため、まずはアスピリン等の単剤で開始するのが現実的である。経過中は神経所見の観察と、フォローアップ画像（CTAまたは超音波）による病変の安定性・治癒の確認を行う。神経症状が出現した場合や、病変が進行・拡大した場合には、抗血栓療法の継続だけでなく、血管内治療や手術の適応を再検討する。","なお外傷全体として、抗血栓療法の開始は「診断がついた時点で速やかに」が原則であり、頭蓋内出血や実質臓器損傷の合併があっても、差し控える閾値は高く設定すべきとされている。"]},{"n":22,"ja":"穿通性ESVS Grade 2/3頸動脈損傷では、全身状態が許容し技術的に可能なら、総頸動脈・内頸動脈の結紮ではなく再建を推奨する","en":"Reconstruction rather than ligation of the common or internal carotid artery, when patient physiology allows and technically feasible, is recommended in patients with penetrating ESVS Grade 2 or 3 carotid artery injury.","cls":"I","lvl":"C","sec":"頸部","page":17,"det":"穿通性のESVS Grade 2/3（外壁輪郭異常を伴う完全壁損傷、すなわち contained rupture または制御不能な出血）頸動脈損傷では、患者の生理状態が許容し技術的に可能である限り、総頸動脈（CCA）・内頸動脈（ICA）の結紮ではなく再建が推奨される。頸動脈を結紮すると脳梗塞と死亡の確率が高く、北米の外傷レジストリに基づくデータでは、CCAで結紮21%対再建12%、ICAで結紮25%対再建7%と、再建のほうが院内死亡が有意に低かった。南アフリカの検討でも結紮の手技関連死亡は高率で、再建後には術前に神経症状を有していた生存者の一部で神経症状の改善が得られている。\n\n一方で、血腫による圧排で到達が困難な場合、頸部に広範な組織破壊がある場合、循環が破綻している場合には、無理な再建が出血の遷延を招く。そうした場面ではshuntによる一時的血流確保や、血管内治療（ステントグラフト、被覆ステント、塞栓）を組み合わせたハイブリッド戦略が現実的な選択肢となる。到達には必要に応じて顎下・耳下の切開や、胸骨縦切開を加えた中枢側確保を計画し、術前CTAで中枢・末梢の制御部位を決めておくことが、この推奨を実行に移す前提となる。","detp":["穿通性のESVS Grade 2/3（外壁輪郭異常を伴う完全壁損傷、すなわち contained rupture または制御不能な出血）頸動脈損傷では、患者の生理状態が許容し技術的に可能である限り、総頸動脈（CCA）・内頸動脈（ICA）の結紮ではなく再建が推奨される。頸動脈を結紮すると脳梗塞と死亡の確率が高く、北米の外傷レジストリに基づくデータでは、CCAで結紮21%対再建12%、ICAで結紮25%対再建7%と、再建のほうが院内死亡が有意に低かった。","南アフリカの検討でも結紮の手技関連死亡は高率で、再建後には術前に神経症状を有していた生存者の一部で神経症状の改善が得られている。一方で、血腫による圧排で到達が困難な場合、頸部に広範な組織破壊がある場合、循環が破綻している場合には、無理な再建が出血の遷延を招く。そうした場面ではshuntによる一時的血流確保や、血管内治療（ステントグラフト、被覆ステント、塞栓）を組み合わせたハイブリッド戦略が現実的な選択肢となる。","到達には必要に応じて顎下・耳下の切開や、胸骨縦切開を加えた中枢側確保を計画し、術前CTAで中枢・末梢の制御部位を決めておくことが、この推奨を実行に移す前提となる。"]},{"n":23,"ja":"穿通外傷によるESVS Grade 1椎骨動脈損傷患者に、単剤抗血小板療法の非手術管理を考慮してもよい","en":"Non-operative management with single antiplatelet therapy may be considered for patients with an ESVS Grade 1 vertebral artery injury due to penetrating trauma.","cls":"IIb","lvl":"C","sec":"頸部","page":18,"det":"穿通外傷によるESVS Grade 1（内膜損傷のみ、外壁輪郭は正常）の椎骨動脈損傷では、単剤抗血小板療法による非手術管理を考慮してよい。椎骨動脈はV1からV4まで骨性・筋性の複雑な経路をとり、外科的到達がきわめて困難である。近位（V1）損傷は周囲の重要構造の合併損傷のため死亡率が最も高いとされ、頸部の穿通創では椎骨動脈の関与がしばしば見逃される。Grade 1は壁の完全性が保たれているため、破裂よりも血栓塞栓による後循環梗塞が問題となり、抗血栓療法が合理的となる。\n\n実務では、神経所見（めまい、複視、構音障害、小脳失調、意識変容）と後循環の灌流評価を継続し、病変の安定性をフォローアップ画像で確認する。対側椎骨動脈の開存と後交通動脈を介した側副血流を評価しておくことは、後により高グレードの病変や出血が判明した場合の治療選択（犠牲化が許容されるか）に直結する。抗血栓薬の選択についての直接のデータはなく、単剤抗血小板が第一選択とされる。穿通性頸部外傷では、血管損傷のグレードと「出血しているか、塞栓源になっているか」の二軸で管理方針が決まる点を、頸動脈と椎骨動脈で共通の枠組みとして理解しておくと整理しやすい。","detp":["穿通外傷によるESVS Grade 1（内膜損傷のみ、外壁輪郭は正常）の椎骨動脈損傷では、単剤抗血小板療法による非手術管理を考慮してよい。椎骨動脈はV1からV4まで骨性・筋性の複雑な経路をとり、外科的到達がきわめて困難である。近位（V1）損傷は周囲の重要構造の合併損傷のため死亡率が最も高いとされ、頸部の穿通創では椎骨動脈の関与がしばしば見逃される。Grade 1は壁の完全性が保たれているため、破裂よりも血栓塞栓による後循環梗塞が問題となり、抗血栓療法が合理的となる。","実務では、神経所見（めまい、複視、構音障害、小脳失調、意識変容）と後循環の灌流評価を継続し、病変の安定性をフォローアップ画像で確認する。対側椎骨動脈の開存と後交通動脈を介した側副血流を評価しておくことは、後により高グレードの病変や出血が判明した場合の治療選択（犠牲化が許容されるか）に直結する。抗血栓薬の選択についての直接のデータはなく、単剤抗血小板が第一選択とされる。穿通性頸部外傷では、血管損傷のグレードと「出血しているか、塞栓源になっているか」の二軸で管理方針が決まる点を、頸動脈と椎骨動脈で共通の枠組みとして理解しておくと整理しやすい。"]},{"n":24,"ja":"穿通性椎骨動脈損傷で症状性または増大する偽動脈瘤・動静脈瘻(ESVS Grade 2)には、血管内治療を第一選択とすることを考慮すべき","en":"Endovascular therapy should be considered as first line treatment for symptomatic or progressing pseudoaneurysm or arteriovenous fistula (ESVS Grade 2) in patients with penetrating vertebral artery injury.","cls":"IIa","lvl":"C","sec":"頸部","page":18,"det":"穿通性椎骨動脈損傷で症候性または増大する偽動脈瘤・動静脈瘻（ESVS Grade 2、contained bleeding）を伴う症例では、血管内治療を第一選択とすることが考慮される。椎骨動脈は外科的到達が困難であるため、コイル塞栓や被覆ステントによる血管内治療が、ここ数十年で多くの症例における第一選択となった。症例報告では技術的成功と合併症の少なさが示されているが、長期成績のデータは限られる。\n\n治療方針は、対側椎骨動脈と後循環の側副血流が保たれているかに大きく依存する。患側椎骨動脈を犠牲にする（閉塞させる）場合、後循環の灌流が対側に依存していれば脳梗塞のリスクは比較的低く、報告では数%程度とされる。一方、対側が低形成・閉塞、あるいは後交通動脈を介した血流が乏しい症例では犠牲化は危険であり、被覆ステントによる再建を優先する。塞栓範囲は病変の近位・遠位の両側を確実に閉塞させる必要があり、脊髄動脈や後下小脳動脈の起始部を巻き込まないよう、術前のCTA/DSAで血管の詳細な解剖を確認する。出血が持続している場合には、気道確保と止血を最優先とし、血管内治療の準備と並行して進める。治療方針は対側椎骨動脈と後循環の側副血流に大きく依存し、犠牲化が許容されるかどうかで手技が変わる。塞栓範囲は病変の近位・遠位の両側を確実に閉塞させる必要があり、脊髄動脈や後下小脳動脈の起始部を巻き込まないよう術前のCTA/DSAで詳細な解剖を確認する。","detp":["穿通性椎骨動脈損傷で症候性または増大する偽動脈瘤・動静脈瘻（ESVS Grade 2、contained bleeding）を伴う症例では、血管内治療を第一選択とすることが考慮される。椎骨動脈は外科的到達が困難であるため、コイル塞栓や被覆ステントによる血管内治療が、ここ数十年で多くの症例における第一選択となった。症例報告では技術的成功と合併症の少なさが示されているが、長期成績のデータは限られる。","治療方針は、対側椎骨動脈と後循環の側副血流が保たれているかに大きく依存する。患側椎骨動脈を犠牲にする（閉塞させる）場合、後循環の灌流が対側に依存していれば脳梗塞のリスクは比較的低く、報告では数%程度とされる。一方、対側が低形成・閉塞、あるいは後交通動脈を介した血流が乏しい症例では犠牲化は危険であり、被覆ステントによる再建を優先する。塞栓範囲は病変の近位・遠位の両側を確実に閉塞させる必要があり、脊髄動脈や後下小脳動脈の起始部を巻き込まないよう、術前のCTA/DSAで血管の詳細な解剖を確認する。","出血が持続している場合には、気道確保と止血を最優先とし、血管内治療の準備と並行して進める。治療方針は対側椎骨動脈と後循環の側副血流に大きく依存し、犠牲化が許容されるかどうかで手技が変わる。塞栓範囲は病変の近位・遠位の両側を確実に閉塞させる必要があり、脊髄動脈や後下小脳動脈の起始部を巻き込まないよう術前のCTA/DSAで詳細な解剖を確認する。"]},{"n":25,"ja":"穿通性頭蓋外椎骨動脈損傷でコントロール不能な出血(ESVS Grade 3)を伴う患者には、可能なら塞栓術による緊急血管内管理を推奨する","en":"Emergency endovascular management with embolisation if feasible is recommended for patients with penetrating extracranial vertebral artery injury and uncontrolled haemorrhage (ESVS Grade 3).","cls":"I","lvl":"C","sec":"頸部","page":18,"det":"穿通性頭蓋外椎骨動脈損傷で制御不能な出血（ESVS Grade 3、uncontained haemorrhage）を伴う患者には、可能であれば塞栓術による緊急血管内管理が推奨される。頸部深部からの持続出血は、圧迫が効きにくく気道圧迫も加わるため致死的であり、外科的到達が困難な椎骨動脈領域では血管内治療が唯一の現実的な止血手段となりうる。塞栓は病変の近位・遠位を確実に閉塞させる必要があり、側副血行（対側椎骨動脈、後交通動脈）を事前または同時に評価する。\n\n血管内治療が不可能な場合、あるいは心肺停止に近い状態で血管造影室への搬送が危険な場合には、外科的結紮が選択される。頸部の血腫による圧排で解剖が不明瞭なことが多く、内頸動脈や迷走神経、胸管の損傷を避ける繊細な操作が要求される。実務では、気道確保（場合により輪状甲状膜切開）、循環の安定化、頸部の直接圧迫を継続しながら、血管造影室またはハイブリッド手術室へ同時並行で準備を進める。出血源が椎骨動脈か頸動脈かを判断するために、術中にDSAを行うことが有用であり、本推奨は「可及的速やかな止血」と「後循環の温存」のバランスを、部位に応じた手段選択で実現することを求めている。","detp":["穿通性頭蓋外椎骨動脈損傷で制御不能な出血（ESVS Grade 3、uncontained haemorrhage）を伴う患者には、可能であれば塞栓術による緊急血管内管理が推奨される。頸部深部からの持続出血は、圧迫が効きにくく気道圧迫も加わるため致死的であり、外科的到達が困難な椎骨動脈領域では血管内治療が唯一の現実的な止血手段となりうる。塞栓は病変の近位・遠位を確実に閉塞させる必要があり、側副血行（対側椎骨動脈、後交通動脈）を事前または同時に評価する。","血管内治療が不可能な場合、あるいは心肺停止に近い状態で血管造影室への搬送が危険な場合には、外科的結紮が選択される。頸部の血腫による圧排で解剖が不明瞭なことが多く、内頸動脈や迷走神経、胸管の損傷を避ける繊細な操作が要求される。実務では、気道確保（場合により輪状甲状膜切開）、循環の安定化、頸部の直接圧迫を継続しながら、血管造影室またはハイブリッド手術室へ同時並行で準備を進める。出血源が椎骨動脈か頸動脈かを判断するために、術中にDSAを行うことが有用であり、本推奨は「可及的速やかな止血」と「後循環の温存」のバランスを、部位に応じた手段選択で実現することを求めている。"]},{"n":26,"ja":"神経症状のない穿通性頭蓋外椎骨動脈損傷・閉塞(ESVS Grade X)患者には、単剤抗血小板療法の非手術管理を考慮すべき","en":"Non-operative management with single antiplatelet therapy should be considered for patients with penetrating extracranial vertebral artery injury and occlusion (ESVS Grade X) without neurological symptoms.","cls":"IIa","lvl":"C","sec":"頸部","page":18,"det":"神経症状のない穿通性頭蓋外椎骨動脈損傷・閉塞（ESVS Grade X）では、単剤抗血小板療法による非手術管理を考慮すべきとされる。椎骨動脈の閉塞は、後循環の側副血流が保たれていれば無症状のまま経過することがあり、この場合の目的は閉塞血管の再開通ではなく、閉塞部位からの血栓進展と遠隔塞栓の予防である。したがって抗血小板薬による二次予防が中心となる。\n\n判断の要点は、①後循環虚血の症状がないこと、②対側椎骨動脈と後交通動脈を介した灌流が保たれていること、③病変が造影剤の血管外漏出や拡大する偽動脈瘤を伴わないこと、の3点である。いずれかが満たされない場合には、血管内再開通や血行再建の適応を検討する。経過観察中は神経所見の変化に注意し、新たな症状が出現すれば画像を再検して方針を再評価する。抗血栓療法の継続期間は、病変の治癒（リモデリング）が画像で確認されるまで、少なくとも3か月を目安とするのが一般的である。穿通性損傷では創の汚染や感染の合併もあり、抗血栓療法の強度は出血リスクと天秤にかけて個別に調整する。経過観察中はめまい、複視、構音障害、小脳失調といった後循環症状の出現に注意し、新たな症状があれば画像を再検して方針を再評価する。抗血栓療法の継続期間は病変の治癒が画像で確認されるまで、少なくとも3か月を目安とする。","detp":["神経症状のない穿通性頭蓋外椎骨動脈損傷・閉塞（ESVS Grade X）では、単剤抗血小板療法による非手術管理を考慮すべきとされる。椎骨動脈の閉塞は、後循環の側副血流が保たれていれば無症状のまま経過することがあり、この場合の目的は閉塞血管の再開通ではなく、閉塞部位からの血栓進展と遠隔塞栓の予防である。したがって抗血小板薬による二次予防が中心となる。判断の要点は、①後循環虚血の症状がないこと、②対側椎骨動脈と後交通動脈を介した灌流が保たれていること、③病変が造影剤の血管外漏出や拡大する偽動脈瘤を伴わないこと、の3点である。","いずれかが満たされない場合には、血管内再開通や血行再建の適応を検討する。経過観察中は神経所見の変化に注意し、新たな症状が出現すれば画像を再検して方針を再評価する。抗血栓療法の継続期間は、病変の治癒（リモデリング）が画像で確認されるまで、少なくとも3か月を目安とするのが一般的である。穿通性損傷では創の汚染や感染の合併もあり、抗血栓療法の強度は出血リスクと天秤にかけて個別に調整する。","経過観察中はめまい、複視、構音障害、小脳失調といった後循環症状の出現に注意し、新たな症状があれば画像を再検して方針を再評価する。抗血栓療法の継続期間は病変の治癒が画像で確認されるまで、少なくとも3か月を目安とする。"]},{"n":27,"ja":"片側の内頸静脈開存が保たれる前提で、内頸静脈損傷の修復が容易に達成できない場合は結紮を推奨する","en":"Ligation is recommended if repair of internal jugular vein injury is not easily achievable, provided one internal jugular vein remains patent.","cls":"I","lvl":"C","sec":"頸部","page":18,"det":"内頸静脈損傷は、修復が容易に達成できない場合には結紮が推奨される。ただし片側の内頸静脈の開存が保たれることが前提である。内頸静脈は脳からの静脈還流の主要経路であり、両側を結紮すると頭蓋内圧上昇や著明な顔面・頸部のうっ血を招きうる。したがって、片側が健常であれば患側の結紮は許容され、外頸静脈は結紮して差し支えない。一方、両側損傷の場合には、少なくとも一側の修復を試みるべきである。\n\n修復は、静脈の壁が比較的保たれていれば側壁縫合や端々吻合、パッチ形成で行う。静脈は壁が薄くlow pressureであり、膿瘍や汚染創では縫合不全と血栓症のリスクが高いため、無理な再建は避ける。頸部では気道・神経・胸管などとの近接があり、結紮の判断は「出血の制御が最優先」という原則の中で行う。実務では、術前のCTAで対側内頸静脈の開存とSVCまでの連続性を確認しておくこと、結紮後は頭蓋内圧の上昇や顔面腫脹の出現に注意し、必要なら頭部挙上や鎮静で対応することが重要である。静脈結紮は動脈修復と比べて「見逃されやすい決断」であり、片側開存の確認を術中に必ず記録しておくことが望ましい。実務では、術前のCTAで対側内頸静脈の開存と上大静脈までの連続性を確認しておくこと、結紮後は頭蓋内圧上昇や顔面腫脹の出現に注意し、必要なら頭部挙上や鎮静で対応することが重要である。静脈結紮は動脈修復と比べて見逃されやすい決断であり、片側開存の確認を術中に必ず記録しておきたい。","detp":["内頸静脈損傷は、修復が容易に達成できない場合には結紮が推奨される。ただし片側の内頸静脈の開存が保たれることが前提である。内頸静脈は脳からの静脈還流の主要経路であり、両側を結紮すると頭蓋内圧上昇や著明な顔面・頸部のうっ血を招きうる。したがって、片側が健常であれば患側の結紮は許容され、外頸静脈は結紮して差し支えない。一方、両側損傷の場合には、少なくとも一側の修復を試みるべきである。","修復は、静脈の壁が比較的保たれていれば側壁縫合や端々吻合、パッチ形成で行う。静脈は壁が薄くlow pressureであり、膿瘍や汚染創では縫合不全と血栓症のリスクが高いため、無理な再建は避ける。頸部では気道・神経・胸管などとの近接があり、結紮の判断は「出血の制御が最優先」という原則の中で行う。実務では、術前のCTAで対側内頸静脈の開存とSVCまでの連続性を確認しておくこと、結紮後は頭蓋内圧の上昇や顔面腫脹の出現に注意し、必要なら頭部挙上や鎮静で対応することが重要である。","静脈結紮は動脈修復と比べて「見逃されやすい決断」であり、片側開存の確認を術中に必ず記録しておくことが望ましい。実務では、術前のCTAで対側内頸静脈の開存と上大静脈までの連続性を確認しておくこと、結紮後は頭蓋内圧上昇や顔面腫脹の出現に注意し、必要なら頭部挙上や鎮静で対応することが重要である。静脈結紮は動脈修復と比べて見逃されやすい決断であり、片側開存の確認を術中に必ず記録しておきたい。"]},{"n":28,"ja":"鈍的頸部外傷患者で、臨床診察のみにより頸部血管損傷を否定することは推奨しない","en":"Clinical examination alone is not recommended to rule out cervical vascular injury in patients with blunt neck trauma.","cls":"IIIb","lvl":"C","sec":"頸部","page":18,"det":"鈍的頸部外傷患者において、臨床診察のみで頸部血管損傷（BCVI）を否定することは推奨されない。鈍的損傷は来院時に無症状であることが最も多く、CTAで初めて発見される。頸動脈閉塞や塞栓による脳卒中症状で発症することもあるが、閉塞が無症状のまま経過することもある。より多いのは、内膜・壁内損傷（ESVS Grade 1または2）の血栓塞栓合併症による遅発性の脳卒中であり、これは受傷後数時間から数日で生じうる。\n\nBCVIが穿通性頸部損傷のような臨床徴候（活動性出血、拡大する血腫）で発症することはまれで、出血性ショックに至ることはほとんどない。つまり「診察で異常がなければ大丈夫」という前提が成り立たない点が、この推奨の核心である。頸部のbruit、拡大する血腫、神経学的脱落所見、頭部CT所見と矛盾する神経所見、意識レベル低下などはリスク指標となるが、いずれも感度が十分ではない。したがって、損傷機転（高エネルギー外傷、頸椎骨折・脱臼、上顎や下顎の骨折、頭蓋底骨折、near hanging、シートベルト痕など）からリスクを拾い上げ、CTAへ進む判断を組織的に行う。見逃しの代償は若年患者の生涯にわたる脳卒中であり、過剰撮影のリスクを上回る。","detp":["鈍的頸部外傷患者において、臨床診察のみで頸部血管損傷（BCVI）を否定することは推奨されない。鈍的損傷は来院時に無症状であることが最も多く、CTAで初めて発見される。頸動脈閉塞や塞栓による脳卒中症状で発症することもあるが、閉塞が無症状のまま経過することもある。より多いのは、内膜・壁内損傷（ESVS Grade 1または2）の血栓塞栓合併症による遅発性の脳卒中であり、これは受傷後数時間から数日で生じうる。","BCVIが穿通性頸部損傷のような臨床徴候（活動性出血、拡大する血腫）で発症することはまれで、出血性ショックに至ることはほとんどない。つまり「診察で異常がなければ大丈夫」という前提が成り立たない点が、この推奨の核心である。頸部のbruit、拡大する血腫、神経学的脱落所見、頭部CT所見と矛盾する神経所見、意識レベル低下などはリスク指標となるが、いずれも感度が十分ではない。したがって、損傷機転（高エネルギー外傷、頸椎骨折・脱臼、上顎や下顎の骨折、頭蓋底骨折、near hanging、シートベルト痕など）からリスクを拾い上げ、CTAへ進む判断を組織的に行う。","見逃しの代償は若年患者の生涯にわたる脳卒中であり、過剰撮影のリスクを上回る。"]},{"n":29,"ja":"鈍的脳血管損傷のリスクがあるすべての患者に、頭蓋内血管を含むCTAを推奨する","en":"Computed tomography angiography including intracerebral vessels is recommended for all patients at risk of blunt cerebrovascular injury.","cls":"I","lvl":"B","sec":"頸部","page":19,"det":"鈍的脳血管損傷（BCVI）のリスクがあるすべての患者に、頭蓋内血管を含むCTAが推奨される。撮影範囲は大動脈弓から始め、頸部の総頸動脈・椎骨動脈だけでなく、頭蓋内の内頸動脈と椎骨動脈・脳底動脈までを含める。BCVIの病変は頸部に限らず、頭蓋内区間やV3・V4領域にも及びうるため、頸部のみの撮影では見逃しが生じる。BCVIに対するCTAの特異度と陰性適中率は97〜100%と報告されており、スクリーニングとしての信頼性は高い。\n\n造影剤のタイミングは動脈相を主体とし、必要に応じて遅延相を追加する。頸椎の骨折線や金属固定具によるアーチファクトが椎骨動脈の評価を妨げる場合は、再構成やmultiplanarでの確認を行う。また、初回CTAでBCVIが陰性でも、受傷後時間が経ってから病変が顕在化することがあり、神経症状が出現した場合には再検を考慮する。本推奨が「リスクがあるすべての患者」としている点は、スクリーニング基準を厳格にしすぎて見逃しを増やすより、一定の過剰撮影を許容してでも拾い上げるほうが安全であるという判断を反映している。施設ごとにスクリーニング基準を明文化し、外傷初療のプロトコルに組み込むことが実行の鍵となる。","detp":["鈍的脳血管損傷（BCVI）のリスクがあるすべての患者に、頭蓋内血管を含むCTAが推奨される。撮影範囲は大動脈弓から始め、頸部の総頸動脈・椎骨動脈だけでなく、頭蓋内の内頸動脈と椎骨動脈・脳底動脈までを含める。BCVIの病変は頸部に限らず、頭蓋内区間やV3・V4領域にも及びうるため、頸部のみの撮影では見逃しが生じる。BCVIに対するCTAの特異度と陰性適中率は97〜100%と報告されており、スクリーニングとしての信頼性は高い。","造影剤のタイミングは動脈相を主体とし、必要に応じて遅延相を追加する。頸椎の骨折線や金属固定具によるアーチファクトが椎骨動脈の評価を妨げる場合は、再構成やmultiplanarでの確認を行う。また、初回CTAでBCVIが陰性でも、受傷後時間が経ってから病変が顕在化することがあり、神経症状が出現した場合には再検を考慮する。本推奨が「リスクがあるすべての患者」としている点は、スクリーニング基準を厳格にしすぎて見逃しを増やすより、一定の過剰撮影を許容してでも拾い上げるほうが安全であるという判断を反映している。","施設ごとにスクリーニング基準を明文化し、外傷初療のプロトコルに組み込むことが実行の鍵となる。"]},{"n":30,"ja":"鈍的外傷患者で頸部血管損傷を早期に同定するスクリーニングプロトコルの使用を考慮すべき","en":"The use of screening protocols to identify cervical vascular injury early should be considered for patients with blunt trauma.","cls":"IIa","lvl":"C","sec":"頸部","page":19,"det":"鈍的外傷患者で頸部血管損傷を早期に同定するスクリーニングプロトコルの使用を考慮すべきとされる。どの患者をスクリーニングするかは依然として明確ではなく、複数のプロトコルが提案されており、いずれもBCVIの徴候・症状と、受傷機転や合併損傷に基づくリスク因子の双方を含む。緩すぎる基準は過剰診断・過剰治療・不必要な被曝を招き、厳しすぎる基準は治療機会の逸失を招くというトレードオフがある。\n\n直接比較した前向き研究や無作為化試験はないが、modified Denver criteriaが最も広く研究され普及している。実務では、①頸部・鼻・口腔からの動脈性出血、頸部bruit（50歳未満）、拡大する頸部血腫、限局性神経脱落所見、頭部CTと矛盾する神経所見、②高エネルギー機転に伴うLe Fort II/III型骨折、下顎骨骨折、複雑または頭蓋底・後頭顆骨折、GCS 8未満の重症TBI、頸椎骨折・脱臼・靭帯損傷、near hanging、シートベルト痕、などが代表的なトリガーとなる。施設で1つを採用し、外傷チームが同じ基準で動けるようにすることが重要であり、基準を満たす症例では入院後早期に（遅くとも24時間以内に）CTAを施行する運用とする。","detp":["鈍的外傷患者で頸部血管損傷を早期に同定するスクリーニングプロトコルの使用を考慮すべきとされる。どの患者をスクリーニングするかは依然として明確ではなく、複数のプロトコルが提案されており、いずれもBCVIの徴候・症状と、受傷機転や合併損傷に基づくリスク因子の双方を含む。緩すぎる基準は過剰診断・過剰治療・不必要な被曝を招き、厳しすぎる基準は治療機会の逸失を招くというトレードオフがある。","直接比較した前向き研究や無作為化試験はないが、modified Denver criteriaが最も広く研究され普及している。実務では、①頸部・鼻・口腔からの動脈性出血、頸部bruit（50歳未満）、拡大する頸部血腫、限局性神経脱落所見、頭部CTと矛盾する神経所見、②高エネルギー機転に伴うLe Fort II/III型骨折、下顎骨骨折、複雑または頭蓋底・後頭顆骨折、GCS 8未満の重症TBI、頸椎骨折・脱臼・靭帯損傷、near hanging、シートベルト痕、などが代表的なトリガーとなる。","施設で1つを採用し、外傷チームが同じ基準で動けるようにすることが重要であり、基準を満たす症例では入院後早期に（遅くとも24時間以内に）CTAを施行する運用とする。"]},{"n":31,"ja":"鈍的低グレード頸動脈損傷(ESVS Grade 1)患者には、単剤抗血小板療法の非手術管理を推奨する","en":"Non-operative management with single antiplatelet therapy is recommended for patients with blunt, low grade carotid artery injury (ESVS Grade 1).","cls":"I","lvl":"C","sec":"頸部","page":19,"det":"鈍的低グレード頸動脈損傷（ESVS Grade 1：内膜損傷、解離、壁内血腫）には、抗血栓療法による非手術管理が推奨される。低グレード病変は自然治癒する可能性が高く、初期6か月のあいだに血管の修復（リモデリング）が生じることが多い。問題は血栓塞栓による脳梗塞であるため、治療の主眼は抗血栓療法となる。抗凝固薬と抗血小板薬の比較では、近年のメタ解析で抗血小板薬のほうが脳卒中率が低く、出血合併症も少ないと報告されており、単剤抗血小板療法が第一選択となる。アスピリンとヘパリンの直接比較では脳卒中率に差はなく、アスピリンのほうが出血リスクが低かった。\n\n開始は診断がついた時点で速やかに行う。多発外傷で頭蓋内出血や実質臓器損傷を合併する場合には出血リスクとのバランスを要するが、BCVIに対する抗血栓療法を差し控える閾値は高く設定すべきとされている。治療期間は少なくとも3か月、画像で病変の消失が確認できれば早期に終了してよい。dual antiplatelet therapyやDOACの追加利益を示すエビデンスはない。実務では、開始時と3か月時点のCTA（またはMRA）で治癒を確認し、神経所見の変化があれば直ちに再評価する体制を組む。","detp":["鈍的低グレード頸動脈損傷（ESVS Grade 1：内膜損傷、解離、壁内血腫）には、抗血栓療法による非手術管理が推奨される。低グレード病変は自然治癒する可能性が高く、初期6か月のあいだに血管の修復（リモデリング）が生じることが多い。問題は血栓塞栓による脳梗塞であるため、治療の主眼は抗血栓療法となる。抗凝固薬と抗血小板薬の比較では、近年のメタ解析で抗血小板薬のほうが脳卒中率が低く、出血合併症も少ないと報告されており、単剤抗血小板療法が第一選択となる。","アスピリンとヘパリンの直接比較では脳卒中率に差はなく、アスピリンのほうが出血リスクが低かった。開始は診断がついた時点で速やかに行う。多発外傷で頭蓋内出血や実質臓器損傷を合併する場合には出血リスクとのバランスを要するが、BCVIに対する抗血栓療法を差し控える閾値は高く設定すべきとされている。治療期間は少なくとも3か月、画像で病変の消失が確認できれば早期に終了してよい。dual antiplatelet therapyやDOACの追加利益を示すエビデンスはない。","実務では、開始時と3か月時点のCTA（またはMRA）で治癒を確認し、神経所見の変化があれば直ちに再評価する体制を組む。"]},{"n":32,"ja":"活動性出血のない鈍的頸動脈損傷(Grade 1/2)で、抗血栓療法への付加としてのルーチン血管内ステント留置は推奨しない","en":"The use of routine endovascular stenting as an adjunct to antithrombotic therapy is not recommended for patients with blunt carotid artery injury without active bleeding (ESVS Grade 1 or 2).","cls":"IIIb","lvl":"C","sec":"頸部","page":20,"det":"活動性出血のない鈍的頸動脈損傷（ESVS Grade 1/2）において、抗血栓療法への付加としてルーチンに血管内ステントを留置することは推奨されない。高グレードの鈍的頸動脈損傷（偽動脈瘤など）は低グレードより治癒しにくいが、頸動脈偽動脈瘤の自然歴は大多数が時間とともに治癒する。抗血栓療法を差し控えた場合に脳卒中が約4倍、死亡が約10倍に増加したという報告があり、治療の中心は抗血栓療法に置かれてきた。すなわち、Grade 1/2に対するステントの上乗せ効果は限定的である。\n\nさらに、ステント留置にはin-stent thrombosisによる脳梗塞という固有のリスクがあり、若年の外傷患者に長期の抗血小板療法を追加で必要とする。ルーチン化は利益より害が上回りうる。血管内治療（ステントグラフトまたはステント）は、偽動脈瘤が増大する症例（10mm超が一つの目安として提案されている）や、血栓・塞栓を伴う高度狭窄、神経症状を反復する症例など、選択された少数例に限って考慮する。実務では、3か月時点のCTAで病変の縮小・治癒を確認し、増大や症状出現があった場合に初めて血管内治療の適応を検討する、という段階的な方針が合理的である。","detp":["活動性出血のない鈍的頸動脈損傷（ESVS Grade 1/2）において、抗血栓療法への付加としてルーチンに血管内ステントを留置することは推奨されない。高グレードの鈍的頸動脈損傷（偽動脈瘤など）は低グレードより治癒しにくいが、頸動脈偽動脈瘤の自然歴は大多数が時間とともに治癒する。抗血栓療法を差し控えた場合に脳卒中が約4倍、死亡が約10倍に増加したという報告があり、治療の中心は抗血栓療法に置かれてきた。","すなわち、Grade 1/2に対するステントの上乗せ効果は限定的である。さらに、ステント留置にはin-stent thrombosisによる脳梗塞という固有のリスクがあり、若年の外傷患者に長期の抗血小板療法を追加で必要とする。ルーチン化は利益より害が上回りうる。血管内治療（ステントグラフトまたはステント）は、偽動脈瘤が増大する症例（10mm超が一つの目安として提案されている）や、血栓・塞栓を伴う高度狭窄、神経症状を反復する症例など、選択された少数例に限って考慮する。","実務では、3か月時点のCTAで病変の縮小・治癒を確認し、増大や症状出現があった場合に初めて血管内治療の適応を検討する、という段階的な方針が合理的である。"]},{"n":33,"ja":"鈍的頸動脈・椎骨動脈損傷で増大する偽動脈瘤(Grade 2)または神経症状を伴う場合、遅延的血管内治療を考慮してもよい","en":"Delayed endovascular treatment may be considered for patients with blunt carotid or vertebral artery injury and enlarging pseudoaneurysm (ESVS Grade 2) or neurological symptoms.","cls":"IIb","lvl":"C","sec":"頸部","page":20,"det":"鈍的頸動脈・椎骨動脈損傷で、増大する偽動脈瘤（ESVS Grade 2）または神経症状を伴う場合には、遅延的血管内治療を考慮してもよい。タイミングを「遅延」とするのは、急性期には病変の自然経過が未確定であり、抗血栓療法で治癒する症例が少なくないこと、また外傷急性期の抗血小板・抗凝固療法下でのステント留置は出血リスクと血栓リスクが重なることによる。増大傾向は10mmを一つの閾値とする提案があり、画像フォローアップでサイズの増大、血栓・塞栓を伴う高度狭窄、神経症状の反復が確認された場合に治療を前倒しする。\n\n椎骨動脈では、偽動脈瘤の大部分は良性の経過をとり、一過性脳虚血発作や脳卒中の頻度は5%未満、非虚血性症状の再発や増大も5%未満とされる。したがって、出血、抗血栓療法下でも反復する脳虚血イベント、増大する偽動脈瘤が血管内治療（塞栓術またはステント）の適応となる。頸動脈では、遅延的治療は治癒しない病変に限定して行うことが転帰を改善しうる。いずれも、治療選択には病変の部位・側副血行・対側の開存・患者年齢とフォローアップ可能性を組み込んで判断する。フォローアップを継続できる見込みがない症例では、経過観察を前提とした「待ち」の方針そのものを再考する必要がある。","detp":["鈍的頸動脈・椎骨動脈損傷で、増大する偽動脈瘤（ESVS Grade 2）または神経症状を伴う場合には、遅延的血管内治療を考慮してもよい。タイミングを「遅延」とするのは、急性期には病変の自然経過が未確定であり、抗血栓療法で治癒する症例が少なくないこと、また外傷急性期の抗血小板・抗凝固療法下でのステント留置は出血リスクと血栓リスクが重なることによる。増大傾向は10mmを一つの閾値とする提案があり、画像フォローアップでサイズの増大、血栓・塞栓を伴う高度狭窄、神経症状の反復が確認された場合に治療を前倒しする。","椎骨動脈では、偽動脈瘤の大部分は良性の経過をとり、一過性脳虚血発作や脳卒中の頻度は5%未満、非虚血性症状の再発や増大も5%未満とされる。したがって、出血、抗血栓療法下でも反復する脳虚血イベント、増大する偽動脈瘤が血管内治療（塞栓術またはステント）の適応となる。頸動脈では、遅延的治療は治癒しない病変に限定して行うことが転帰を改善しうる。いずれも、治療選択には病変の部位・側副血行・対側の開存・患者年齢とフォローアップ可能性を組み込んで判断する。","フォローアップを継続できる見込みがない症例では、経過観察を前提とした「待ち」の方針そのものを再考する必要がある。"]},{"n":34,"ja":"活動性出血を伴う鈍的頸動脈損傷(Grade 3)患者には、open repairまたは血管内ステントグラフトによる手術治療を推奨する","en":"Operative treatment with open repair or endovascular stent graft is recommended for patients with blunt carotid artery injury and active haemorrhage (ESVS Grade 3).","cls":"I","lvl":"C","sec":"頸部","page":20,"det":"活動性出血を伴う鈍的頸動脈損傷（ESVS Grade 3）には、open repairまたは血管内ステントグラフトによる手術治療が推奨される。BCVIでGrade 3はまれだが、持続する出血や拡大する頸部血腫を伴う場合は致死的であり、保存的治療の適応はない。頸部の解剖に応じて、外科的探索による直接修復・結紮・グラフト再建と、ステントグラフトによる被覆のいずれかを選ぶ。到達が困難な高位病変や、血腫で解剖が不明瞭な症例、循環が破綻している症例では、血管内治療のほうが迅速で低侵襲となりうる。\n\n判断の要点は、①気道の確保（血腫による圧迫、口腔内出血がある場合は特に優先）、②中枢・末梢の制御部位を術前CTAで確定すること、③止血と脳灌流温存の両立である。結紮は最終手段であり、可能なら修復または被覆を優先する（推奨22と同様の論理）。出血が制御できた後も、塞栓源としての血栓リスクが残るため抗血栓療法の導入時期を検討する。なお、この状況では抗凝固療法は禁忌に近く、止血が確認されるまでは投与しない。ハイブリッド手術室の有無が手段選択を左右する典型例である。判断の要点は、気道の確保（血腫による圧迫、口腔内出血がある場合は特に優先）、中枢・末梢の制御部位を術前CTAで確定すること、止血と脳灌流温存の両立である。出血が制御できた後も塞栓源としての血栓リスクが残るため抗血栓療法の導入時期を検討するが、止血が確認されるまでは投与しない。","detp":["活動性出血を伴う鈍的頸動脈損傷（ESVS Grade 3）には、open repairまたは血管内ステントグラフトによる手術治療が推奨される。BCVIでGrade 3はまれだが、持続する出血や拡大する頸部血腫を伴う場合は致死的であり、保存的治療の適応はない。頸部の解剖に応じて、外科的探索による直接修復・結紮・グラフト再建と、ステントグラフトによる被覆のいずれかを選ぶ。到達が困難な高位病変や、血腫で解剖が不明瞭な症例、循環が破綻している症例では、血管内治療のほうが迅速で低侵襲となりうる。","判断の要点は、①気道の確保（血腫による圧迫、口腔内出血がある場合は特に優先）、②中枢・末梢の制御部位を術前CTAで確定すること、③止血と脳灌流温存の両立である。結紮は最終手段であり、可能なら修復または被覆を優先する（推奨22と同様の論理）。出血が制御できた後も、塞栓源としての血栓リスクが残るため抗血栓療法の導入時期を検討する。なお、この状況では抗凝固療法は禁忌に近く、止血が確認されるまでは投与しない。","ハイブリッド手術室の有無が手段選択を左右する典型例である。判断の要点は、気道の確保（血腫による圧迫、口腔内出血がある場合は特に優先）、中枢・末梢の制御部位を術前CTAで確定すること、止血と脳灌流温存の両立である。出血が制御できた後も塞栓源としての血栓リスクが残るため抗血栓療法の導入時期を検討するが、止血が確認されるまでは投与しない。"]},{"n":35,"ja":"神経症状のない鈍的頸動脈損傷・完全閉塞(Grade X)患者には、単剤抗血小板療法の非手術管理を考慮すべき","en":"Non-operative management with single antiplatelet therapy should be considered for patients with blunt carotid injury and complete occlusion (ESVS Grade X) without neurological symptoms.","cls":"IIa","lvl":"C","sec":"頸部","page":20,"det":"神経症状のない鈍的頸動脈損傷・完全閉塞（ESVS Grade X）には、単剤抗血小板療法による非手術管理を考慮すべきとされる。閉塞性病変は脳卒中リスクを伴い管理が難しいが、神経学的診察が正常な完全閉塞では、観察と抗凝固・抗血小板による経過観察が許容されるアプローチとなる。ただしエビデンスは小規模な症例集積に限られる。内頸動脈の完全閉塞で頭蓋底まで及ぶ症例では、抗血栓療法単独が提案されている。無症状例では側副血行が保たれていることが前提であり、後交通動脈や前交通動脈を介した灌流をCTA/MRAで確認しておく。\n\n実務では、神経所見を定期的に評価し、新たな症状が出現した場合は方針を再検討する。抗血栓療法は診断時から開始し、少なくとも3か月継続、画像で安定・治癒が確認できれば終了を検討する。再開通を目指す介入（血栓摘除、ステント）は、発症からの時間と梗塞の広がりにより再灌流障害のリスクが高く、無症状例に適応はない。この推奨は「閉塞＝緊急再開通」という反射を避け、症状と側副血行で層別化することを求めている。実務では、神経所見を定期的に評価し、新たな症状が出現した場合は方針を再検討する。抗血栓療法は診断時から開始し、少なくとも3か月継続、画像で安定・治癒が確認できれば終了を検討する。この推奨は「閉塞＝緊急再開通」という反射を避け、症状と側副血行で層別化することを求めている。","detp":["神経症状のない鈍的頸動脈損傷・完全閉塞（ESVS Grade X）には、単剤抗血小板療法による非手術管理を考慮すべきとされる。閉塞性病変は脳卒中リスクを伴い管理が難しいが、神経学的診察が正常な完全閉塞では、観察と抗凝固・抗血小板による経過観察が許容されるアプローチとなる。ただしエビデンスは小規模な症例集積に限られる。内頸動脈の完全閉塞で頭蓋底まで及ぶ症例では、抗血栓療法単独が提案されている。","無症状例では側副血行が保たれていることが前提であり、後交通動脈や前交通動脈を介した灌流をCTA/MRAで確認しておく。実務では、神経所見を定期的に評価し、新たな症状が出現した場合は方針を再検討する。抗血栓療法は診断時から開始し、少なくとも3か月継続、画像で安定・治癒が確認できれば終了を検討する。再開通を目指す介入（血栓摘除、ステント）は、発症からの時間と梗塞の広がりにより再灌流障害のリスクが高く、無症状例に適応はない。","この推奨は「閉塞＝緊急再開通」という反射を避け、症状と側副血行で層別化することを求めている。実務では、神経所見を定期的に評価し、新たな症状が出現した場合は方針を再検討する。抗血栓療法は診断時から開始し、少なくとも3か月継続、画像で安定・治癒が確認できれば終了を検討する。この推奨は「閉塞＝緊急再開通」という反射を避け、症状と側副血行で層別化することを求めている。"]},{"n":36,"ja":"神経症状を伴う鈍的頸動脈完全閉塞(Grade X)の管理は、神経症状の持続時間・再灌流障害のリスク・CT上の脳梗塞所象を含め個別に考慮すべき","en":"Management of blunt carotid injury and complete occlusion (ESVS Grade X) with neurological symptoms should be considered on an individual basis, including the duration of neurological symptoms, risk of reperfusion injury, and signs of brain infarction on computed tomography.","cls":"IIa","lvl":"C","sec":"頸部","page":20,"det":"神経症状を伴う鈍的頸動脈完全閉塞（ESVS Grade X）の管理は、個別に考慮すべきとされる。考慮すべき因子は、神経症状の持続時間、再灌流障害のリスク、CT上の脳梗塞所見であり、これに血行動態、閉塞の範囲（総頸動脈か内頸動脈か、頭蓋底までの進展）、側副血行の状態が加わる。エビデンスはきわめて限られ、直接管理を導くデータはほとんどない。\n\n実務的な整理としては、①すでに広範な梗塞が完成している症例では再開通は出血性変化を招くため行わない、②神経症状が軽微で発症からの時間が短く、まだ広範な梗塞に至っていない症例では、再灌流の利益がリスクを上回る可能性があり個別に検討する、③意識障害が遷延している症例では、神経学的予後と全身の生理状態を踏まえ、侵襲の大きい介入は慎重に判断する。いずれの場合も、抗血栓療法の導入と神経集中治療（血圧管理、脳灌流の維持、頭蓋内圧管理）が基盤となる。複数科（脳神経外科、脳卒中内科、血管外科）での合同判断が望ましい。①すでに広範な梗塞が完成している症例では再開通は出血性変化を招くため行わない、②神経症状が軽微で発症からの時間が短くまだ広範な梗塞に至っていない症例では再灌流の利益がリスクを上回る可能性があり個別に検討する、③意識障害が遷延している症例では神経学的予後と全身の生理状態を踏まえ侵襲の大きい介入は慎重に判断する、という整理になる。","detp":["神経症状を伴う鈍的頸動脈完全閉塞（ESVS Grade X）の管理は、個別に考慮すべきとされる。考慮すべき因子は、神経症状の持続時間、再灌流障害のリスク、CT上の脳梗塞所見であり、これに血行動態、閉塞の範囲（総頸動脈か内頸動脈か、頭蓋底までの進展）、側副血行の状態が加わる。エビデンスはきわめて限られ、直接管理を導くデータはほとんどない。実務的な整理としては、①すでに広範な梗塞が完成している症例では再開通は出血性変化を招くため行わない、②神経症状が軽微で発症からの時間が短く、まだ広範な梗塞に至っていない症例では、再灌流の利益がリスクを上回る可能性があり個別に検討する、③意識障害が遷延している症例では、神経学的予後と全身の生理状態を踏まえ、侵襲の大きい介入は慎重に判断する。","いずれの場合も、抗血栓療法の導入と神経集中治療（血圧管理、脳灌流の維持、頭蓋内圧管理）が基盤となる。複数科（脳神経外科、脳卒中内科、血管外科）での合同判断が望ましい。①すでに広範な梗塞が完成している症例では再開通は出血性変化を招くため行わない、②神経症状が軽微で発症からの時間が短くまだ広範な梗塞に至っていない症例では再灌流の利益がリスクを上回る可能性があり個別に検討する、③意識障害が遷延している症例では神経学的予後と全身の生理状態を踏まえ侵襲の大きい介入は慎重に判断する、という整理になる。"]},{"n":37,"ja":"活動性出血のない鈍的椎骨動脈損傷(Grade 1, 2, X)患者には、第一選択として抗血小板療法を推奨する","en":"Management with antiplatelet therapy as first line treatment is recommended for patients with blunt vertebral artery injury without active haemorrhage (ESVS Grades 1, 2, or X).","cls":"I","lvl":"B","sec":"頸部","page":20,"det":"活動性出血のない鈍的椎骨動脈損傷（ESVS Grade 1、2、X）には、第一選択として抗血小板療法が推奨される。鈍的椎骨動脈損傷の好発部位は中部から遠位であり、頸動脈損傷より脳卒中リスクは低い。外傷・自然発症・医原性を含む症例集積では、抗血栓療法による非手術管理が第一選択とされ、受傷後初期6か月のあいだに自然治癒が期待できる。高グレード（Grade 2）の偽動脈瘤も、一般に良性の経過をとり、一過性脳虚血発作や脳卒中は5%未満、非虚血性症状の再発や増大も5%未満とされ、抗血栓療法で管理できる。\n\n血管内治療（塞栓術・ステント）の適応は、椎骨動脈性の出血、抗血栓療法下でも反復する脳虚血イベント、増大する偽動脈瘤に限られる。血管内治療が不可能で出血が制御できない場合には、椎骨動脈結紮が提案される。無症状の鈍的椎骨動脈完全閉塞（Grade X）も抗血小板療法が合理的である。抗血小板薬と抗凝固薬の比較では、脳卒中率・出血リスクともに抗血小板薬が有利とされ、単剤が基本となる。治療は少なくとも3か月、画像で治癒が確認できれば早期に終了してよい。血管内治療（塞栓術・ステント）の適応は、椎骨動脈性の出血、抗血栓療法下でも反復する脳虚血イベント、増大する偽動脈瘤に限られ、血管内治療が不可能で出血が制御できない場合には椎骨動脈結紮が提案される。抗血小板薬と抗凝固薬の比較では、脳卒中率・出血リスクともに抗血小板薬が有利とされ、単剤が基本となる。","detp":["活動性出血のない鈍的椎骨動脈損傷（ESVS Grade 1、2、X）には、第一選択として抗血小板療法が推奨される。鈍的椎骨動脈損傷の好発部位は中部から遠位であり、頸動脈損傷より脳卒中リスクは低い。外傷・自然発症・医原性を含む症例集積では、抗血栓療法による非手術管理が第一選択とされ、受傷後初期6か月のあいだに自然治癒が期待できる。高グレード（Grade 2）の偽動脈瘤も、一般に良性の経過をとり、一過性脳虚血発作や脳卒中は5%未満、非虚血性症状の再発や増大も5%未満とされ、抗血栓療法で管理できる。","血管内治療（塞栓術・ステント）の適応は、椎骨動脈性の出血、抗血栓療法下でも反復する脳虚血イベント、増大する偽動脈瘤に限られる。血管内治療が不可能で出血が制御できない場合には、椎骨動脈結紮が提案される。無症状の鈍的椎骨動脈完全閉塞（Grade X）も抗血小板療法が合理的である。抗血小板薬と抗凝固薬の比較では、脳卒中率・出血リスクともに抗血小板薬が有利とされ、単剤が基本となる。治療は少なくとも3か月、画像で治癒が確認できれば早期に終了してよい。","血管内治療（塞栓術・ステント）の適応は、椎骨動脈性の出血、抗血栓療法下でも反復する脳虚血イベント、増大する偽動脈瘤に限られ、血管内治療が不可能で出血が制御できない場合には椎骨動脈結紮が提案される。抗血小板薬と抗凝固薬の比較では、脳卒中率・出血リスクともに抗血小板薬が有利とされ、単剤が基本となる。"]},{"n":38,"ja":"鈍的頭蓋外椎骨動脈損傷でコントロール不能な出血(Grade 3)を伴う患者には、可能なら塞栓術による緊急血管内管理を推奨する","en":"Emergency endovascular management with embolisation, if feasible, is recommended for patients with blunt extracranial vertebral artery injury and uncontrolled haemorrhage (ESVS Grade 3).","cls":"I","lvl":"C","sec":"頸部","page":21,"det":"鈍的頭蓋外椎骨動脈損傷で制御不能な出血（Grade 3）を伴う患者には、可能であれば塞栓術による緊急血管内管理が推奨される。鈍的損傷でこの状況はまれだが、生じれば致死的であり、頸部深部の出血は圧迫が効きにくく、気道圧迫も加わる。椎骨動脈は外科的到達が困難なため、血管内治療が第一選択となる。塞栓は病変の近位・遠位の両方を確実に閉塞させる必要があり、対側椎骨動脈と後交通動脈を介した後循環の灌流を事前に評価する。\n\n可能でなければ外科的結紮を選択するが、頸部の血腫で解剖が不明瞭なことが多く、内頸動脈・迷走神経・胸管の損傷を避ける繊細な操作が必要である。実務では、気道確保を最優先とし、循環の安定化と頸部圧迫を継続しながら血管造影室またはハイブリッド手術室へ搬送する。出血源が椎骨動脈か頸動脈かの判断にDSAが有用であり、緊急度が高い場合は画像診断を待たず臨床所見と創の方向から推定して治療に踏み切る判断も必要となる。穿通性Grade 3に対する推奨25と対をなす内容である。実務では、気道確保を最優先とし、循環の安定化と頸部圧迫を継続しながら血管造影室またはハイブリッド手術室へ搬送する。緊急度が高い場合は画像診断を待たず、臨床所見と創の方向から出血源を推定して治療に踏み切る判断も必要となる。穿通性Grade 3に対する推奨25と対をなす内容である。","detp":["鈍的頭蓋外椎骨動脈損傷で制御不能な出血（Grade 3）を伴う患者には、可能であれば塞栓術による緊急血管内管理が推奨される。鈍的損傷でこの状況はまれだが、生じれば致死的であり、頸部深部の出血は圧迫が効きにくく、気道圧迫も加わる。椎骨動脈は外科的到達が困難なため、血管内治療が第一選択となる。塞栓は病変の近位・遠位の両方を確実に閉塞させる必要があり、対側椎骨動脈と後交通動脈を介した後循環の灌流を事前に評価する。","可能でなければ外科的結紮を選択するが、頸部の血腫で解剖が不明瞭なことが多く、内頸動脈・迷走神経・胸管の損傷を避ける繊細な操作が必要である。実務では、気道確保を最優先とし、循環の安定化と頸部圧迫を継続しながら血管造影室またはハイブリッド手術室へ搬送する。出血源が椎骨動脈か頸動脈かの判断にDSAが有用であり、緊急度が高い場合は画像診断を待たず臨床所見と創の方向から推定して治療に踏み切る判断も必要となる。","穿通性Grade 3に対する推奨25と対をなす内容である。実務では、気道確保を最優先とし、循環の安定化と頸部圧迫を継続しながら血管造影室またはハイブリッド手術室へ搬送する。緊急度が高い場合は画像診断を待たず、臨床所見と創の方向から出血源を推定して治療に踏み切る判断も必要となる。穿通性Grade 3に対する推奨25と対をなす内容である。"]},{"n":39,"ja":"抗血小板療法で非手術管理する鈍的頸動脈損傷(Grade 1/2)患者には、1週時と3か月時のCTAサーベイランスを考慮すべき","en":"Surveillance with computed tomography angiography at one week and three months should be considered for patients with blunt carotid artery injury (ESVS Grade 1 or 2) undergoing non-operative management with antiplatelet treatment.","cls":"IIa","lvl":"C","sec":"頸部","page":22,"det":"抗血小板療法で非手術管理する鈍的頸動脈損傷（ESVS Grade 1/2）患者には、1週時と3か月時のCTAサーベイランスを考慮すべきとされる。鈍的病変は受傷後早期から数か月のあいだにダイナミックに変化し、自然治癒は3〜12か月以内に生じる。1週時のCTAは病変の進行（偽動脈瘤の増大、狭窄の悪化、血栓の進展）を早期に捉えるため、3か月時は治癒の確認と抗血栓療法の継続期間を決める判断材料となる。\n\n特に、3か月時点で病変が消失していれば抗血栓療法を終了できる可能性があり、逆に残存・増大していれば治療強化や血管内治療の適応を検討する。撮影は頸部から頭蓋内までを含め、前回との比較ができる同一プロトコルで行うことが望ましい。被曝と造影剤の反復投与を考慮し、若年者では超音波やMRAへの置換を検討してもよいが、頸部血管の評価精度はCTAが優る。フォローアップからの脱落が外傷患者では問題になりやすく、退院時に次回撮影の予約を組み、受診勧奨を文書で渡すことが実効性を高める。特に3か月時点で病変が消失していれば抗血栓療法を終了できる可能性があり、逆に残存・増大していれば治療強化や血管内治療の適応を検討する。被曝と造影剤の反復投与を考慮し、若年者では超音波やMRAへの置換を検討してもよいが、頸部血管の評価精度はCTAが優る。","detp":["抗血小板療法で非手術管理する鈍的頸動脈損傷（ESVS Grade 1/2）患者には、1週時と3か月時のCTAサーベイランスを考慮すべきとされる。鈍的病変は受傷後早期から数か月のあいだにダイナミックに変化し、自然治癒は3〜12か月以内

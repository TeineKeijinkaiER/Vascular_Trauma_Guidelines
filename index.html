に生じる。1週時のCTAは病変の進行（偽動脈瘤の増大、狭窄の悪化、血栓の進展）を早期に捉えるため、3か月時は治癒の確認と抗血栓療法の継続期間を決める判断材料となる。","特に、3か月時点で病変が消失していれば抗血栓療法を終了できる可能性があり、逆に残存・増大していれば治療強化や血管内治療の適応を検討する。撮影は頸部から頭蓋内までを含め、前回との比較ができる同一プロトコルで行うことが望ましい。被曝と造影剤の反復投与を考慮し、若年者では超音波やMRAへの置換を検討してもよいが、頸部血管の評価精度はCTAが優る。フォローアップからの脱落が外傷患者では問題になりやすく、退院時に次回撮影の予約を組み、受診勧奨を文書で渡すことが実効性を高める。","特に3か月時点で病変が消失していれば抗血栓療法を終了できる可能性があり、逆に残存・増大していれば治療強化や血管内治療の適応を検討する。被曝と造影剤の反復投与を考慮し、若年者では超音波やMRAへの置換を検討してもよいが、頸部血管の評価精度はCTAが優る。"]},{"n":40,"ja":"未治療の鈍的胸部大動脈損傷(BTAI)患者では、低血容量性ショックまたは外傷性脳損傷の合併がない限り、収縮期血圧90–110 mmHgと心拍数<100/分の管理を推奨する","en":"Systolic blood pressure (90–110 mmHg) and heart rate (<100/minute) control are recommended for patients with untreated blunt thoracic aortic injury except in the presence of hypovolaemic shock or traumatic brain injury.","cls":"I","lvl":"C","sec":"胸部大動脈・胸部出口","page":22,"det":"未治療の鈍的胸部大動脈損傷（BTAI）では、低容量性ショックまたは外傷性脳損傷の合併がない限り、収縮期血圧90〜110 mmHg、心拍数100/分未満の管理が推奨される。BTAIの大多数は無症状で画像により診断され、破裂する症例のリスクは受傷後数時間が最も高い。1990年代のAAST多施設研究では、研究対象の一部が入院時に安定していながら数時間のうちに自由破裂へ進行したと報告されている。一方、厳密な血圧管理により破裂リスクは約2%まで低下する。\n\n血圧は通常90〜110 mmHgの範囲で管理し、低容量性ショックがある場合やTBIを合併する場合には調節する。心拍数は100/分未満とし、壁せん断応力を最小化して拡大・破裂の可能性を下げる。急性期の血圧・心拍管理で最もよく用いられる方法は、心血管モニタリング下での静脈内β遮断薬投与である。β遮断薬で心拍を十分に下げたうえで、必要に応じて血管拡張薬を追加する。TBI合併例では低血圧を避け、脳灌流を保つために薬剤で血圧を支えることがある点が重要であり、この相反する二要請のバランスが本推奨の例外規定の意味である。β遮断薬で心拍を十分に下げたうえで、必要に応じて血管拡張薬を追加する。目標値を上回る血圧は壁の張力を高め、下回りすぎれば冠・脳・腎の灌流が損なわれるため、動脈ラインでの持続モニタリングと看護・集中治療の体制が前提となる。","detp":["未治療の鈍的胸部大動脈損傷（BTAI）では、低容量性ショックまたは外傷性脳損傷の合併がない限り、収縮期血圧90〜110 mmHg、心拍数100/分未満の管理が推奨される。BTAIの大多数は無症状で画像により診断され、破裂する症例のリスクは受傷後数時間が最も高い。1990年代のAAST多施設研究では、研究対象の一部が入院時に安定していながら数時間のうちに自由破裂へ進行したと報告されている。","一方、厳密な血圧管理により破裂リスクは約2%まで低下する。血圧は通常90〜110 mmHgの範囲で管理し、低容量性ショックがある場合やTBIを合併する場合には調節する。心拍数は100/分未満とし、壁せん断応力を最小化して拡大・破裂の可能性を下げる。急性期の血圧・心拍管理で最もよく用いられる方法は、心血管モニタリング下での静脈内β遮断薬投与である。β遮断薬で心拍を十分に下げたうえで、必要に応じて血管拡張薬を追加する。","TBI合併例では低血圧を避け、脳灌流を保つために薬剤で血圧を支えることがある点が重要であり、この相反する二要請のバランスが本推奨の例外規定の意味である。β遮断薬で心拍を十分に下げたうえで、必要に応じて血管拡張薬を追加する。目標値を上回る血圧は壁の張力を高め、下回りすぎれば冠・脳・腎の灌流が損なわれるため、動脈ラインでの持続モニタリングと看護・集中治療の体制が前提となる。"]},{"n":41,"ja":"すべてのBTAI患者は、大動脈疾患を24時間365日治療できる多職種専門性を持つ外傷センターへ紹介することを推奨する","en":"Referral to a trauma centre with 24/7 multispecialty expertise to treat aortic pathology is recommended for all patients with blunt thoracic aortic injury.","cls":"I","lvl":"C","sec":"胸部大動脈・胸部出口","page":22,"det":"すべてのBTAI患者は、大動脈疾患を24時間365日治療できる多職種専門性を持つ外傷センターへ紹介することが推奨される。BTAIは来院前に最大80%が死亡する重篤損傷であり、生存して来院した症例でも破裂の危険が持続する。治療には、心臓血管外科・血管外科・IVR・麻酔科・集中治療の連携と、TEVARを行える設備・在庫（ステントグラフトのサイズ展開）、緊急で手術室を稼働できる体制が必要である。症例数と転帰の関係は大動脈疾患一般で示されており、センター化により転帰が改善することが知られている。\n\n実務では、①CT画像の遠隔転送による早期相談、②搬送中の血圧管理（β遮断薬の持続投与）の継続、③受け入れ側でのステントグラフト在庫とon-call体制の確認、が搬送を成功させる要点となる。損傷がGrade 1で保存的治療の候補であっても、判断と経過観察の枠組みを専門センターと共有しておくことが望ましい。小児例ではデバイスのサイズと成長への配慮から、さらに専門性の高い施設への集約が望まれる。実務では、CT画像の遠隔転送による早期相談、搬送中の血圧管理（β遮断薬の持続投与）の継続、受け入れ側でのステントグラフト在庫とon-call体制の確認が搬送を成功させる要点となる。Grade 1で保存的治療の候補であっても、判断と経過観察の枠組みを専門センターと共有しておくことが望ましい。","detp":["すべてのBTAI患者は、大動脈疾患を24時間365日治療できる多職種専門性を持つ外傷センターへ紹介することが推奨される。BTAIは来院前に最大80%が死亡する重篤損傷であり、生存して来院した症例でも破裂の危険が持続する。治療には、心臓血管外科・血管外科・IVR・麻酔科・集中治療の連携と、TEVARを行える設備・在庫（ステントグラフトのサイズ展開）、緊急で手術室を稼働できる体制が必要である。","症例数と転帰の関係は大動脈疾患一般で示されており、センター化により転帰が改善することが知られている。実務では、①CT画像の遠隔転送による早期相談、②搬送中の血圧管理（β遮断薬の持続投与）の継続、③受け入れ側でのステントグラフト在庫とon-call体制の確認、が搬送を成功させる要点となる。損傷がGrade 1で保存的治療の候補であっても、判断と経過観察の枠組みを専門センターと共有しておくことが望ましい。","小児例ではデバイスのサイズと成長への配慮から、さらに専門性の高い施設への集約が望まれる。実務では、CT画像の遠隔転送による早期相談、搬送中の血圧管理（β遮断薬の持続投与）の継続、受け入れ側でのステントグラフト在庫とon-call体制の確認が搬送を成功させる要点となる。Grade 1で保存的治療の候補であっても、判断と経過観察の枠組みを専門センターと共有しておくことが望ましい。"]},{"n":42,"ja":"BTAIの否定のための画像検査として胸部X線は推奨しない","en":"Chest Xray is not recommended as an imaging technique to exclude blunt thoracic aortic injury.","cls":"IIIb","lvl":"C","sec":"胸部大動脈・胸部出口","page":22,"det":"BTAIの否定のための画像検査として胸部X線は推奨されない。胸部単純X線はスクリーニング検査としては不良で、大動脈損傷のかなりの症例で縦隔に異常所見を呈さない。正常な胸部X線はBTAIを否定できず、逆に縦隔の異常は外傷以外の要因（撮影体位、既存疾患、皮下気腫）でも生じる。広く知られる「縦隔拡大」などの所見は感度・特異度ともにスクリーニングに耐えるものではない。\n\nしたがって、鈍的巨大外力（高所からの墜落、車両衝突、胸部圧迫）や骨盤・胸部の重篤損傷を伴う症例では、胸部X線の結果にかかわらず造影CTAを検討する。実務の流れとしては、初療の外傷室で胸部X線やFASTを行うことはあるが、それは気胸・血胸・心嚢液などの併存損傷の評価としてであり、BTAIのrule outを目的とはしない。この推奨は「単純X線が正常だから造影は不要」という判断を明確に否定しており、見逃しによる破裂（致死的）を避けることを優先している。なお、腎機能障害を理由にCTAをためらう必要がないことは推奨11で示されている。実務の流れとしては、初療で胸部X線やFASTを行うことはあるが、それは気胸・血胸・心嚢液などの併存損傷の評価としてであり、BTAIの除外を目的とはしない。高所からの墜落や車両衝突など大きな減速を伴う機転では、X線の結果にかかわらず造影CTAを検討する。","detp":["BTAIの否定のための画像検査として胸部X線は推奨されない。胸部単純X線はスクリーニング検査としては不良で、大動脈損傷のかなりの症例で縦隔に異常所見を呈さない。正常な胸部X線はBTAIを否定できず、逆に縦隔の異常は外傷以外の要因（撮影体位、既存疾患、皮下気腫）でも生じる。広く知られる「縦隔拡大」などの所見は感度・特異度ともにスクリーニングに耐えるものではない。したがって、鈍的巨大外力（高所からの墜落、車両衝突、胸部圧迫）や骨盤・胸部の重篤損傷を伴う症例では、胸部X線の結果にかかわらず造影CTAを検討する。","実務の流れとしては、初療の外傷室で胸部X線やFASTを行うことはあるが、それは気胸・血胸・心嚢液などの併存損傷の評価としてであり、BTAIのrule outを目的とはしない。この推奨は「単純X線が正常だから造影は不要」という判断を明確に否定しており、見逃しによる破裂（致死的）を避けることを優先している。なお、腎機能障害を理由にCTAをためらう必要がないことは推奨11で示されている。","実務の流れとしては、初療で胸部X線やFASTを行うことはあるが、それは気胸・血胸・心嚢液などの併存損傷の評価としてであり、BTAIの除外を目的とはしない。高所からの墜落や車両衝突など大きな減速を伴う機転では、X線の結果にかかわらず造影CTAを検討する。"]},{"n":43,"ja":"BTAIの診断と性状評価には大動脈CTAを推奨する","en":"Computed tomography angiography of the aorta is recommended for the diagnosis and characterisation of blunt thoracic aortic injury.","cls":"I","lvl":"B","sec":"胸部大動脈・胸部出口","page":23,"det":"BTAIの診断と性状評価には大動脈CTAが推奨される。胸部CTAは現在、すべての外傷センターでBTAIの主要な診断ツールである。3D再構成を伴うmultislice CTAは感受性・特異性ともにほぼ100%、陽性適中率99%、陰性適中率99.7%、全体の診断精度99.4%と報告されている。さらに、3D再構成により損傷重症度の同定と、血管内治療の計画・アクセス評価が同時に可能となる。\n\n撮影では、動脈相を主体とし、必要に応じて遅延相を追加する。評価の焦点は、内膜損傷・壁内血腫の有無、外壁輪郭の異常（偽動脈瘤、輪郭不整）、造影剤の血管外漏出、大動脈の全周性評価、損傷の長さと中大動脈からの距離（landing zoneの確保）、左鎖骨下動脈起始部との関係、アクセス血管（腸骨・大腿動脈）の径と性状である。これらはESVSグレードの判定と、保存的治療・遅延TEVAR・緊急TEVAR・open repairの選択に直結する。金属や弾丸によるアーチファクトがある場合は再構成で対応し、判読困難な場合はDSAを補完する。撮影では動脈相を主体とし、必要に応じて遅延相を追加する。評価の焦点は、内膜損傷・壁内血腫の有無、外壁輪郭の異常、造影剤の血管外漏出、損傷の長さとlanding zoneの確保、左鎖骨下動脈起始部との関係、アクセス血管（腸骨・大腿動脈）の径と性状であり、これらがESVSグレードの判定と治療選択に直結する。","detp":["BTAIの診断と性状評価には大動脈CTAが推奨される。胸部CTAは現在、すべての外傷センターでBTAIの主要な診断ツールである。3D再構成を伴うmultislice CTAは感受性・特異性ともにほぼ100%、陽性適中率99%、陰性適中率99.7%、全体の診断精度99.4%と報告されている。さらに、3D再構成により損傷重症度の同定と、血管内治療の計画・アクセス評価が同時に可能となる。","撮影では、動脈相を主体とし、必要に応じて遅延相を追加する。評価の焦点は、内膜損傷・壁内血腫の有無、外壁輪郭の異常（偽動脈瘤、輪郭不整）、造影剤の血管外漏出、大動脈の全周性評価、損傷の長さと中大動脈からの距離（landing zoneの確保）、左鎖骨下動脈起始部との関係、アクセス血管（腸骨・大腿動脈）の径と性状である。これらはESVSグレードの判定と、保存的治療・遅延TEVAR・緊急TEVAR・open repairの選択に直結する。","金属や弾丸によるアーチファクトがある場合は再構成で対応し、判読困難な場合はDSAを補完する。撮影では動脈相を主体とし、必要に応じて遅延相を追加する。評価の焦点は、内膜損傷・壁内血腫の有無、外壁輪郭の異常、造影剤の血管外漏出、損傷の長さとlanding zoneの確保、左鎖骨下動脈起始部との関係、アクセス血管（腸骨・大腿動脈）の径と性状であり、これらがESVSグレードの判定と治療選択に直結する。"]},{"n":44,"ja":"重度外傷性脳損傷の合併がないESVS Grade 1 BTAI患者には、血圧管理とフォローアップ画像による非手術管理を推奨する","en":"Non-operative management with blood pressure control and follow up imaging is recommended in patients with ESVS Grade 1 blunt thoracic aortic injury without concomitant severe traumatic brain injury.","cls":"I","lvl":"C","sec":"胸部大動脈・胸部出口","page":23,"det":"重度の外傷性脳損傷を合併しないESVS Grade 1 BTAIは、血圧管理とフォローアップ画像による非手術管理が推奨される。Grade 1は内膜損傷および/または壁内血腫で、外壁輪郭の異常を伴わないものを指す。これらの損傷は、血圧管理と観察、そして大動脈病変の消退までの定期的なCTAフォローアップで管理できることが文献で支持されている。入院後48〜72時間以内にCTAを再検して病変の安定性を評価することが適切とされる。\n\n血圧管理の実際は、β遮断薬を中心とした心拍・血圧の制御で、Fabianらの前向き小規模seriesではβ遮断薬とニトロプルシドナトリウムによる血圧管理が院内破裂を防止したと報告され、現在ではBTAI管理の標準的要素となっている。SVSガイドラインでは心拍数60/分未満、収縮期血圧約110〜120 mmHgが提案されている。また、Grade 1でも外壁輪郭の変化が出現する例があるため、初期の厳密な観察と再画像評価を省かない。TBI合併例で低血圧を避ける必要がある場合（推奨45）とは管理目標が異なる点に注意し、患者ごとに標的血圧を明示して申し送る。血圧管理の実際は、β遮断薬を中心とした心拍・血圧の制御である。Grade 1でも外壁輪郭の変化が出現する例があるため、初期の厳密な観察と再画像評価を省かない。TBI合併例で低血圧を避ける必要がある場合は管理目標が異なるため、患者ごとに標的血圧を明示して申し送る。","detp":["重度の外傷性脳損傷を合併しないESVS Grade 1 BTAIは、血圧管理とフォローアップ画像による非手術管理が推奨される。Grade 1は内膜損傷および/または壁内血腫で、外壁輪郭の異常を伴わないものを指す。これらの損傷は、血圧管理と観察、そして大動脈病変の消退までの定期的なCTAフォローアップで管理できることが文献で支持されている。入院後48〜72時間以内にCTAを再検して病変の安定性を評価することが適切とされる。","血圧管理の実際は、β遮断薬を中心とした心拍・血圧の制御で、Fabianらの前向き小規模seriesではβ遮断薬とニトロプルシドナトリウムによる血圧管理が院内破裂を防止したと報告され、現在ではBTAI管理の標準的要素となっている。SVSガイドラインでは心拍数60/分未満、収縮期血圧約110〜120 mmHgが提案されている。また、Grade 1でも外壁輪郭の変化が出現する例があるため、初期の厳密な観察と再画像評価を省かない。","TBI合併例で低血圧を避ける必要がある場合（推奨45）とは管理目標が異なる点に注意し、患者ごとに標的血圧を明示して申し送る。血圧管理の実際は、β遮断薬を中心とした心拍・血圧の制御である。Grade 1でも外壁輪郭の変化が出現する例があるため、初期の厳密な観察と再画像評価を省かない。TBI合併例で低血圧を避ける必要がある場合は管理目標が異なるため、患者ごとに標的血圧を明示して申し送る。"]},{"n":45,"ja":"血圧管理が不可能な重度外傷性脳損傷を合併するGrade 1 BTAI患者には、血管内ステントグラフト修復を考慮してもよい","en":"Endovascular stent graft repair may be considered in patients with ESVS Grade 1 blunt thoracic aortic injury and concomitant severe traumatic brain injury when blood pressure control is not feasible.","cls":"IIb","lvl":"C","sec":"胸部大動脈・胸部出口","page":23,"det":"血圧管理が不可能な重度外傷性脳損傷を合併するESVS Grade 1 BTAI患者には、血管内ステントグラフト修復を考慮してもよい。BTAIの基本管理は血圧と心拍の制御であるが、重症TBIを合併する場合は事情が異なる。頭蓋内灌流を維持するために血圧を下げられず、場合によっては薬剤で血圧を支える必要があり、その結果として大動脈病変に持続的な壁せん断応力がかかり、破裂リスクが上昇する。この二律背反を解消する手段が、早期のTEVARによる解剖学的な破綻の被覆である。\n\nTEVARは低侵襲で、抗凝固や体外循環を必要とせず、TBI患者でも早期離床・リハビリテーションへの移行がしやすい。ただし、術中の全身ヘパリン化（推奨49）と抗血小板療法が頭蓋内出血を悪化させるリスクを評価する必要があり、神経外科・集中治療と合同で判断する。デバイスのサイズは若年者では大動脈径が小さく、オーバーサイジングによりcollapseを招かないよう注意する。この推奨は「Grade 1だから全例保存的」という単純化を避け、TBIという併存病態が血圧管理の自由度を奪う場合に限って介入を前倒しする、という条件付きの判断を示している。","detp":["血圧管理が不可能な重度外傷性脳損傷を合併するESVS Grade 1 BTAI患者には、血管内ステントグラフト修復を考慮してもよい。BTAIの基本管理は血圧と心拍の制御であるが、重症TBIを合併する場合は事情が異なる。頭蓋内灌流を維持するために血圧を下げられず、場合によっては薬剤で血圧を支える必要があり、その結果として大動脈病変に持続的な壁せん断応力がかかり、破裂リスクが上昇する。","この二律背反を解消する手段が、早期のTEVARによる解剖学的な破綻の被覆である。TEVARは低侵襲で、抗凝固や体外循環を必要とせず、TBI患者でも早期離床・リハビリテーションへの移行がしやすい。ただし、術中の全身ヘパリン化（推奨49）と抗血小板療法が頭蓋内出血を悪化させるリスクを評価する必要があり、神経外科・集中治療と合同で判断する。デバイスのサイズは若年者では大動脈径が小さく、オーバーサイジングによりcollapseを招かないよう注意する。","この推奨は「Grade 1だから全例保存的」という単純化を避け、TBIという併存病態が血圧管理の自由度を奪う場合に限って介入を前倒しする、という条件付きの判断を示している。"]},{"n":46,"ja":"高リスク損傷特徴のない、外壁輪郭異常(Grade 2)を伴うBTAIには、遅延(>24時間)ステントグラフト修復を考慮すべき","en":"Delayed (>24 hour) endovascular stent graft repair should be considered for patients with blunt thoracic aortic injury and any external wall contour abnormality (ESVS Grade 2) if there are no high risk injury features. *","cls":"IIa","lvl":"C","sec":"胸部大動脈・胸部出口","page":24,"det":"高リスク損傷特徴のない、外壁輪郭異常（ESVS Grade 2）を伴うBTAIには、遅延（24時間超）の血管内ステントグラフト修復を考慮すべきとされる。Grade 2は外壁輪郭の異常（偽動脈瘤、輪郭不整、限局性の突出）を伴う完全壁損傷で、contained ruptureの状態にある。修復の至適時期は、他の重篤損傷、患者の生理状態、大動脈損傷のグレードによって個別化される。他部位の致死的損傷（重症TBI、実質臓器出血、骨盤骨折など）が併存する場合、まずそれらを安定化させ、24時間以降に待機的にTEVARを行うほうが、同時に複数の手術侵襲を重ねるより転帰がよいと考えられている。\n\n遅延させることで、凝固障害・アシドーシス・低体温の是正、出血の制御、頭蓋内病変の評価が可能となり、TEVARのリスクが下がる。一方で待機中に破裂する危険は残るため、厳密な血圧・心拍管理（推奨40）と、集中治療での反復評価が前提となる。この判断には「高リスク特徴がないこと」の確認が必須であり、表10に示される高リスク特徴（大きな縦隔血腫、左血胸、大動脈coarctation様変形、大きな偽動脈瘤、収縮期血圧90 mmHg未満、TBI）のいずれかを認める場合は緊急治療（推奨47）へ方針を切り替える。","detp":["高リスク損傷特徴のない、外壁輪郭異常（ESVS Grade 2）を伴うBTAIには、遅延（24時間超）の血管内ステントグラフト修復を考慮すべきとされる。Grade 2は外壁輪郭の異常（偽動脈瘤、輪郭不整、限局性の突出）を伴う完全壁損傷で、contained ruptureの状態にある。修復の至適時期は、他の重篤損傷、患者の生理状態、大動脈損傷のグレードによって個別化される。他部位の致死的損傷（重症TBI、実質臓器出血、骨盤骨折など）が併存する場合、まずそれらを安定化させ、24時間以降に待機的にTEVARを行うほうが、同時に複数の手術侵襲を重ねるより転帰がよいと考えられている。","遅延させることで、凝固障害・アシドーシス・低体温の是正、出血の制御、頭蓋内病変の評価が可能となり、TEVARのリスクが下がる。一方で待機中に破裂する危険は残るため、厳密な血圧・心拍管理（推奨40）と、集中治療での反復評価が前提となる。この判断には「高リスク特徴がないこと」の確認が必須であり、表10に示される高リスク特徴（大きな縦隔血腫、左血胸、大動脈coarctation様変形、大きな偽動脈瘤、収縮期血圧90 mmHg未満、TBI）のいずれかを認める場合は緊急治療（推奨47）へ方針を切り替える。"]},{"n":47,"ja":"高リスク大動脈特徴を伴う外郭輪郭異常(Grade 2)のBTAIには、緊急(<24時間)血管内ステントグラフト修復を推奨する","en":"Urgent ( <24 hour) endovascular stent graft repair is recommended for patients with blunt thoracic aortic injury and any external contour abnormality (ESVS Grade 2) with high risk aortic features. *","cls":"I","lvl":"C","sec":"胸部大動脈・胸部出口","page":25,"det":"高リスク大動脈特徴を伴う外壁輪郭異常（ESVS Grade 2）のBTAIには、緊急（24時間以内）の血管内ステントグラフト修復が推奨される。表10に示される高リスク特徴は、大きな縦隔血腫、左血胸、大動脈coarctation（狭窄様変形）、大きな偽動脈瘤、収縮期血圧90 mmHg未満、外傷性脳損傷であり、これらを伴うGrade 2は破裂の危険が高く、保存的観察に委ねる余裕はない。緊急TEVARは、破裂を予防しつつ低侵襲に解剖学的破綻を被覆する。\n\n実務では、来院から修復までの時間を短縮するために、①大動脈専門センターへの同時連絡、②手術室とデバイスの準備、③アクセス血管の評価（腸骨・大腿動脈の径と性状）を並行して進める。低血圧が持続している症例では、蘇生と同時にTEVARの準備を行い、血圧が戻り次第（あるいは蘇生に反応しない場合は緊急で）修復に踏み切る。複数の重篤損傷が併存する場合は、損傷の致死的順位（出血＞大動脈＞整形・脳）を多職種で合意して手術順序を決める。24時間という数値は目安であり、血圧管理が破綻する症例や血腫が増大する症例では、より早期の介入が必要となる。実務では、来院から修復までの時間を短縮するため、大動脈専門センターへの同時連絡、手術室とデバイスの準備、アクセス血管の評価を並行して進める。複数の重篤損傷が併存する場合は、損傷の致死的順位（出血、大動脈、整形・脳）を多職種で合意して手術順序を決める。","detp":["高リスク大動脈特徴を伴う外壁輪郭異常（ESVS Grade 2）のBTAIには、緊急（24時間以内）の血管内ステントグラフト修復が推奨される。表10に示される高リスク特徴は、大きな縦隔血腫、左血胸、大動脈coarctation（狭窄様変形）、大きな偽動脈瘤、収縮期血圧90 mmHg未満、外傷性脳損傷であり、これらを伴うGrade 2は破裂の危険が高く、保存的観察に委ねる余裕はない。","緊急TEVARは、破裂を予防しつつ低侵襲に解剖学的破綻を被覆する。実務では、来院から修復までの時間を短縮するために、①大動脈専門センターへの同時連絡、②手術室とデバイスの準備、③アクセス血管の評価（腸骨・大腿動脈の径と性状）を並行して進める。低血圧が持続している症例では、蘇生と同時にTEVARの準備を行い、血圧が戻り次第（あるいは蘇生に反応しない場合は緊急で）修復に踏み切る。複数の重篤損傷が併存する場合は、損傷の致死的順位（出血＞大動脈＞整形・脳）を多職種で合意して手術順序を決める。","24時間という数値は目安であり、血圧管理が破綻する症例や血腫が増大する症例では、より早期の介入が必要となる。実務では、来院から修復までの時間を短縮するため、大動脈専門センターへの同時連絡、手術室とデバイスの準備、アクセス血管の評価を並行して進める。複数の重篤損傷が併存する場合は、損傷の致死的順位（出血、大動脈、整形・脳）を多職種で合意して手術順序を決める。"]},{"n":48,"ja":"造影剤血管外漏出(Grade 3)を伴うBTAIには、即時の手術修復を推奨する","en":"Immediate operative repair is recommended for patients with blunt thoracic aortic injury with active extravasation (ESVS Grade 3).","cls":"I","lvl":"C","sec":"胸部大動脈・胸部出口","page":25,"det":"造影剤血管外漏出（ESVS Grade 3）を伴うBTAIには、即時の手術修復（実質的には緊急TEVAR）が推奨される。Grade 3は自由破裂（uncontained haemorrhage）に相当し、胸腔内への活動性出血を意味する。血行動態は急速に破綻し、致死的であるため、保存的治療の適応はない。TEVARを第一選択として直ちに準備し、循環の安定化と並行して進める。\n\n実務の要点は、①迅速な気道確保と両側胸腔ドレーンの準備（大量血胸への対応）、②大量輸血プロトコルの起動、③血圧を下げすぎない蘇生（脳・冠灌流の維持）と過度の昇圧を避けるバランス、④血管造影室またはハイブリッド手術室への直接搬入である。血行動態が破綻して画像室への搬送が危険な場合は、open repair（緊急開胸、大動脈のclamp/partial bypass）を選択する。開胸修復では対麻痺リスクを下げるため活動的遠位大動脈灌流（推奨55）を用いる。Grade 3はまれであるがゆえに手順が標準化されにくく、シミュレーションとチーム訓練で対応力を維持することが望ましい。実務の要点は、迅速な気道確保と胸腔ドレーンの準備、大量輸血プロトコルの起動、脳・冠灌流を保つ蘇生と過度の昇圧を避けるバランス、血管造影室またはハイブリッド手術室への直接搬入である。血行動態が破綻して画像室への搬送が危険な場合は、open repair（緊急開胸、大動脈遮断）を選択する。","detp":["造影剤血管外漏出（ESVS Grade 3）を伴うBTAIには、即時の手術修復（実質的には緊急TEVAR）が推奨される。Grade 3は自由破裂（uncontained haemorrhage）に相当し、胸腔内への活動性出血を意味する。血行動態は急速に破綻し、致死的であるため、保存的治療の適応はない。TEVARを第一選択として直ちに準備し、循環の安定化と並行して進める。実務の要点は、①迅速な気道確保と両側胸腔ドレーンの準備（大量血胸への対応）、②大量輸血プロトコルの起動、③血圧を下げすぎない蘇生（脳・冠灌流の維持）と過度の昇圧を避けるバランス、④血管造影室またはハイブリッド手術室への直接搬入である。","血行動態が破綻して画像室への搬送が危険な場合は、open repair（緊急開胸、大動脈のclamp/partial bypass）を選択する。開胸修復では対麻痺リスクを下げるため活動的遠位大動脈灌流（推奨55）を用いる。Grade 3はまれであるがゆえに手順が標準化されにくく、シミュレーションとチーム訓練で対応力を維持することが望ましい。実務の要点は、迅速な気道確保と胸腔ドレーンの準備、大量輸血プロトコルの起動、脳・冠灌流を保つ蘇生と過度の昇圧を避けるバランス、血管造影室またはハイブリッド手術室への直接搬入である。","血行動態が破綻して画像室への搬送が危険な場合は、open repair（緊急開胸、大動脈遮断）を選択する。"]},{"n":49,"ja":"胸部大動脈ステントグラフト修復時の術中全身ヘパリン化は、出血リスク・血栓塞栓合併症・TBI重症度を踏まえ個別に考慮すべき","en":"Intra-operative systemic heparinisation for thoracic aortic stent graft repair should be considered individualised, including the perceived risks of bleeding, thromboembolic complications, and severity of traumatic brain injury.","cls":"IIa","lvl":"C","sec":"胸部大動脈・胸部出口","page":25,"det":"胸部大動脈ステントグラフト修復時の術中全身ヘパリン化は、出血リスク、血栓塞栓合併症、外傷性脳損傷の重症度を踏まえて個別に考慮すべきとされる。TEVARはカテーテル操作に伴う血栓・塞栓のリスクがあり、通常の大動脈ステントグラフト治療では全身ヘパリン化が標準である。しかし外傷患者では、頭蓋内出血、実質臓器損傷、広範な軟部組織損傷、凝固障害が併存することが多く、ヘパリン化が致死的な出血を招きうる。\n\nTEVARはopen repairと比べて転帰が良好であるが、エンドリーク、アクセス血管合併症、左鎖骨下動脈・左総頸動脈の閉塞、デバイスのcollapseといったデバイス関連合併症がある。ヘパリン化の判断では、こうした周術期血栓塞栓合併症のリスクと、臓器出血・TBI悪化のリスクを天秤にかける。実務的な選択肢としては、①通常量の全身ヘパリン化、②低用量（ACT目標を下げる）、③ヘパリン不使用での迅速なdeployment、があり、後二者はTBI合併例や活動性出血例で選ばれることがある。デバイスのdry time短縮、アクセス部位の確実な止血（可能ならpreclose）、術後の抗血小板療法の開始時期とあわせて、症例ごとに方針を術前に明文化しておく。","detp":["胸部大動脈ステントグラフト修復時の術中全身ヘパリン化は、出血リスク、血栓塞栓合併症、外傷性脳損傷の重症度を踏まえて個別に考慮すべきとされる。TEVARはカテーテル操作に伴う血栓・塞栓のリスクがあり、通常の大動脈ステントグラフト治療では全身ヘパリン化が標準である。しかし外傷患者では、頭蓋内出血、実質臓器損傷、広範な軟部組織損傷、凝固障害が併存することが多く、ヘパリン化が致死的な出血を招きうる。","TEVARはopen repairと比べて転帰が良好であるが、エンドリーク、アクセス血管合併症、左鎖骨下動脈・左総頸動脈の閉塞、デバイスのcollapseといったデバイス関連合併症がある。ヘパリン化の判断では、こうした周術期血栓塞栓合併症のリスクと、臓器出血・TBI悪化のリスクを天秤にかける。実務的な選択肢としては、①通常量の全身ヘパリン化、②低用量（ACT目標を下げる）、③ヘパリン不使用での迅速なdeployment、があり、後二者はTBI合併例や活動性出血例で選ばれることがある。","デバイスのdry time短縮、アクセス部位の確実な止血（可能ならpreclose）、術後の抗血小板療法の開始時期とあわせて、症例ごとに方針を術前に明文化しておく。"]},{"n":50,"ja":"緊急血管内治療を受けるBTAI患者では、初回CTA時の低血容量状態に応じ20–30%のステントグラフトオーバーサイジングを考慮すべき","en":"Stent graft oversizing between 20% and 30%, depending on the hypovolaemic status during index computed tomography angiography, should be considered for patients with blunt thoracic aortic injury undergoing emergency endovascular treatment.","cls":"IIa","lvl":"C","sec":"胸部大動脈・胸部出口","page":26,"det":"緊急血管内治療を受けるBTAI患者では、初回CTA時の低容量状態に応じて20〜30%のステントグラフトオーバーサイジングを考慮すべきとされる。TEVAR後のエンドリークは約20%に観察され、適切なサイズ選択はtype Iエンドリークやステントcollapseといった合併症を避けるうえで本質的である。通常、最適なdeploymentにはデバイスを10〜20%オーバーサイズするが、低容量（hypovolaemia）の患者では最大30%までのオーバーサイジングを考慮してよい。\n\n理由は、外傷急性期の撮影は低血圧・低容量の状態で行われており、大動脈径が実際より小さく計測されるためである。のちに容量が戻ると大動脈径が拡大し、相対的にデバイスが小さくなってエンドリークやmigrationを生じる。逆に過度のオーバーサイジングはデバイスのcollapseを招き、致死的となりうる。大動脈弓の高度の屈曲は、とくに内弯側でステントグラフトと大動脈壁のapposition不良を生じやすく、近年は若年者の胸部大動脈に適したcurved shapeのデバイスが利用できる。血管内超音波（IVUS）のエビデンスは限られ、正常容量に戻った時点での再CTAが計画の代替となりうる。","detp":["緊急血管内治療を受けるBTAI患者では、初回CTA時の低容量状態に応じて20〜30%のステントグラフトオーバーサイジングを考慮すべきとされる。TEVAR後のエンドリークは約20%に観察され、適切なサイズ選択はtype Iエンドリークやステントcollapseといった合併症を避けるうえで本質的である。通常、最適なdeploymentにはデバイスを10〜20%オーバーサイズするが、低容量（hypovolaemia）の患者では最大30%までのオーバーサイジングを考慮してよい。","理由は、外傷急性期の撮影は低血圧・低容量の状態で行われており、大動脈径が実際より小さく計測されるためである。のちに容量が戻ると大動脈径が拡大し、相対的にデバイスが小さくなってエンドリークやmigrationを生じる。逆に過度のオーバーサイジングはデバイスのcollapseを招き、致死的となりうる。大動脈弓の高度の屈曲は、とくに内弯側でステントグラフトと大動脈壁のapposition不良を生じやすく、近年は若年者の胸部大動脈に適したcurved shapeのデバイスが利用できる。","血管内超音波（IVUS）のエビデンスは限られ、正常容量に戻った時点での再CTAが計画の代替となりうる。"]},{"n":51,"ja":"左鎖骨下動脈を被覆するステントグラフト修復を要するBTAI患者で、ルーチンの左鎖骨下動脈血行再建は適応ではない","en":"Routine left subclavian artery revascularisation is not indicated for patients with blunt thoracic aortic injury requiring endovascular stent graft repair with coverage of the left subclavian artery.","cls":"IIIa","lvl":"C","sec":"胸部大動脈・胸部出口","page":26,"det":"左鎖骨下動脈を被覆するステントグラフト修復を要するBTAI患者において、ルーチンの左鎖骨下動脈血行再建は適応ではない。中枢側のlanding zoneを確保するため、あるいは大動脈弓の小弯側とのappositionを改善するために左鎖骨下動脈（LSA）の被覆が必要になることは多いが、被覆自体が上肢虚血を生じることは多くなく、全例に予防的血行再建を行う利益は示されていない。LSAの血行再建には、頸部の手術（carotid-subclavian bypass、subclavian transposition）やステント留置が必要で、反回神経麻痺、胸管損傷、脳神経合併症、追加の手術時間といったリスクを伴う。\n\nしたがって、routineの再建は行わず、症状出現例やリスクの高い解剖で選択的に行う。判断に必要なのは、①右椎骨動脈の起始と優位性（右椎骨動脈がLSA由来の場合はリスクが高い）、②両側椎骨動脈の開存状況、③後交通動脈を介した脳灌流、④左内胸動脈を介した冠灌流（CABG既往例）、⑤左上肢の機能的要求である。これらを術前CTAで評価し、リスクが高いと判断される場合に推奨52の血行再建を行う。術後は左上肢の血圧・脈拍・症状と、椎骨脳底動脈領域の症状（めまい、複視）を観察する。","detp":["左鎖骨下動脈を被覆するステントグラフト修復を要するBTAI患者において、ルーチンの左鎖骨下動脈血行再建は適応ではない。中枢側のlanding zoneを確保するため、あるいは大動脈弓の小弯側とのappositionを改善するために左鎖骨下動脈（LSA）の被覆が必要になることは多いが、被覆自体が上肢虚血を生じることは多くなく、全例に予防的血行再建を行う利益は示されていない。LSAの血行再建には、頸部の手術（carotid-subclavian bypass、subclavian transposition）やステント留置が必要で、反回神経麻痺、胸管損傷、脳神経合併症、追加の手術時間といったリスクを伴う。","したがって、routineの再建は行わず、症状出現例やリスクの高い解剖で選択的に行う。判断に必要なのは、①右椎骨動脈の起始と優位性（右椎骨動脈がLSA由来の場合はリスクが高い）、②両側椎骨動脈の開存状況、③後交通動脈を介した脳灌流、④左内胸動脈を介した冠灌流（CABG既往例）、⑤左上肢の機能的要求である。これらを術前CTAで評価し、リスクが高いと判断される場合に推奨52の血行再建を行う。","術後は左上肢の血圧・脈拍・症状と、椎骨脳底動脈領域の症状（めまい、複視）を観察する。"]},{"n":52,"ja":"左鎖骨下動脈被覆により脳・心・脊髄灌流障害のリスクがあるBTAI患者では、選択例に左鎖骨下動脈血行再建を推奨する","en":"Left subclavian artery revascularisation is recommended for selected patients with blunt thoracic aortic injury requiring endovascular stent graft repair with coverage of the left subclavian artery and risk of compromised perfusion to brain, heart, or spinal cord.","cls":"I","lvl":"C","sec":"胸部大動脈・胸部出口","page":26,"det":"左鎖骨下動脈被覆により脳・心・脊髄の灌流障害のリスクがあるBTAI患者では、選択例において左鎖骨下動脈血行再建が推奨される。具体的には、右椎骨動脈が左鎖骨下動脈由来である、左椎骨動脈が優位で後交通動脈が低形成、左内胸動脈を介した冠灌流に依存している（CABG既往）、あるいは両側椎骨動脈のいずれかが閉塞・低形成といった解剖が該当する。こうした症例ではLSAの急性閉塞が、椎骨脳底動脈虚血、脊髄虚血（前脊髄動脈は椎骨動脈由来の分枝に依存）、心虚血を招きうる。\n\n手技は、緊急時には血管内（LSA起始部へのステント、あるいはchimney/snorkel法）が迅速で、待機的または解剖的に複雑な場合はcarotid-subclavian bypassやsubclavian transpositionが選択される。再建のタイミングはTEVARと同時（concurrent）か段階的（staged）かで議論があるが、緊急TEVARを要する症例では同時に行う余裕がないことも多く、その場合はまず大動脈の破裂防止を優先し、灌流障害の徴候を観察して遅延再建（推奨53）に回す判断も許容される。術前にこの評価をCTAで済ませ、方針をチームで共有しておくことが肝要である。","detp":["左鎖骨下動脈被覆により脳・心・脊髄の灌流障害のリスクがあるBTAI患者では、選択例において左鎖骨下動脈血行再建が推奨される。具体的には、右椎骨動脈が左鎖骨下動脈由来である、左椎骨動脈が優位で後交通動脈が低形成、左内胸動脈を介した冠灌流に依存している（CABG既往）、あるいは両側椎骨動脈のいずれかが閉塞・低形成といった解剖が該当する。こうした症例ではLSAの急性閉塞が、椎骨脳底動脈虚血、脊髄虚血（前脊髄動脈は椎骨動脈由来の分枝に依存）、心虚血を招きうる。","手技は、緊急時には血管内（LSA起始部へのステント、あるいはchimney/snorkel法）が迅速で、待機的または解剖的に複雑な場合はcarotid-subclavian bypassやsubclavian transpositionが選択される。再建のタイミングはTEVARと同時（concurrent）か段階的（staged）かで議論があるが、緊急TEVARを要する症例では同時に行う余裕がないことも多く、その場合はまず大動脈の破裂防止を優先し、灌流障害の徴候を観察して遅延再建（推奨53）に回す判断も許容される。","術前にこの評価をCTAで済ませ、方針をチームで共有しておくことが肝要である。"]},{"n":53,"ja":"左鎖骨下動脈被覆後に虚血症状を発症したBTAI患者では、選択例に遅延的左鎖骨下動脈血行再建を考慮すべき","en":"Delayed left subclavian artery revascularisation should be considered for selected patients with blunt thoracic aortic injury requiring endovascular stent graft repair who develop ischaemic symptoms with coverage of the left subclavian artery.","cls":"IIa","lvl":"C","sec":"胸部大動脈・胸部出口","page":26,"det":"左鎖骨下動脈被覆後に虚血症状を発症したBTAI患者では、選択例に遅延的左鎖骨下動脈血行再建を考慮すべきとされる。TEVARではまず大動脈の破裂を防ぐことが最優先であり、LSA被覆後の血行再建を同時に行う余裕がない状況は多い。被覆後に上肢の急性虚血（蒼白、疼痛、運動障害）、椎骨脳底動脈領域の症状（めまい、複視、構音障害、小脳失調）、脊髄虚血（対麻痺）が出現した場合には、血行再建の適応を改めて検討する。\n\nタイミングは、大動脈修復後の全身状態が安定し、出血リスクが低下した時点が適切であり、数日から数週間の遅延が許容される。上肢虚血が軽度で側副血行が十分な症例では自然軽快もあり、全例に介入する必要はない。一方、対麻痺や脳症状は緊急対応を要し、脊髄灌流の評価（血圧管理、脳脊髄液ドレナージの要否）と並行して血行再建を急ぐ。実務では、被覆を行った時点で「術後に上肢血圧・脈拍・神経所見を定時評価する」と申し送り、症状出現時に速やかに血管外科・IVRへ相談できる経路を確保しておくことが、この推奨を機能させる鍵となる。タイミングは、大動脈修復後の全身状態が安定し出血リスクが低下した時点が適切であり、数日から数週間の遅延が許容される。上肢虚血が軽度で側副血行が十分な症例では自然軽快もあり、全例に介入する必要はない。一方、対麻痺や脳症状は緊急対応を要する。","detp":["左鎖骨下動脈被覆後に虚血症状を発症したBTAI患者では、選択例に遅延的左鎖骨下動脈血行再建を考慮すべきとされる。TEVARではまず大動脈の破裂を防ぐことが最優先であり、LSA被覆後の血行再建を同時に行う余裕がない状況は多い。被覆後に上肢の急性虚血（蒼白、疼痛、運動障害）、椎骨脳底動脈領域の症状（めまい、複視、構音障害、小脳失調）、脊髄虚血（対麻痺）が出現した場合には、血行再建の適応を改めて検討する。","タイミングは、大動脈修復後の全身状態が安定し、出血リスクが低下した時点が適切であり、数日から数週間の遅延が許容される。上肢虚血が軽度で側副血行が十分な症例では自然軽快もあり、全例に介入する必要はない。一方、対麻痺や脳症状は緊急対応を要し、脊髄灌流の評価（血圧管理、脳脊髄液ドレナージの要否）と並行して血行再建を急ぐ。実務では、被覆を行った時点で「術後に上肢血圧・脈拍・神経所見を定時評価する」と申し送り、症状出現時に速やかに血管外科・IVRへ相談できる経路を確保しておくことが、この推奨を機能させる鍵となる。","タイミングは、大動脈修復後の全身状態が安定し出血リスクが低下した時点が適切であり、数日から数週間の遅延が許容される。上肢虚血が軽度で側副血行が十分な症例では自然軽快もあり、全例に介入する必要はない。一方、対麻痺や脳症状は緊急対応を要する。"]},{"n":54,"ja":"介入を要しステントグラフトに適さない大動脈解剖のBTAI選択患者には、open surgical repairを推奨する","en":"Open surgical repair is recommended in selected patients with blunt thoracic aortic injury requiring intervention and with an aortic anatomy unsuitable for a stent graft.","cls":"I","lvl":"A","sec":"胸部大動脈・胸部出口","page":27,"det":"介入を要し、ステントグラフトに適さない大動脈解剖を有する選択されたBTAI患者には、open surgical repairが推奨される。エビデンスレベルAとされる数少ない項目の一つである。ステントグラフトに適さない解剖とは、landing zoneが確保できない（損傷が弓部・上行大動脈に及ぶ、左鎖骨下動脈起始部直下で十分なneckがない）、大動脈径がデバイスのサイズ展開より小さい（若年者・小児）、アクセス血管が細い・閉塞している、高度の屈曲でappositionが得られない、といった状況である。\n\n近年、BTAIに対する治療はendovascularへ大きく移行し、1997年のAAST1研究では全例がopen repairだったものが、2007年のAAST2研究では大部分がTEVARで行われるようになった。しかし、AAST2の多変量解析ではTEVAR群でadjusted mortalityと輸血必要量が少ないと示された一方、criticalな胸腔外損傷を伴う症例ではTEVARの生存利益が大きいという結果であり、open repairが不要になったわけではない。open repairは、心臓血管外科の体制、体外循環、活動的遠位灌流（推奨55）を必要とし、センター化が前提となる。解剖的に不適な症例を無理にTEVARで処理することは、collapseやエンドリークによる致死的合併症を招く。","detp":["介入を要し、ステントグラフトに適さない大動脈解剖を有する選択されたBTAI患者には、open surgical repairが推奨される。エビデンスレベルAとされる数少ない項目の一つである。ステントグラフトに適さない解剖とは、landing zoneが確保できない（損傷が弓部・上行大動脈に及ぶ、左鎖骨下動脈起始部直下で十分なneckがない）、大動脈径がデバイスのサイズ展開より小さい（若年者・小児）、アクセス血管が細い・閉塞している、高度の屈曲でappositionが得られない、といった状況である。","近年、BTAIに対する治療はendovascularへ大きく移行し、1997年のAAST1研究では全例がopen repairだったものが、2007年のAAST2研究では大部分がTEVARで行われるようになった。しかし、AAST2の多変量解析ではTEVAR群でadjusted mortalityと輸血必要量が少ないと示された一方、criticalな胸腔外損傷を伴う症例ではTEVARの生存利益が大きいという結果であり、open repairが不要になったわけではない。","open repairは、心臓血管外科の体制、体外循環、活動的遠位灌流（推奨55）を必要とし、センター化が前提となる。解剖的に不適な症例を無理にTEVARで処理することは、collapseやエンドリークによる致死的合併症を招く。"]},{"n":55,"ja":"open repairを受けるBTAI患者では、対麻痺リスク最小化のため活動的遠位大動脈灌流を推奨する","en":"Active distal aortic perfusion is recommended to minimise the risk of paraplegia for patients with blunt thoracic aortic injury undergoing open surgical repair.","cls":"I","lvl":"A","sec":"胸部大動脈・胸部出口","page":27,"det":"open repairを受けるBTAI患者では、対麻痺リスクを最小化するために活動的遠位大動脈灌流が推奨される。エビデンスレベルAである。BTAIのopen repairでは、大動脈遮断により脊髄への血流が途絶し、前脊髄動脈症候群による対麻痺が生じうる。遮断時間が長いほどリスクは高く、遮断中の末梢側灌流を維持する手段として、左心バイパス（left heart bypass）、部分体外循環、遠心ポンプによるshuntなどが用いられる。これにより遠位大動脈圧と脊髄灌流を保ちながら、中枢側の遮断下で吻合を行える。\n\nメタ解析では、open repairの手技関連対麻痺は3.6%、TEVARでは0%と報告され、strokeもTEVAR群で有意に少なかった。したがって、open repairが必要な症例では、脊髄保護を徹底することが転帰を左右する。実務では、①左心バイパスの準備と灌流量の管理、②脳脊髄液ドレナージの要否の検討、③遮断前後の血圧管理と貧血の是正、④術後の神経学的評価（下肢の運動・感覚、膀胱直腸障害）の定時実施、を組み込む。低体温 circulatory arrestを要する弓部病変では、脳保護（順行・逆行性脳灌流）も併せて計画する。","detp":["open repairを受けるBTAI患者では、対麻痺リスクを最小化するために活動的遠位大動脈灌流が推奨される。エビデンスレベルAである。BTAIのopen repairでは、大動脈遮断により脊髄への血流が途絶し、前脊髄動脈症候群による対麻痺が生じうる。遮断時間が長いほどリスクは高く、遮断中の末梢側灌流を維持する手段として、左心バイパス（left heart bypass）、部分体外循環、遠心ポンプによるshuntなどが用いられる。","これにより遠位大動脈圧と脊髄灌流を保ちながら、中枢側の遮断下で吻合を行える。メタ解析では、open repairの手技関連対麻痺は3.6%、TEVARでは0%と報告され、strokeもTEVAR群で有意に少なかった。したがって、open repairが必要な症例では、脊髄保護を徹底することが転帰を左右する。実務では、①左心バイパスの準備と灌流量の管理、②脳脊髄液ドレナージの要否の検討、③遮断前後の血圧管理と貧血の是正、④術後の神経学的評価（下肢の運動・感覚、膀胱直腸障害）の定時実施、を組み込む。","低体温 circulatory arrestを要する弓部病変では、脳保護（順行・逆行性脳灌流）も併せて計画する。"]},{"n":56,"ja":"ステントグラフト修復後のBTAI患者には、1か月・1年・以後少なくとも5年間のフォローアップ画像を推奨する","en":"Follow up imaging is recommended for patients with blunt thoracic aortic injury who have undergone endovascular stent graft repair, at one month, one year, and thereafter continued for at least five years.","cls":"I","lvl":"C","sec":"胸部大動脈・胸部出口","page":27,"det":"ステントグラフト修復後のBTAI患者には、1か月時、1年時、以後少なくとも5年間のフォローアップ画像が推奨される。BTAI修復後の至適サーベイランスプロトコルは確立していないが、患者は通常、初回画像フォローアップ後1年間、各施設のTEVARサーベイランスプログラムに異なる間隔で組み込まれる。長期的な医学的フォローアップが必要な理由は、若年でステントグラフトを留置することによる影響、すなわちステントグラフトのcollapse、高血圧、血栓性合併症などが生じうるためである。\n\nフォローアップでは、①エンドリーク、②デバイスのmigration・collapse、③大動脈のリモデリング（偽動脈瘤の縮小、壁在血栓の変化）、④アクセス血管の合併症、⑤高血圧の出現と管理、を評価する。5年間という期間は、外傷患者が若く長期の余命があること、受傷後数年でリモデリングが完了することを踏まえた実務的な区切りである。外傷患者ではフォローアップからの脱落が大きな問題であり、退院時に次回予約を組み、Primary careとの連携、遠隔モニタリング、患者教育（症状出現時の受診基準）を組み合わせることが、この推奨を実効化する鍵となる。","detp":["ステントグラフト修復後のBTAI患者には、1か月時、1年時、以後少なくとも5年間のフォローアップ画像が推奨される。BTAI修復後の至適サーベイランスプロトコルは確立していないが、患者は通常、初回画像フォローアップ後1年間、各施設のTEVARサーベイランスプログラムに異なる間隔で組み込まれる。長期的な医学的フォローアップが必要な理由は、若年でステントグラフトを留置することによる影響、すなわちステントグラフトのcollapse、高血圧、血栓性合併症などが生じうるためである。","フォローアップでは、①エンドリーク、②デバイスのmigration・collapse、③大動脈のリモデリング（偽動脈瘤の縮小、壁在血栓の変化）、④アクセス血管の合併症、⑤高血圧の出現と管理、を評価する。5年間という期間は、外傷患者が若く長期の余命があること、受傷後数年でリモデリングが完了することを踏まえた実務的な区切りである。外傷患者ではフォローアップからの脱落が大きな問題であり、退院時に次回予約を組み、Primary careとの連携、遠隔モニタリング、患者教育（症状出現時の受診基準）を組み合わせることが、この推奨を実効化する鍵となる。"]},{"n":57,"ja":"胸部大動脈修復を行わなかったBTAI患者には、大動脈リモデリングまでサーベイランス画像を推奨する","en":"Surveillance imaging until aortic remodelling is recommended for patients with blunt thoracic aortic injury who have not undergone thoracic aortic repair.","cls":"I","lvl":"C","sec":"胸部大動脈・胸部出口","page":27,"det":"胸部大動脈修復を行わなかったBTAI患者には、大動脈リモデリングまでサーベイランス画像が推奨される。保存的に管理されたGrade 1、ときにGrade 2の症例では、病変が消退するまでの観察が必要となる。医療療法の継続期間と至適サーベイランスregimenは不明であるが、残存する病変に対しては1か月・12か月、その後は完全なリモデリングまで年1回の画像フォローアップが妥当とされる。\n\n観察中に注意すべきは、①外壁輪郭の変化（Grade 1から2への進行）、②偽動脈瘤の増大、③大動脈の拡大、④壁在血栓の変化である。増大や輪郭変化があれば、遅延TEVARの適応を再検討する。また、保存的治療を選択した症例でも血圧管理は継続し、降圧の中止基準は画像での消退と血圧の安定を確認してから判断する。外傷患者では服薬アドヒアランスが低下しやすく、降圧薬の継続と受診の両面で支援が必要である。若年者では生涯にわたる被曝を考慮し、MRAや超音波による代替（推奨58）を検討する。観察中に注意すべきは、外壁輪郭の変化（Grade 1から2への進行）、偽動脈瘤の増大、大動脈の拡大、壁在血栓の変化である。増大や輪郭変化があれば遅延TEVARの適応を再検討する。保存的治療を選択した症例でも血圧管理は継続し、降圧の中止は画像での消退と血圧の安定を確認してから判断する。","detp":["胸部大動脈修復を行わなかったBTAI患者には、大動脈リモデリングまでサーベイランス画像が推奨される。保存的に管理されたGrade 1、ときにGrade 2の症例では、病変が消退するまでの観察が必要となる。医療療法の継続期間と至適サーベイランスregimenは不明であるが、残存する病変に対しては1か月・12か月、その後は完全なリモデリングまで年1回の画像フォローアップが妥当とされる。","観察中に注意すべきは、①外壁輪郭の変化（Grade 1から2への進行）、②偽動脈瘤の増大、③大動脈の拡大、④壁在血栓の変化である。増大や輪郭変化があれば、遅延TEVARの適応を再検討する。また、保存的治療を選択した症例でも血圧管理は継続し、降圧の中止基準は画像での消退と血圧の安定を確認してから判断する。外傷患者では服薬アドヒアランスが低下しやすく、降圧薬の継続と受診の両面で支援が必要である。","若年者では生涯にわたる被曝を考慮し、MRAや超音波による代替（推奨58）を検討する。観察中に注意すべきは、外壁輪郭の変化（Grade 1から2への進行）、偽動脈瘤の増大、大動脈の拡大、壁在血栓の変化である。増大や輪郭変化があれば遅延TEVARの適応を再検討する。保存的治療を選択した症例でも血圧管理は継続し、降圧の中止は画像での消退と血圧の安定を確認してから判断する。"]},{"n":58,"ja":"BTAI後の長期サーベイランスには、MRAを優先画像法として推奨する","en":"Magnetic resonance angiography is recommended as the preferred imaging method for long term surveillance after blunt thoracic aortic injury.","cls":"I","lvl":"C","sec":"胸部大動脈・胸部出口","page":27,"det":"BTAI後の長期サーベイランスには、MRAを優先画像法として推奨する。外傷患者は比較的若く、生涯にわたる反復CTAは悪性腫瘍のリスクを有意に高めうる。MRAはCTの有用な代替となり、放射線被曝を伴わない。造影剤（ガドリニウム）を用いる場合は腎機能（特に造影剤起因性腎症の既往）に注意するが、近年は非造影MRA（balanced SSFP、non-contrast MRA）の精度も向上しており、若年者の長期フォローアップに適している。\n\n一方、MRAはデバイス（ステントグラフト）の金属アーチファクトにより、留置部位の評価が限られることがある。ステントグラフト留置後の症例では、デバイス近傍のエンドリーク評価にはCTAが優るため、術後早期はCTA、長期の経過観察ではMRAという使い分けが現実的である。実務では、施設の機器・撮影時間・予約枠の制約も考慮し、患者ごとに「どの画像modalityで、どの間隔で、いつまで」を文書化して共有する。被曝の累積を意識した判断は、若年外傷患者の長期管理における重要な視点である。一方、MRAはステントグラフトの金属アーチファクトにより留置部位の評価が限られることがある。術後早期はCTA、デバイスから離れた長期の経過観察ではMRAという使い分けが現実的である。被曝の累積を意識した判断は、若年外傷患者の長期管理における重要な視点となる。","detp":["BTAI後の長期サーベイランスには、MRAを優先画像法として推奨する。外傷患者は比較的若く、生涯にわたる反復CTAは悪性腫瘍のリスクを有意に高めうる。MRAはCTの有用な代替となり、放射線被曝を伴わない。造影剤（ガドリニウム）を用いる場合は腎機能（特に造影剤起因性腎症の既往）に注意するが、近年は非造影MRA（balanced SSFP、non-contrast MRA）の精度も向上しており、若年者の長期フォローアップに適している。","一方、MRAはデバイス（ステントグラフト）の金属アーチファクトにより、留置部位の評価が限られることがある。ステントグラフト留置後の症例では、デバイス近傍のエンドリーク評価にはCTAが優るため、術後早期はCTA、長期の経過観察ではMRAという使い分けが現実的である。実務では、施設の機器・撮影時間・予約枠の制約も考慮し、患者ごとに「どの画像modalityで、どの間隔で、いつまで」を文書化して共有する。","被曝の累積を意識した判断は、若年外傷患者の長期管理における重要な視点である。一方、MRAはステントグラフトの金属アーチファクトにより留置部位の評価が限られることがある。術後早期はCTA、デバイスから離れた長期の経過観察ではMRAという使い分けが現実的である。被曝の累積を意識した判断は、若年外傷患者の長期管理における重要な視点となる。"]},{"n":59,"ja":"腕頭動脈・左総頸動脈近位損傷(Grade 2/3)の開胸術/血管内の治療選択は、血力学的状態・解剖・合併損傷に基づき考慮すべき","en":"The treatment choice of open surgical or endovascular repair of innominate artery or proximal left common carotid artery injury (ESVS Grade 2 and 3) should be considered based on haemodynamic status, anatomy, and concomitant injuries.","cls":"IIa","lvl":"C","sec":"胸部大動脈・胸部出口","page":28,"det":"腕頭動脈・左総頸動脈近位の損傷（ESVS Grade 2/3）に対するopen surgical repairかendovascular repairかの選択は、血行動態、解剖、合併損傷に基づいて考慮すべきとされる。上行大動脈・横行大動脈弓の破裂は、生存して来院する例が少ないほど死亡率が高く、急速に失血死する。腕頭動脈の破裂は、鈍的大動脈外傷に次いで2番目に多い胸部動脈損傷である。大動脈弓と大血管のopen repairは正中胸骨切開を要し、弓部損傷では低体温循環停止と順行・逆行性脳灌流を要することがある。\n\n腕頭動脈や左総頸動脈の損傷に対するステントグラフトによる血管内治療は、主に血力学的に安定した患者の症例報告として記述されている。これらの動脈の軽微な損傷（ESVS Grade 1）に対する抗血小板療法による非手術管理は妥当と思われるが、エビデンスは不足している。したがって、安定したGrade 1は保存的に、Grade 2/3は解剖と生理に応じてopen（正中胸骨切開、体外循環、脳保護）または血管内（ステントグラフト、chimney、in-situ fenestration）を選択する。緊急時にはhybrid手術室の有用性が高く、中枢側の制御とdebranchingを組み合わせた戦略が現実的な解となる。","detp":["腕頭動脈・左総頸動脈近位の損傷（ESVS Grade 2/3）に対するopen surgical repairかendovascular repairかの選択は、血行動態、解剖、合併損傷に基づいて考慮すべきとされる。上行大動脈・横行大動脈弓の破裂は、生存して来院する例が少ないほど死亡率が高く、急速に失血死する。腕頭動脈の破裂は、鈍的大動脈外傷に次いで2番目に多い胸部動脈損傷である。","大動脈弓と大血管のopen repairは正中胸骨切開を要し、弓部損傷では低体温循環停止と順行・逆行性脳灌流を要することがある。腕頭動脈や左総頸動脈の損傷に対するステントグラフトによる血管内治療は、主に血力学的に安定した患者の症例報告として記述されている。これらの動脈の軽微な損傷（ESVS Grade 1）に対する抗血小板療法による非手術管理は妥当と思われるが、エビデンスは不足している。","したがって、安定したGrade 1は保存的に、Grade 2/3は解剖と生理に応じてopen（正中胸骨切開、体外循環、脳保護）または血管内（ステントグラフト、chimney、in-situ fenestration）を選択する。緊急時にはhybrid手術室の有用性が高く、中枢側の制御とdebranchingを組み合わせた戦略が現実的な解となる。"]},{"n":60,"ja":"手術治療を要する鎖骨下動脈損傷(Grade 2/3)患者には、血管内ステントグラフト修復を優先手技とすることを考慮すべき","en":"Endovascular stent graft repair should be considered the preferred treatment modality for patients with subclavian artery injury (ESVS Grade2 and 3) requiring operative treatment.","cls":"IIa","lvl":"B","sec":"胸部大動脈・胸部出口","page":28,"det":"手術治療を要する鎖骨下動脈損傷（ESVS Grade 2/3）患者には、血管内ステントグラフト修復を優先手技として考慮すべきとされる（エビデンスレベルB）。鎖骨下動脈損傷の術前CTAは、近位制御のための切開計画に有用である。右鎖骨下動脈近位損傷の標準的なopen exposureは正中胸骨切開＋右頸部または鎖骨上窩への延長、左鎖骨下動脈近位損傷の中枢側制御は正中胸骨切開で得て、末梢側制御には別の左鎖骨上窩切開を用いる。openと血管内を組み合わせたhybrid approachは、選択された患者で胸骨切開を避けつつ近位制御を得る代替となる。\n\n血管内治療は鈍的・穿通性のいずれでも記述されており、適切に選択された患者では、到達が困難なの領域の損傷に対して良好な転帰が示されている。Brancoらは、鎖骨下動脈損傷の血管内治療がopen repairより院内死亡と手術部位感染率が低いと報告し、National Trauma Data Bankの大規模コホートでも血管内治療の死亡率の低さが示された。解剖的には、鎖骨下動脈の起始部近傍はlanding zoneの確保が難しく、椎骨動脈・内胸動脈の起始部との関係を評価したうえで、必要なら被覆と血行再建（推奨52・53と同様の論理）を組み合わせる。","detp":["手術治療を要する鎖骨下動脈損傷（ESVS Grade 2/3）患者には、血管内ステントグラフト修復を優先手技として考慮すべきとされる（エビデンスレベルB）。鎖骨下動脈損傷の術前CTAは、近位制御のための切開計画に有用である。右鎖骨下動脈近位損傷の標準的なopen exposureは正中胸骨切開＋右頸部または鎖骨上窩への延長、左鎖骨下動脈近位損傷の中枢側制御は正中胸骨切開で得て、末梢側制御には別の左鎖骨上窩切開を用いる。","openと血管内を組み合わせたhybrid approachは、選択された患者で胸骨切開を避けつつ近位制御を得る代替となる。血管内治療は鈍的・穿通性のいずれでも記述されており、適切に選択された患者では、到達が困難なの領域の損傷に対して良好な転帰が示されている。Brancoらは、鎖骨下動脈損傷の血管内治療がopen repairより院内死亡と手術部位感染率が低いと報告し、National Trauma Data Bankの大規模コホートでも血管内治療の死亡率の低さが示された。","解剖的には、鎖骨下動脈の起始部近傍はlanding zoneの確保が難しく、椎骨動脈・内胸動脈の起始部との関係を評価したうえで、必要なら被覆と血行再建（推奨52・53と同様の論理）を組み合わせる。"]},{"n":61,"ja":"ショック状態で持続出血があり腹部大血管損傷が疑われる患者には、即時の外科的探索と止血を推奨する","en":"Immediate surgical exploration and haemorrhage control are recommended for patients in shock with ongoing bleeding and suspicion of major abdominal vascular injury.","cls":"I","lvl":"C","sec":"腹部","page":29,"det":"ショック状態で持続出血があり、腹部大血管損傷が疑われる患者には、即時の外科的探索と止血が推奨される。ショックで持続する出血がある症例は、直ちに手術室へ移送し、major haemorrhage protocolを用いた蘇生と並行して開腹による制御を行う。ダメージコントロールの原則を適用し、腹腔内に有意な量のfree bloodがあれば、血液と凝血塊の除去、腸管のeviscerationを行ったうえで、resuscitative packingを行う。peritoneal packingでもmajor haemorrhageが持続する場合、あるいは開腹時に心停止となった場合は、横隔膜裂孔レベルで大動脈を圧迫する。腹腔に入る前に心停止となった場合は、 anterolateral emergency thoracotomyを行って胸部大動脈を圧迫する。\n\nこの状況では、画像検査で損傷部位を確定する余裕はなく、出血源の制御が最優先となる。腹部の4つのcompartment（肝・脾、後腹膜、腸間膜、骨盤後腹膜）を順に評価し、パッキングで制御しながら可及的に血管修復または結紮を行う。蘇生は許容的低血圧と大量輸血プロトコル（推奨4・5）に沿って進め、低体温・アシドーシス・凝固障害の是正を並行させる。止血が得られたら、計画的なsecond lookとdefinitive reconstructionのためにICUへ移送する。","detp":["ショック状態で持続出血があり、腹部大血管損傷が疑われる患者には、即時の外科的探索と止血が推奨される。ショックで持続する出血がある症例は、直ちに手術室へ移送し、major haemorrhage protocolを用いた蘇生と並行して開腹による制御を行う。ダメージコントロールの原則を適用し、腹腔内に有意な量のfree bloodがあれば、血液と凝血塊の除去、腸管のeviscerationを行ったうえで、resuscitative packingを行う。","peritoneal packingでもmajor haemorrhageが持続する場合、あるいは開腹時に心停止となった場合は、横隔膜裂孔レベルで大動脈を圧迫する。腹腔に入る前に心停止となった場合は、 anterolateral emergency thoracotomyを行って胸部大動脈を圧迫する。この状況では、画像検査で損傷部位を確定する余裕はなく、出血源の制御が最優先となる。","腹部の4つのcompartment（肝・脾、後腹膜、腸間膜、骨盤後腹膜）を順に評価し、パッキングで制御しながら可及的に血管修復または結紮を行う。蘇生は許容的低血圧と大量輸血プロトコル（推奨4・5）に沿って進め、低体温・アシドーシス・凝固障害の是正を並行させる。止血が得られたら、計画的なsecond lookとdefinitive reconstructionのためにICUへ移送する。"]},{"n":62,"ja":"トラウマ開腹時の後腹膜血腫は、血力学的に不安定、または不安定な後腹膜血腫(拡大・拍動性・活動性出血)の場合、外科的探索を推奨する","en":"Surgical exploration of retroperitoneal haematomas during trauma laparotomy is recommended in patients who are haemodynamically unstable OR who have an unstable retroperitoneal haematoma (expanding, pulsatile, or actively bleeding).","cls":"I","lvl":"C","sec":"腹部","page":29,"det":"トラウマ開腹時の後腹膜血腫は、血力学的に不安定であるか、不安定な後腹膜血腫（拡大・拍動性・活動性出血）を有する場合に、外科的探索が推奨される。後腹膜血腫の管理はエビデンスレベルが低いが、数十年の外傷経験と観察研究により進化してきた。アプローチは伝統的に、患者の血力学的状態、受傷機転、血腫の局在、合併損傷の有無に依存してきた。zone分類に基づく管理は、CTAの普及と血管内治療の増加以前に開発されたものであり、実際の後腹膜血腫はzoneの境界に限られない。したがって、zoneではなく患者の生理状態と血腫の安定性で方針を決める。\n\n不安定な場合（拡大する、拍動性、活動性出血）は、開腹時に後腹膜を探索する。後腹膜の探索は主に右または左のmedial visceral rotation（Mattox法は左、Cattell-Braasch法は右）で行い、血腫の部位に応じて大動脈（左）や下大静脈（右）、門脈（肝門部）に到達する。専門的な探索技術がない場合には、血腫を一時的にパッキングで制御し、専門医の到着または他施設への搬送を待つ戦略もある。パッキングで制御できないmajor arterial injuryでは、探索と制御を試みなければならない。","detp":["トラウマ開腹時の後腹膜血腫は、血力学的に不安定であるか、不安定な後腹膜血腫（拡大・拍動性・活動性出血）を有する場合に、外科的探索が推奨される。後腹膜血腫の管理はエビデンスレベルが低いが、数十年の外傷経験と観察研究により進化してきた。アプローチは伝統的に、患者の血力学的状態、受傷機転、血腫の局在、合併損傷の有無に依存してきた。zone分類に基づく管理は、CTAの普及と血管内治療の増加以前に開発されたものであり、実際の後腹膜血腫はzoneの境界に限られない。","したがって、zoneではなく患者の生理状態と血腫の安定性で方針を決める。不安定な場合（拡大する、拍動性、活動性出血）は、開腹時に後腹膜を探索する。後腹膜の探索は主に右または左のmedial visceral rotation（Mattox法は左、Cattell-Braasch法は右）で行い、血腫の部位に応じて大動脈（左）や下大静脈（右）、門脈（肝門部）に到達する。専門的な探索技術がない場合には、血腫を一時的にパッキングで制御し、専門医の到着または他施設への搬送を待つ戦略もある。","パッキングで制御できないmajor arterial injuryでは、探索と制御を試みなければならない。"]},{"n":63,"ja":"血力学的に安定し、安定した後腹膜血腫(非拡大・非拍動・非活動性出血)の場合、非探索的アプローチとその後のCTAを推奨する","en":"A non-exploratory approach of retroperitoneal haematomas during trauma laparotomy, with subsequent computed tomography angiography imaging, is recommended for patients who are haemodynamically stable AND have a stable retroperitoneal haematoma (not expanding, not pulsatile, and not actively bleeding).","cls":"I","lvl":"C","sec":"腹部","page":29,"det":"血力学的に安定し、かつ安定した後腹膜血腫（拡大しない、拍動性でない、活動性出血がない）を有する患者では、非探索的アプローチと、その後のCTAによる評価が推奨される。安定した血腫は、止血が完了した（あるいは tamponade されている）状態であり、無理な探索は血腫の破綻と新たな出血を招きうる。特に腎・肝の周囲や骨盤後腹膜の血腫では、探索により止血困難な出血を惹起する危険が高い。\n\nこの場合、開腹創を閉鎖し、全身状態を安定させたうえでCTAを施行し、損傷血管の局在・グレードを確定して、必要なら血管内治療（塞栓術、ステントグラフト）へ進む。CTAで明らかな活動性出血や偽動脈瘤が確認されれば塞栓を、主要動脈の断裂が疑われればopenまたは血管内修復を検討する。この「非探索＋CTA」戦略は、外傷外科とIVRの連携が機能していることが前提であり、CT室への移動中も循環を観察できる体制、造影剤アレルギー・腎機能の事前把握、塞栓の準備を整えておく。なお、経過中に血腫の増大や血行動態の破綻が生じれば、直ちに探索へ方針を戻す。この「非探索＋CTA」戦略は、外傷外科とIVRの連携が機能していることが前提であり、CT室への移動中も循環を観察できる体制、造影剤アレルギー・腎機能の事前把握、塞栓の準備を整えておく。経過中に血腫の増大や血行動態の破綻が生じれば、直ちに探索へ方針を戻す。","detp":["血力学的に安定し、かつ安定した後腹膜血腫（拡大しない、拍動性でない、活動性出血がない）を有する患者では、非探索的アプローチと、その後のCTAによる評価が推奨される。安定した血腫は、止血が完了した（あるいは tamponade されている）状態であり、無理な探索は血腫の破綻と新たな出血を招きうる。特に腎・肝の周囲や骨盤後腹膜の血腫では、探索により止血困難な出血を惹起する危険が高い。","この場合、開腹創を閉鎖し、全身状態を安定させたうえでCTAを施行し、損傷血管の局在・グレードを確定して、必要なら血管内治療（塞栓術、ステントグラフト）へ進む。CTAで明らかな活動性出血や偽動脈瘤が確認されれば塞栓を、主要動脈の断裂が疑われればopenまたは血管内修復を検討する。この「非探索＋CTA」戦略は、外傷外科とIVRの連携が機能していることが前提であり、CT室への移動中も循環を観察できる体制、造影剤アレルギー・腎機能の事前把握、塞栓の準備を整えておく。","なお、経過中に血腫の増大や血行動態の破綻が生じれば、直ちに探索へ方針を戻す。この「非探索＋CTA」戦略は、外傷外科とIVRの連携が機能していることが前提であり、CT室への移動中も循環を観察できる体制、造影剤アレルギー・腎機能の事前把握、塞栓の準備を整えておく。経過中に血腫の増大や血行動態の破綻が生じれば、直ちに探索へ方針を戻す。"]},{"n":64,"ja":"持続出血のない鈍的軽微腹部大動脈・腸骨・腎・上腸間膜動脈損傷(Grade 1)には、サーベイランスと抗血栓療法の非手術管理を推奨する","en":"Non-operative management with surveillance and antithrombotic therapy is recommended for patients without ongoing bleeding and blunt minor abdominal aortic, iliac, renal, or superior mesenteric artery injuries (ESVS Grade 1) on computed tomography angiography.","cls":"I","lvl":"C","sec":"腹部","page":30,"det":"持続出血のない鈍的軽微な腹部大動脈・腸骨・腎・上腸間膜動脈損傷（CTA上のESVS Grade 1）には、サーベイランスと抗血栓療法による非手術管理が推奨される。Grade 1は内膜損傷・壁在血腫など外壁輪郭の正常な部分損傷で、破裂の危険は低く、問題は血栓塞栓による臓器虚血（腎梗塞、腸管虚血）と、損傷の進行である。抗血栓療法により血栓進展と塞栓を予防し、画像で病変の安定性を確認する。\n\n実務では、①初期の反復評価（24〜48時間程度の血液検査、腹部所見、必要ならCTA）で病変の進行と臓器灌流の変化を確認、②腎動脈損傷では腎機能と血圧、SMA損傷では腸管虚血の徴候（疼痛の程度と腹部所見の乖離、乳酸値、造影CTでの腸管壁の造影効果）を継続的に評価、③抗血栓療法の開始時期と強度は合併損傷の出血リスクとのバランスで決める、という流れになる。偽動脈瘤の出現、狭窄の進行、臓器虚血の徴候があれば、血管内治療（ステント、塞栓）の適応を検討する。この推奨は「軽微だから何もしない」ではなく「抗血栓＋サーベイランスで管理する」ことを求めている。実務では、初期の反復評価（24〜48時間程度の血液検査、腹部所見、必要ならCTA）で病変の進行と臓器灌流の変化を確認する。腎動脈損傷では腎機能と血圧、SMA損傷では腸管虚血の徴候（疼痛と腹部所見の乖離、乳酸値、腸管壁の造影効果）を継続的に評価する。","detp":["持続出血のない鈍的軽微な腹部大動脈・腸骨・腎・上腸間膜動脈損傷（CTA上のESVS Grade 1）には、サーベイランスと抗血栓療法による非手術管理が推奨される。Grade 1は内膜損傷・壁在血腫など外壁輪郭の正常な部分損傷で、破裂の危険は低く、問題は血栓塞栓による臓器虚血（腎梗塞、腸管虚血）と、損傷の進行である。抗血栓療法により血栓進展と塞栓を予防し、画像で病変の安定性を確認する。","実務では、①初期の反復評価（24〜48時間程度の血液検査、腹部所見、必要ならCTA）で病変の進行と臓器灌流の変化を確認、②腎動脈損傷では腎機能と血圧、SMA損傷では腸管虚血の徴候（疼痛の程度と腹部所見の乖離、乳酸値、造影CTでの腸管壁の造影効果）を継続的に評価、③抗血栓療法の開始時期と強度は合併損傷の出血リスクとのバランスで決める、という流れになる。偽動脈瘤の出現、狭窄の進行、臓器虚血の徴候があれば、血管内治療（ステント、塞栓）の適応を検討する。","この推奨は「軽微だから何もしない」ではなく「抗血栓＋サーベイランスで管理する」ことを求めている。実務では、初期の反復評価（24〜48時間程度の血液検査、腹部所見、必要ならCTA）で病変の進行と臓器灌流の変化を確認する。腎動脈損傷では腎機能と血圧、SMA損傷では腸管虚血の徴候（疼痛と腹部所見の乖離、乳酸値、腸管壁の造影効果）を継続的に評価する。"]},{"n":65,"ja":"自由出血と血力学的不安定を伴う鈍的/穿通性腹部大動脈損傷(Grade 3)には、第一選択としてopen repairを推奨する","en":"Open surgical repair is recommended as first line treatment for patients with blunt or penetrating abdominal aortic injury with free haemorrhage and haemodynamic instability (ESVS Grade 3).","cls":"I","lvl":"C","sec":"腹部","page":30,"det":"自由出血と血力学的不安定を伴う鈍的・穿通性の腹部大動脈損傷（ESVS Grade 3）には、第一選択としてopen surgical repairが推奨される。開腹時に大動脈損傷に遭遇する状況では、まず腹腔内の血液と凝血塊を除去し、損傷部位の近位・遠位の制御を確保する。腎動脈下の損傷では横隔膜裂孔または小網からの大動脈圧迫、あるいは左medial visceral rotation（Mattox法）による露出が用いられ、損傷の高さに応じてsupraceliac、interrenal、infrarenalの各レベルでclampの位置を変える。\n\n修復は、可能なら一次縫合、広範な壁欠損があれば人工血管による管状またはY字グラフト再建が最も多い報告である。この状況で血管内治療を第一選択としないのは、①循環が破綻して血管造影室への搬送が危険であること、②腹腔内出血の源が複数あることが多く、開腹して直接確認する必要があること、③出血による圧迫で解剖が不明瞭なうえ、緊急のバルーンによる近位制御にも時間がかかること、による。open repairは侵襲が大きく、腎・腸管の虚血時間を意識した迅速な操作が求められる。止血後はダメージコントロール戦略としてパッキングと一時的閉腹を行い、ICUで復温・凝固障害の是正を待ってからdefinitiveな処置へ進む判断も選択肢となる。","detp":["自由出血と血力学的不安定を伴う鈍的・穿通性の腹部大動脈損傷（ESVS Grade 3）には、第一選択としてopen surgical repairが推奨される。開腹時に大動脈損傷に遭遇する状況では、まず腹腔内の血液と凝血塊を除去し、損傷部位の近位・遠位の制御を確保する。腎動脈下の損傷では横隔膜裂孔または小網からの大動脈圧迫、あるいは左medial visceral rotation（Mattox法）による露出が用いられ、損傷の高さに応じてsupraceliac、interrenal、infrarenalの各レベルでclampの位置を変える。","修復は、可能なら一次縫合、広範な壁欠損があれば人工血管による管状またはY字グラフト再建が最も多い報告である。この状況で血管内治療を第一選択としないのは、①循環が破綻して血管造影室への搬送が危険であること、②腹腔内出血の源が複数あることが多く、開腹して直接確認する必要があること、③出血による圧迫で解剖が不明瞭なうえ、緊急のバルーンによる近位制御にも時間がかかること、による。open repairは侵襲が大きく、腎・腸管の虚血時間を意識した迅速な操作が求められる。","止血後はダメージコントロール戦略としてパッキングと一時的閉腹を行い、ICUで復温・凝固障害の是正を待ってからdefinitiveな処置へ進む判断も選択肢となる。"]},{"n":66,"ja":"緊急時の大動脈再建には、腸管損傷合併の有無にかかわらず合成グラフト材料を推奨する","en":"Synthetic graft material is recommended for aortic reconstruction in emergency situations with or without concomitant bowel injury.","cls":"I","lvl":"C","sec":"腹部","page":30,"det":"緊急時の大動脈再建には、腸管損傷の合併の有無にかかわらず合成グラフト材料が推奨される。開腹時の大動脈損傷では、一次縫合が可能な症例は限られ、多くはaortic tubeまたはbifurcated graftによる再建となる。外傷では自家静脈や腹膜などの代替材料を準備する時間的余裕がなく、口径の一致した合成グラフトが唯一現実的な選択肢となることが多い。感染や腸管損傷の合併があっても合成グラフトは使用可能とされており、これは待機的心血管手術における「汚染野に人工血管は避ける」という原則とは異なる、外傷特有の判断である。\n\n根拠として、緊急に血流を回復しなければ死亡する状況では、後日の感染リスクよりも止血と臓器灌流の回復が優先される。実務では、①腸管内容の漏出があれば可及的にdebrisを除去し、灌流（洗浄）を行う、②大動脈を可及的正常組織で吻合する、③グラフトを大網や後腹膜で被覆する（wrapping）ことで感染リスクを下げる、④術後に画像評価と感染徴候の監視を継続し、必要なら後日の再建を計画する、といった工夫を組み合わせる。実務では、腸管内容の漏出があれば可及的にdebrisを除去し灌流を行うこと、大動脈を可及的正常組織で吻合すること、グラフトを大網や後腹膜で被覆して感染リスクを下げること、術後に画像評価と感染徴候の監視を継続し必要なら後日の再建を計画することを組み合わせる。","detp":["緊急時の大動脈再建には、腸管損傷の合併の有無にかかわらず合成グラフト材料が推奨される。開腹時の大動脈損傷では、一次縫合が可能な症例は限られ、多くはaortic tubeまたはbifurcated graftによる再建となる。外傷では自家静脈や腹膜などの代替材料を準備する時間的余裕がなく、口径の一致した合成グラフトが唯一現実的な選択肢となることが多い。感染や腸管損傷の合併があっても合成グラフトは使用可能とされており、これは待機的心血管手術における「汚染野に人工血管は避ける」という原則とは異なる、外傷特有の判断である。","根拠として、緊急に血流を回復しなければ死亡する状況では、後日の感染リスクよりも止血と臓器灌流の回復が優先される。実務では、①腸管内容の漏出があれば可及的にdebrisを除去し、灌流（洗浄）を行う、②大動脈を可及的正常組織で吻合する、③グラフトを大網や後腹膜で被覆する（wrapping）ことで感染リスクを下げる、④術後に画像評価と感染徴候の監視を継続し、必要なら後日の再建を計画する、といった工夫を組み合わせる。","実務では、腸管内容の漏出があれば可及的にdebrisを除去し灌流を行うこと、大動脈を可及的正常組織で吻合すること、グラフトを大網や後腹膜で被覆して感染リスクを下げること、術後に画像評価と感染徴候の監視を継続し必要なら後日の再建を計画することを組み合わせる。"]},{"n":67,"ja":"血力学的に安定し偽動脈瘤など外郭輪郭異常(Grade 2)を伴う腹部大動脈損傷には、血管内ステントグラフト修復を考慮すべき","en":"Endovascular stent graft repair should be considered for haemodynamically stable patients and abdominal aortic injury with external contour abnormality such as a pseudoaneurysm (ESVS Grade 2).","cls":"IIa","lvl":"C","sec":"腹部","page":31,"det":"血力学的に安定し、偽動脈瘤などの外壁輪郭異常（ESVS Grade 2）を伴う腹部大動脈損傷には、血管内ステントグラフト修復を考慮すべきとされる。腹部大動脈損傷に対する血管内治療のデータは非常に限られているが、より堅牢なデータがある胸部大動脈や腸骨動脈の知見から外挿すると、解剖が適合する症例では血管内手技が転帰上有益でありうる。WTAの検討では鈍的腹部大動脈損傷の一部が血管内治療で処理され、その群では全例が生存退院したと報告されている。\n\n選択の要点は、①損傷の位置（腎動脈・visceral branchとの関係）、②landing zoneの長さと大動脈径、③アクセス血管の性状、④腹腔内の併存損傷の有無である。腎動脈やSMAの起始部に近い損傷では、被覆により臓器虚血を生じないか慎重に評価する必要があり、chimney法やfenestrated deviceの適応は症例限定的である。造影剤の血管外漏出が持続している場合や血腫が増大している場合は、血管内治療室への搬送リスクを踏まえ、open repairやハイブリッド手術室での治療を優先する。実務では、損傷部位の同定と治療方針を外傷外科・血管外科・IVRで早期に共有する。","detp":["血力学的に安定し、偽動脈瘤などの外壁輪郭異常（ESVS Grade 2）を伴う腹部大動脈損傷には、血管内ステントグラフト修復を考慮すべきとされる。腹部大動脈損傷に対する血管内治療のデータは非常に限られているが、より堅牢なデータがある胸部大動脈や腸骨動脈の知見から外挿すると、解剖が適合する症例では血管内手技が転帰上有益でありうる。WTAの検討では鈍的腹部大動脈損傷の一部が血管内治療で処理され、その群では全例が生存退院したと報告されている。","選択の要点は、①損傷の位置（腎動脈・visceral branchとの関係）、②landing zoneの長さと大動脈径、③アクセス血管の性状、④腹腔内の併存損傷の有無である。腎動脈やSMAの起始部に近い損傷では、被覆により臓器虚血を生じないか慎重に評価する必要があり、chimney法やfenestrated deviceの適応は症例限定的である。造影剤の血管外漏出が持続している場合や血腫が増大している場合は、血管内治療室への搬送リスクを踏まえ、open repairやハイブリッド手術室での治療を優先する。","実務では、損傷部位の同定と治療方針を外傷外科・血管外科・IVRで早期に共有する。"]},{"n":68,"ja":"低血圧下で撮影された腹部大動脈損傷の緊急血管内治療では、20–30%のステントグラフトオーバーサイジングを考慮すべき","en":"Stent graft oversizing between 20% and 30% should be considered when imaging was performed during hypotension for patients with abdominal aortic injury undergoing emergency endovascular treatment.","cls":"IIa","lvl":"C","sec":"腹部","page":31,"det":"低血圧下で撮影された画像に基づいて腹部大動脈損傷の緊急血管内治療を行う場合には、20〜30%のステントグラフトオーバーサイジングを考慮すべきとされる。低容量・低血圧状態では大動脈径が実際より小さく計測され、その後容量が戻ると大動脈が拡張するため、相対的にデバイスが小さくなり、type Iエンドリークやmigrationを生じうる。胸部大動脈（推奨50）と同じ論理である。\n\n一方、過度のオーバーサイジングはデバイスのcollapseを招き、致死的となりうる。腹部大動脈では胸部より径が小さく、動脈硬化性の変化や若年者のsmall aortaといったvariationもあるため、術前の計測はmultiplanar再構成で複数レベルから行い、可能なら正常容量に戻った時点での再CTAを計画する。緊急で再撮影の余裕がない場合は、複数サイズのデバイスを準備して血管造影室に入ることが実務的な安全策となる。アクセス血管の径と屈曲も、デバイス選択とシースサイズの決定に組み込む。緊急で再撮影の余裕がない場合は、複数サイズのデバイスを準備して血管造影室に入ることが実務的な安全策となる。アクセス血管の径と屈曲も、デバイス選択とシースサイズの決定に組み込む。デバイスのcollapseは致死的であり、過剰なオーバーサイジングは避ける。","detp":["低血圧下で撮影された画像に基づいて腹部大動脈損傷の緊急血管内治療を行う場合には、20〜30%のステントグラフトオーバーサイジングを考慮すべきとされる。低容量・低血圧状態では大動脈径が実際より小さく計測され、その後容量が戻ると大動脈が拡張するため、相対的にデバイスが小さくなり、type Iエンドリークやmigrationを生じうる。胸部大動脈（推奨50）と同じ論理である。一方、過度のオーバーサイジングはデバイスのcollapseを招き、致死的となりうる。","腹部大動脈では胸部より径が小さく、動脈硬化性の変化や若年者のsmall aortaといったvariationもあるため、術前の計測はmultiplanar再構成で複数レベルから行い、可能なら正常容量に戻った時点での再CTAを計画する。緊急で再撮影の余裕がない場合は、複数サイズのデバイスを準備して血管造影室に入ることが実務的な安全策となる。アクセス血管の径と屈曲も、デバイス選択とシースサイズの決定に組み込む。","緊急で再撮影の余裕がない場合は、複数サイズのデバイスを準備して血管造影室に入ることが実務的な安全策となる。アクセス血管の径と屈曲も、デバイス選択とシースサイズの決定に組み込む。デバイスのcollapseは致死的であり、過剰なオーバーサイジングは避ける。"]},{"n":69,"ja":"緊急開腹時に発見した総/外腸骨動脈損傷(Grade 3)には、一次修復・合成間置グラフト再建・血管シャントを推奨する","en":"Primary surgical repair, synthetic interposition graft reconstruction, or vascular shunting is recommended for common or external iliac artery injury (ESVS Grade 3) discovered during emergency laparotomy.","cls":"I","lvl":"C","sec":"腹部","page":31,"det":"緊急開腹時に発見した総腸骨動脈・外腸骨動脈損傷（ESVS Grade 3）には、一次修復、合成間置グラフトによる再建、または血管シャントが推奨される。ダメージコントロール開腹中に遭遇する破裂性の腸骨動脈損傷は、その解剖学的位置と巨大な後腹膜血腫のため、非常に困難な症例となる。重症で血行動態が不安定な患者は一時的血管シャントの候補となり、これは安全性が高く、関連合併症と死亡が少ないと報告されている。総腸骨・外腸骨動脈は可能なら一次修復し、血管壁の破壊が高度な場合は合成間置グラフトで再建する。\n\n総腸骨・外腸骨動脈の結紮後の死亡率は非常に高く、報告によりばらつきがあるものの高い値を示しており、これは損傷の困難さと、緊急に遠位血流を回復する必要性を反映している。他の合併症には切断があり、高い率で報告されている。したがって、結紮は原則として避け、修復・再建・シャントのいずれかで血流を確保する。実務では、右medial visceral rotation（Cattell-Braasch法）または左（Mattox法）による後腹膜の展開で近位制御を得て、末梢側は鼠径部の別切開で確保する。駆血帯付きのバルーンカテーテルによる一時的制御も補助的に用いられる。","detp":["緊急開腹時に発見した総腸骨動脈・外腸骨動脈損傷（ESVS Grade 3）には、一次修復、合成間置グラフトによる再建、または血管シャントが推奨される。ダメージコントロール開腹中に遭遇する破裂性の腸骨動脈損傷は、その解剖学的位置と巨大な後腹膜血腫のため、非常に困難な症例となる。重症で血行動態が不安定な患者は一時的血管シャントの候補となり、これは安全性が高く、関連合併症と死亡が少ないと報告されている。","総腸骨・外腸骨動脈は可能なら一次修復し、血管壁の破壊が高度な場合は合成間置グラフトで再建する。総腸骨・外腸骨動脈の結紮後の死亡率は非常に高く、報告によりばらつきがあるものの高い値を示しており、これは損傷の困難さと、緊急に遠位血流を回復する必要性を反映している。他の合併症には切断があり、高い率で報告されている。したがって、結紮は原則として避け、修復・再建・シャントのいずれかで血流を確保する。","実務では、右medial visceral rotation（Cattell-Braasch法）または左（Mattox法）による後腹膜の展開で近位制御を得て、末梢側は鼠径部の別切開で確保する。駆血帯付きのバルーンカテーテルによる一時的制御も補助的に用いられる。"]},{"n":70,"ja":"総/外腸骨動脈損傷 Grade 2/3 には血管内ステントグラフト修復を考慮すべき","en":"Endovascular stent graft repair should be considered for ESVS Grade 2 or 3 common or external iliac artery injury.","cls":"IIa","lvl":"C","sec":"腹部","page":31,"det":"総腸骨・外腸骨動脈のESVS Grade 2/3損傷には、血管内ステントグラフト修復を考慮すべきとされる。解剖学的に適合すれば、ステントグラフトによる腸骨動脈損傷の修復は、open surgeryより侵襲が少ない代替として、院内死亡・敗血症・手術部位感染が有意に低いと報告されている。Grade 2（外壁輪郭異常、contained bleeding）はステントグラフト修復の良い適応であり、インターベンションのリソースの可用性に応じて考慮する。\n\n一方、Grade X（閉塞）はopen repairで治療されることが最も多い。Grade 3（自由出血）で循環が破綻している症例では、血管内治療室への搬送やデバイスの準備に時間を要するため、openまたはハイブリッド手術室での治療が優先され。実務の要点は、①損傷が総腸骨動脈か外腸骨動脈か、内腸骨動脈起始部との関係、②landing zoneの確保、③アクセス血管（対側の大腿動脈からのcross-overか、同側順行性か）、④骨盤骨折や骨盤内出血源の併存、である。骨盤外傷に伴う腸骨動脈損傷では、塞栓術との組み合わせで止血戦略を組み立てることが多い。","detp":["総腸骨・外腸骨動脈のESVS Grade 2/3損傷には、血管内ステントグラフト修復を考慮すべきとされる。解剖学的に適合すれば、ステントグラフトによる腸骨動脈損傷の修復は、open surgeryより侵襲が少ない代替として、院内死亡・敗血症・手術部位感染が有意に低いと報告されている。Grade 2（外壁輪郭異常、contained bleeding）はステントグラフト修復の良い適応であり、インターベンションのリソースの可用性に応じて考慮する。","一方、Grade X（閉塞）はopen repairで治療されることが最も多い。Grade 3（自由出血）で循環が破綻している症例では、血管内治療室への搬送やデバイスの準備に時間を要するため、openまたはハイブリッド手術室での治療が優先され。実務の要点は、①損傷が総腸骨動脈か外腸骨動脈か、内腸骨動脈起始部との関係、②landing zoneの確保、③アクセス血管（対側の大腿動脈からのcross-overか、同側順行性か）、④骨盤骨折や骨盤内出血源の併存、である。","骨盤外傷に伴う腸骨動脈損傷では、塞栓術との組み合わせで止血戦略を組み立てることが多い。"]},{"n":71,"ja":"骨盤損傷で持続出血の臨床徴候または内腸骨動脈・分枝からの血管外漏出画像所見がある患者には、塞栓術による血管内治療を推奨する","en":"Endovascular treatment with embolisation is recommended for patients with pelvic injury and clinical signs of ongoing bleeding or imaging showing extravasation from the internal iliac artery or its branches.","cls":"I","lvl":"B","sec":"腹部","page":31,"det":"骨盤損傷で持続出血の臨床徴候がある患者、または内腸骨動脈およびその分枝からの血管外漏出を画像で認める患者には、塞栓術による血管内治療が推奨される（エビデンスレベルB）。骨盤外傷では、内腸骨動脈領域からの動脈性出血が持続出血の主要原因となる。初期管理は蘇生、骨盤の機械的安定化（骨盤binder、外固定）、骨盤外の出血源の同定と治療であり、これらと並行して血管造影・塞栓術の適応を判断する。\n\n骨盤血管造影と塞栓術は、出血の臨床徴候と動脈性の血管外漏出（あるいは偽動脈瘤、血管のabrupt cutoffといった間接所見）を有する患者群に利益をもたらす。内腸骨動脈は片側であれば結紮可能であり、両側結紮はまれであるが、血行動態の破綻した症例では止血を優先する。塞栓の実際では、main trunkの近位での塞栓（proximal）と末梢枝の選択的塞栓（superselective）があり、臀筋・殿部の虚血や神経障害を避けるため、可能な限り選択的塞栓が望ましい。両側内腸骨動脈の完全塞栓は骨盤内臓器・殿部の虚血を招くため、必要性と範囲を絞る。また、pre-peritoneal packingは不安定な骨盤内血腫に対する塞栓までのbridgeとして有用である。","detp":["骨盤損傷で持続出血の臨床徴候がある患者、または内腸骨動脈およびその分枝からの血管外漏出を画像で認める患者には、塞栓術による血管内治療が推奨される（エビデンスレベルB）。骨盤外傷では、内腸骨動脈領域からの動脈性出血が持続出血の主要原因となる。初期管理は蘇生、骨盤の機械的安定化（骨盤binder、外固定）、骨盤外の出血源の同定と治療であり、これらと並行して血管造影・塞栓術の適応を判断する。","骨盤血管造影と塞栓術は、出血の臨床徴候と動脈性の血管外漏出（あるいは偽動脈瘤、血管のabrupt cutoffといった間接所見）を有する患者群に利益をもたらす。内腸骨動脈は片側であれば結紮可能であり、両側結紮はまれであるが、血行動態の破綻した症例では止血を優先する。塞栓の実際では、main trunkの近位での塞栓（proximal）と末梢枝の選択的塞栓（superselective）があり、臀筋・殿部の虚血や神経障害を避けるため、可能な限り選択的塞栓が望ましい。","両側内腸骨動脈の完全塞栓は骨盤内臓器・殿部の虚血を招くため、必要性と範囲を絞る。また、pre-peritoneal packingは不安定な骨盤内血腫に対する塞栓までのbridgeとして有用である。"]},{"n":72,"ja":"腸管灌流の早期回復のため、Grade X 上腸間膜動脈損傷に血管内ステント/ステントグラフト修復を考慮してもよい","en":"Endovascular stent or stent graft repair may be considered for ESVS Grade X superior mesenteric artery injury to achieve early restoration of bowel perfusion.","cls":"IIb","lvl":"C","sec":"腹部","page":32,"det":"腸管灌流の早期回復を目的として、ESVS Grade X（閉塞）の上腸間膜動脈（SMA）損傷に血管内ステントまたはステントグラフト修復を考慮してもよいとされる。SMA損傷はダメージコントロールの状況では、可能なら一次修復が最良であるが、不可能な場合は一時的血管シャントが提案される（ただし損傷のレベルにより留置が困難なことがある）。メサンター血管外傷のopen surgery・血管内治療に関する現代の文献は不十分である。\n\nSMA閉塞は腸管虚血を急速に進行させ、広範な腸管切除を招くため、血流の早期回復が転帰を左右する。血管内治療は、①循環が比較的安定している、②血栓性閉塞で血栓除去・ステントが可能、③腹部所見がまだ腹膜刺激症状を呈していない（腸管壊死が確立していない）症例で有力な選択肢となる。一方、明らかな腸管壊死や腹膜炎がある場合は、開腹して腸管のviabilityを評価し、壊死腸管の切除と血行再建を同時に行う必要がある。実務では、血管内治療後に必ず腸管のviability評価（腹部所見、乳酸値、必要ならsecond look laparotomy）を行い、遅発性の腸管狭窄や虚血性腸炎の出現にも注意する。","detp":["腸管灌流の早期回復を目的として、ESVS Grade X（閉塞）の上腸間膜動脈（SMA）損傷に血管内ステントまたはステントグラフト修復を考慮してもよいとされる。SMA損傷はダメージコントロールの状況では、可能なら一次修復が最良であるが、不可能な場合は一時的血管シャントが提案される（ただし損傷のレベルにより留置が困難なことがある）。メサンター血管外傷のopen surgery・血管内治療に関する現代の文献は不十分である。","SMA閉塞は腸管虚血を急速に進行させ、広範な腸管切除を招くため、血流の早期回復が転帰を左右する。血管内治療は、①循環が比較的安定している、②血栓性閉塞で血栓除去・ステントが可能、③腹部所見がまだ腹膜刺激症状を呈していない（腸管壊死が確立していない）症例で有力な選択肢となる。一方、明らかな腸管壊死や腹膜炎がある場合は、開腹して腸管のviabilityを評価し、壊死腸管の切除と血行再建を同時に行う必要がある。","実務では、血管内治療後に必ず腸管のviability評価（腹部所見、乳酸値、必要ならsecond look laparotomy）を行い、遅発性の腸管狭窄や虚血性腸炎の出現にも注意する。"]},{"n":73,"ja":"下腸間膜動脈損傷の治療には結紮を推奨する","en":"Ligation is recommended for treatment of inferior mesenteric artery injury.","cls":"I","lvl":"C","sec":"腹部","page":32,"det":"下腸間膜動脈（IMA）損傷の治療には結紮が推奨される。IMAは上行結腸から左結腸への側副血行が豊富で（Riolan弓、辺縁動脈を通じたSMA優位の血流）、結紮しても腸管虚血は通常生じない。緊急開腹でIMAからの出血に遭遇した場合、再建に時間をかけるより結紮で止血し、他の致死的損傷の処理に資源を振り向けるほうが合理的である。\n\nただし、例外的な注意点として、①SMAが閉塞または損傷されている、②腹部大動脈の置換や広範な腸骨動脈病変で下腸間膜動脈が重要な側副路になっている、③炎症性腸疾患や既存の虚血性腸炎がある、といった症例では結紮後の腸管虚血リスクが上昇する。このような場合は、腸管のviabilityを慎重に評価し、可能なら再建やバイパスを検討する。実務では、結紮後に左結腸の色調・蠕動・辺縁動脈の拍動を確認し、疑わしければsecond look laparotomyを計画する。IMAの結紮は外傷領域では比較的頻用される安全な手段であり、その判断の裏付けとして側副血行の理解が重要となる。ただし、SMAが閉塞・損傷されている、腹部大動脈の置換や広範な腸骨動脈病変でIMAが重要な側副路になっている、炎症性腸疾患や既存の虚血性腸炎があるといった例では結紮後の腸管虚血リスクが上昇する。その場合は腸管のviabilityを慎重に評価し、可能なら再建やバイパスを検討する。","detp":["下腸間膜動脈（IMA）損傷の治療には結紮が推奨される。IMAは上行結腸から左結腸への側副血行が豊富で（Riolan弓、辺縁動脈を通じたSMA優位の血流）、結紮しても腸管虚血は通常生じない。緊急開腹でIMAからの出血に遭遇した場合、再建に時間をかけるより結紮で止血し、他の致死的損傷の処理に資源を振り向けるほうが合理的である。ただし、例外的な注意点として、①SMAが閉塞または損傷されている、②腹部大動脈の置換や広範な腸骨動脈病変で下腸間膜動脈が重要な側副路になっている、③炎症性腸疾患や既存の虚血性腸炎がある、といった症例では結紮後の腸管虚血リスクが上昇する。","このような場合は、腸管のviabilityを慎重に評価し、可能なら再建やバイパスを検討する。実務では、結紮後に左結腸の色調・蠕動・辺縁動脈の拍動を確認し、疑わしければsecond look laparotomyを計画する。IMAの結紮は外傷領域では比較的頻用される安全な手段であり、その判断の裏付けとして側副血行の理解が重要となる。ただし、SMAが閉塞・損傷されている、腹部大動脈の置換や広範な腸骨動脈病変でIMAが重要な側副路になっている、炎症性腸疾患や既存の虚血性腸炎があるといった例では結紮後の腸管虚血リスクが上昇する。","その場合は腸管のviabilityを慎重に評価し、可能なら再建やバイパスを検討する。"]},{"n":74,"ja":"CTAで同定された血行遮断された片側腎の血行再建は推奨しない","en":"Revascularisation of a devascularised unilateral kidney identified on computed tomography angiography is not recommended.","cls":"IIIb","lvl":"C","sec":"腹部","page":32,"det":"CTAで同定された血行遮断（devascularised）された片側腎の血行再建は推奨されない。CTAで診断された血流の途絶した腎は、温阻血時間が常に長すぎて不可逆的な腎障害に至っているため、ステント留置や再建の利益は見込めない。これは腎の虚血耐性（温阻血でおおよそ30〜60分、それ以降は不可逆的変化が進行）と、外傷例では受傷から画像診断、さらに治療開始までに時間がかかるという現実による。\n\nしたがって、片側の主腎動脈閉塞（ESVS Grade X）や片側の完全な血流途絶は、通常は非手術的に管理し、腎摘出も急性期には行わない。腎摘出を検討するのは、①血行動態が不安定で腎出血の制御が必要、②感染・膿瘍などの合併症が生じた、③高血圧が難治性、といった場合である。一方で、両側の損傷や単腎（solitary kidney）の場合は話が変わり、救済可能な腎ではopenまたは血管内の再建が推奨される（推奨78）。実務では、残存腎機能（対側腎のサイズと造影効果、血清クレアチニン）を評価し、長期的な腎機能予後を見据えた説明を行う。したがって片側の主腎動脈閉塞や完全な血流途絶は通常は非手術的に管理し、腎摘出も急性期には行わない。腎摘出を検討するのは、血行動態が不安定で腎出血の制御が必要、感染・膿瘍などの合併症が生じた、高血圧が難治性といった場合である。両側損傷や単腎では話が変わり、救済可能な腎では再建が推奨される。","detp":["CTAで同定された血行遮断（devascularised）された片側腎の血行再建は推奨されない。CTAで診断された血流の途絶した腎は、温阻血時間が常に長すぎて不可逆的な腎障害に至っているため、ステント留置や再建の利益は見込めない。これは腎の虚血耐性（温阻血でおおよそ30〜60分、それ以降は不可逆的変化が進行）と、外傷例では受傷から画像診断、さらに治療開始までに時間がかかるという現実による。","したがって、片側の主腎動脈閉塞（ESVS Grade X）や片側の完全な血流途絶は、通常は非手術的に管理し、腎摘出も急性期には行わない。腎摘出を検討するのは、①血行動態が不安定で腎出血の制御が必要、②感染・膿瘍などの合併症が生じた、③高血圧が難治性、といった場合である。一方で、両側の損傷や単腎（solitary kidney）の場合は話が変わり、救済可能な腎ではopenまたは血管内の再建が推奨される（推奨78）。","実務では、残存腎機能（対側腎のサイズと造影効果、血清クレアチニン）を評価し、長期的な腎機能予後を見据えた説明を行う。したがって片側の主腎動脈閉塞や完全な血流途絶は通常は非手術的に管理し、腎摘出も急性期には行わない。腎摘出を検討するのは、血行動態が不安定で腎出血の制御が必要、感染・膿瘍などの合併症が生じた、高血圧が難治性といった場合である。両側損傷や単腎では話が変わり、救済可能な腎では再建が推奨される。"]},{"n":75,"ja":"血力学的に安定したGrade 3腎動脈損傷患者には、openまたは血管内腎動脈修復を考慮すべき","en":"Open or endovascular renal artery repair should be considered for haemodynamically stable patients and ESVS Grade 3 renal artery injury.","cls":"IIa","lvl":"C","sec":"腹部","page":32,"det":"血力学的に安定したESVS Grade 3の腎動脈損傷患者には、openまたは血管内の腎動脈修復を考慮すべきとされる。術中に同定された腎血管損傷は、一次修復またはグラフトによる再建が可能である。腎血管損傷の程度、健側腎の大きさと正常性、患者の生理状態と血行動態の安定性が、腎摘出が最良の選択かどうかを左右する。単腎や両側損傷の患者では、永久に腎不全となることを避ける目的で腎動脈修復が報告されている。\n\n血管内治療としては、破裂例（Grade 3）、偽動脈瘤（Grade 2）、flow limiting dissection（Grade 1）に対するステントグラフトまたはステント留置が報告されており、segmental・cortical arteryの限局性出血には塞栓術が最良の選択肢とされる。実務では、①腎のviability（造影効果、実質の厚み、分節的な灌流欠損の範囲）、②温阻血時間、③対側腎の機能、④患者の全身状態を評価して、修復か腎摘出かを決める。修復後は腎機能、血圧、画像フォローアップ（狭窄・血栓・偽動脈瘤の再発）を継続し、腎血管性高血圧の出現に注意する。実務では、腎のviability（造影効果、実質の厚み、分節的な灌流欠損の範囲）、温阻血時間、対側腎の機能、患者の全身状態を評価して修復か腎摘出かを決める。修復後は腎機能、血圧、画像フォローアップ（狭窄・血栓・偽動脈瘤の再発）を継続し、腎血管性高血圧の出現に注意する。","detp":["血力学的に安定したESVS Grade 3の腎動脈損傷患者には、openまたは血管内の腎動脈修復を考慮すべきとされる。術中に同定された腎血管損傷は、一次修復またはグラフトによる再建が可能である。腎血管損傷の程度、健側腎の大きさと正常性、患者の生理状態と血行動態の安定性が、腎摘出が最良の選択かどうかを左右する。単腎や両側損傷の患者では、永久に腎不全となることを避ける目的で腎動脈修復が報告されている。","血管内治療としては、破裂例（Grade 3）、偽動脈瘤（Grade 2）、flow limiting dissection（Grade 1）に対するステントグラフトまたはステント留置が報告されており、segmental・cortical arteryの限局性出血には塞栓術が最良の選択肢とされる。実務では、①腎のviability（造影効果、実質の厚み、分節的な灌流欠損の範囲）、②温阻血時間、③対側腎の機能、④患者の全身状態を評価して、修復か腎摘出かを決める。","修復後は腎機能、血圧、画像フォローアップ（狭窄・血栓・偽動脈瘤の再発）を継続し、腎血管性高血圧の出現に注意する。実務では、腎のviability（造影効果、実質の厚み、分節的な灌流欠損の範囲）、温阻血時間、対側腎の機能、患者の全身状態を評価して修復か腎摘出かを決める。修復後は腎機能、血圧、画像フォローアップ（狭窄・血栓・偽動脈瘤の再発）を継続し、腎血管性高血圧の出現に注意する。"]},{"n":76,"ja":"血力学的に不安定な重度腎動脈損傷(Grade 3)患者には、腎摘同時の有無にかかわらず腎動脈結紮を推奨する","en":"Ligation of the renal artery, with or without simultaneous nephrectomy, is recommended in a haemodynamically unstable patient with severe renal artery injury (ESVS Grade 3).","cls":"I","lvl":"C","sec":"腹部","page":32,"det":"血力学的に不安定な重度腎動脈損傷（ESVS Grade 3）患者には、腎摘出を同時に行うか否かにかかわらず、腎動脈の結紮が推奨される。循環が破綻している状況では、複雑で時間のかかる腎血管再建は出血の遷延と死亡のリスクを高める。片側の腎であれば、対側腎が正常に機能していれば結紮しても生命予後への影響は限定的であり、止血を最優先とするダメージコントロールの原則に沿った判断である。\n\n実務では、①患側腎への血流を止めることで止血を得る、②腎摘出は、腎実質が広範に破壊され、感染や膿瘍の危険が高い場合、あるいは血腫の制御に必要でない限り急がない、③術後に腎機能（血清クレアチニン、尿量）と血圧をモニタリングし、対側腎の状態を画像で確認する、という流れになる。両側損傷や単腎の場合にはこの推奨は当てはまらず、可能な限り腎温存を目指した修復（推奨78）を優先する。すなわち、この推奨は「片側腎＋不安定」という条件付きの判断であり、腎を犠牲にすることで全身の止血を得るというトレードオフを明示している。実務では、患側腎への血流を止めることで止血を得たうえで、腎摘出は腎実質が広範に破壊され感染の危険が高い場合などに限り、止血が得られていれば急がない。術後に腎機能と血圧をモニタリングし、対側腎の状態を画像で確認する。両側損傷や単腎ではこの推奨は当てはまらず、腎温存を目指した修復が優先される。","detp":["血力学的に不安定な重度腎動脈損傷（ESVS Grade 3）患者には、腎摘出を同時に行うか否かにかかわらず、腎動脈の結紮が推奨される。循環が破綻している状況では、複雑で時間のかかる腎血管再建は出血の遷延と死亡のリスクを高める。片側の腎であれば、対側腎が正常に機能していれば結紮しても生命予後への影響は限定的であり、止血を最優先とするダメージコントロールの原則に沿った判断である。実務では、①患側腎への血流を止めることで止血を得る、②腎摘出は、腎実質が広範に破壊され、感染や膿瘍の危険が高い場合、あるいは血腫の制御に必要でない限り急がない、③術後に腎機能（血清クレアチニン、尿量）と血圧をモニタリングし、対側腎の状態を画像で確認する、という流れになる。","両側損傷や単腎の場合にはこの推奨は当てはまらず、可能な限り腎温存を目指した修復（推奨78）を優先する。すなわち、この推奨は「片側腎＋不安定」という条件付きの判断であり、腎を犠牲にすることで全身の止血を得るというトレードオフを明示している。実務では、患側腎への血流を止めることで止血を得たうえで、腎摘出は腎実質が広範に破壊され感染の危険が高い場合などに限り、止血が得られていれば急がない。","術後に腎機能と血圧をモニタリングし、対側腎の状態を画像で確認する。両側損傷や単腎ではこの推奨は当てはまらず、腎温存を目指した修復が優先される。"]},{"n":77,"ja":"血力学的に安定した腎動脈Grade 2損傷(偽動脈瘤など)患者には、血管内ステントグラフト修復を考慮すべき","en":"Endovascular stent graft repair should be considered for haemodynamically stable patients with ESVS Grade 2 injury (e.g., pseudoaneurysm) of the renal artery.","cls":"IIa","lvl":"C","sec":"腹部","page":32,"det":"血力学的に安定した腎動脈のESVS Grade 2損傷（偽動脈瘤など）患者には、血管内ステントグラフト修復を考慮すべきとされる。Grade 2は外壁輪郭の異常を伴うが出血がcontainedされている状態で、循環が安定しているため、血管内治療の準備と施行に必要な時間を確保できる。ステントグラフトまたはステント留置は低侵襲で、腎実質を温存しながら病変を被覆できる。\n\n適応の判断では、①偽動脈瘤のサイズと増大傾向、②腎動脈の本幹か分枝か（分枝病変は選択的塞栓が優先されることが多い）、③腎実質の灌流に与える影響、④landing zoneの確保が可能か、を評価する。塞栓は限局性の出血やsegmental arteryの病変に適し、ステントグラフトは本幹の損傷やflow limiting dissectionに適する。術後は腎機能と血圧の推移、画像でのステント開存とエンドリークの有無を確認する。なお、血行動態が破綻した場合や、病変が急速に増大している場合にはopen repairへの転換を躊躇しない。適応の判断では、偽動脈瘤のサイズと増大傾向、腎動脈の本幹か分枝か（分枝病変は選択的塞が優先されることが多い）、腎実質の灌流に与える影響、landing zoneの確保が可能かを評価する。術後は腎機能と血圧の推移、画像でのステント開存とエンドリークの有無を確認する。","detp":["血力学的に安定した腎動脈のESVS Grade 2損傷（偽動脈瘤など）患者には、血管内ステントグラフト修復を考慮すべきとされる。Grade 2は外壁輪郭の異常を伴うが出血がcontainedされている状態で、循環が安定しているため、血管内治療の準備と施行に必要な時間を確保できる。ステントグラフトまたはステント留置は低侵襲で、腎実質を温存しながら病変を被覆できる。適応の判断では、①偽動脈瘤のサイズと増大傾向、②腎動脈の本幹か分枝か（分枝病変は選択的塞栓が優先されることが多い）、③腎実質の灌流に与える影響、④landing zoneの確保が可能か、を評価する。","塞栓は限局性の出血やsegmental arteryの病変に適し、ステントグラフトは本幹の損傷やflow limiting dissectionに適する。術後は腎機能と血圧の推移、画像でのステント開存とエンドリークの有無を確認する。なお、血行動態が破綻した場合や、病変が急速に増大している場合にはopen repairへの転換を躊躇しない。適応の判断では、偽動脈瘤のサイズと増大傾向、腎動脈の本幹か分枝か（分枝病変は選択的塞が優先されることが多い）、腎実質の灌流に与える影響、landing zoneの確保が可能かを評価する。","術後は腎機能と血圧の推移、画像でのステント開存とエンドリークの有無を確認する。"]},{"n":78,"ja":"両側Grade 2/3/X腎動脈損傷、または救済可能な単腎の場合、open/血管内腎動脈修復を推奨する","en":"Open or endovascular renal artery repair is recommended for patients with bilateral ESVS Grade 2, 3, or X renal artery injuries or if there is a solitary salvageable kidney.","cls":"I","lvl":"C","sec":"腹部","page":33,"det":"両側のESVS Grade 2、3、Xの腎動脈損傷、まは救済可能な単腎が存在する場合には、openまたは血管内の腎動脈修復が推奨される。両側損傷や単腎では、腎動脈を結紮・犠牲にすると無尿性腎不全となり透析導入が必要となるため、腎温存の優先度が格段に上がる。したがって、片側損傷で不安定な場合に結紮を選ぶ（推奨76）のとは判断が逆になる。\n\n実務では、①温阻血時間を意識した迅速な血流回復（shuntや一時的バイパスも選択肢）、②自家静脈による再建を優先し、腎動脈の口径が小さい場合はinterposition graft、③両側同時修復が困難な場合は、よりviabilityの高い側を優先して修復し、対側はsecond lookで評価する、④術後は集中的な腎機能管理（電解質、容量、透析の要否）を行う、という流れになる。血管内治療は解剖が適合する症例に限られ、緊急のバイパスや血栓摘除にはopenが適する。いずれにせよ、治療方針は泌尿器科・血管外科・IVR・集中治療の合同で決定することが望ましい。実務では、温阻血時間を意識した迅速な血流回復、自家静脈を優先した再建、両側同時修復が困難な場合にviabilityの高い側を優先して修復し対側をsecond lookで評価する判断、術後の集中管理（電解質、容量、透析の要否）が要点となる。方針は泌尿器科・血管外科・IVR・集中治療の合同で決めることが望ましい。","detp":["両側のESVS Grade 2、3、Xの腎動脈損傷、まは救済可能な単腎が存在する場合には、openまたは血管内の腎動脈修復が推奨される。両側損傷や単腎では、腎動脈を結紮・犠牲にすると無尿性腎不全となり透析導入が必要となるため、腎温存の優先度が格段に上がる。したがって、片側損傷で不安定な場合に結紮を選ぶ（推奨76）のとは判断が逆になる。実務では、①温阻血時間を意識した迅速な血流回復（shuntや一時的バイパスも選択肢）、②自家静脈による再建を優先し、腎動脈の口径が小さい場合はinterposition graft、③両側同時修復が困難な場合は、よりviabilityの高い側を優先して修復し、対側はsecond lookで評価する、④術後は集中的な腎機能管理（電解質、容量、透析の要否）を行う、という流れになる。","血管内治療は解剖が適合する症例に限られ、緊急のバイパスや血栓摘除にはopenが適する。いずれにせよ、治療方針は泌尿器科・血管外科・IVR・集中治療の合同で決定することが望ましい。実務では、温阻血時間を意識した迅速な血流回復、自家静脈を優先した再建、両側同時修復が困難な場合にviabilityの高い側を優先して修復し対側をsecond lookで評価する判断、術後の集中管理（電解質、容量、透析の要否）が要点となる。","方針は泌尿器科・血管外科・IVR・集中治療の合同で決めることが望ましい。"]},{"n":79,"ja":"修復が容易に達成できない腹部静脈損傷には静脈結紮を推奨する","en":"Vein ligation is recommended for abdominal venous injury if repair is not easily achievable.","cls":"I","lvl":"C","sec":"腹部","page":33,"det":"修復が容易に達成できない腹部静脈損傷には、静脈結紮が推奨される。腹部の静脈損傷は、その解剖学的複雑さとlow pressure系であることから制御が難しく、出血が制御できれば結紮で管理できる部位が多い。外傷患者の破綻した生理と合併損傷のため、open surgical damage controlの一環として下大静脈（IVC）の結紮が行われることもあり、許容できる転帰が得られている。系統的レビューでは、IVC損傷の結紮は死亡率の増加と関連したとの報告もあるが、これは重症度による選択バイアスを含む。\n\n実務では、①IVCのinfrarenal損傷は結紮が比較的許容され、腎静脈より中枢側（suprarenal、retrohepatic）では側副路が乏しくうっ血と腎機能障害の危険が高い、②門脈・上腸間膜静脈は可能な限り修復を優先し、結紮は広範な腸管うっ血を招く、③片側腸骨静脈の結紮は対側の開存が前提で、両側結紮は重篤な下肢うっ血を招く、④大腿・膝窩静脈は安定例で修復を考慮する（推奨95）、⑤修復する場合は、静脈の低圧系に適した繊細な縫合と、必要に応じてパッチやグラフトを用いる。結紮後の下肢腫脹・コンパートメント症候群の出現に注意し、弾性ストッキングや挙上で対応する。","detp":["修復が容易に達成できない腹部静脈損傷には、静脈結紮が推奨される。腹部の静脈損傷は、その解剖学的複雑さとlow pressure系であることから制御が難しく、出血が制御できれば結紮で管理できる部位が多い。外傷患者の破綻した生理と合併損傷のため、open surgical damage controlの一環として下大静脈（IVC）の結紮が行われることもあり、許容できる転帰が得られている。","系統的レビューでは、IVC損傷の結紮は死亡率の増加と関連したとの報告もあるが、これは重症度による選択バイアスを含む。実務では、①IVCのinfrarenal損傷は結紮が比較的許容され、腎静脈より中枢側（suprarenal、retrohepatic）では側副路が乏しくうっ血と腎機能障害の危険が高い、②門脈・上腸間膜静脈は可能な限り修復を優先し、結紮は広範な腸管うっ血を招く、③片側腸骨静脈の結紮は対側の開存が前提で、両側結紮は重篤な下肢うっ血を招く、④大腿・膝窩静脈は安定例で修復を考慮する（推奨95）、⑤修復する場合は、静脈の低圧系に適した繊細な縫合と、必要に応じてパッチやグラフトを用いる。","結紮後の下肢腫脹・コンパートメント症候群の出現に注意し、弾性ストッキングや挙上で対応する。"]},{"n":80,"ja":"血力学的に安定し安定した後腹膜血腫を伴う下大静脈損傷には、綿密な観察とフォローアップ画像の非手術管理を考慮すべき","en":"Non-operative management with close observation and follow up imaging should be considered in haemodynamically stable patients with inferior vena cava injury and a stable retroperitoneal haematoma (not expanding and not actively bleeding).","cls":"IIa","lvl":"C","sec":"腹部","page":33,"det":"血力学的に安定し、安定した後腹膜血腫を伴う下大静脈（IVC）損傷には、綿密な観察とフォローアップ画像による非手術管理を考慮すべきとされる。血行動態が安定し、後腹膜血腫が拡大せず活動性出血もない患者では、非手術管理が可能であることが症例報告で示されている。IVC損傷の死亡率は解剖学的レベルにより異なり、infrarenalの損傷は転帰がより良好である。\n\nこの戦略の前提は、①血腫が安定していること（画像での反復評価）、②循環が安定していること、③抗凝固療法を要する合併損傷（頭部外傷、実質臓器損傷）の有無を踏まえた出血リスクの評価、である。経過中に血腫の増大、貧血の進行、血行動態の破綻が生じれば、血管内治療（ステントグラフト）またはopen repairへ移行する。ステントグラフトはopen repairの代替候補として考えられており、PROOVITレジストリでもIVC損傷に対する使用は2%未満と限られている。修復が必要な場合は、ある程度の狭窄を許容した連続縫合による単純修復が可能で、大きな欠損はシャントで一時的に制御するか結紮する。この戦略の前提は、血腫が安定していること（画像での反復評価）、循環が安定していること、抗凝固療法を要する合併損傷の有無を踏まえた出血リスクの評価である。経過中に血腫の増大、貧血の進行、血行動態の破綻が生じれば、血管内治療またはopen repairへ移行する。","detp":["血力学的に安定し、安定した後腹膜血腫を伴う下大静脈（IVC）損傷には、綿密な観察とフォローアップ画像による非手術管理を考慮すべきとされる。血行動態が安定し、後腹膜血腫が拡大せず活動性出血もない患者では、非手術管理が可能であることが症例報告で示されている。IVC損傷の死亡率は解剖学的レベルにより異なり、infrarenalの損傷は転帰がより良好である。この戦略の前提は、①血腫が安定していること（画像での反復評価）、②循環が安定していること、③抗凝固療法を要する合併損傷（頭部外傷、実質臓器損傷）の有無を踏まえた出血リスクの評価、である。","経過中に血腫の増大、貧血の進行、血行動態の破綻が生じれば、血管内治療（ステントグラフト）またはopen repairへ移行する。ステントグラフトはopen repairの代替候補として考えられており、PROOVITレジストリでもIVC損傷に対する使用は2%未満と限られている。修復が必要な場合は、ある程度の狭窄を許容した連続縫合による単純修復が可能で、大きな欠損はシャントで一時的に制御するか結紮する。","この戦略の前提は、血腫が安定していること（画像での反復評価）、循環が安定していること、抗凝固療法を要する合併損傷の有無を踏まえた出血リスクの評価である。経過中に血腫の増大、貧血の進行、血行動態の破綻が生じれば、血管内治療またはopen repairへ移行する。"]},{"n":81,"ja":"下大静脈損傷の管理にatriocaval shuntは適応ではない","en":"Atriocaval shunting is not indicated in the management of inferior vena cava injuries.","cls":"IIIa","lvl":"C","sec":"腹部","page":34,"det":"下大静脈（IVC）損傷の管理において、atriocaval shuntは適応ではないとされる。atriocaval shuntは、IVCの肝後部（retrohepatic）損傷に対して、右心房かIVC内にバルーン付きチューブを挿入して血流を迂回させる手技で、歴史的に試みられてきたが、報告例の転帰は不良であり、有用性を示すエビデンスが欠如している。手技自体が複雑で時間を要し、外傷急性期の破綻した生理状態では現実的でない。\n\n現在の実務では、肝後部IVC損傷に対しては、①Pringle法や肝のmobilization（右葉の授動）による露出、②大動脈のclampによる中枢側制御、③パッキングやバルーンカテーテルによる一時的制御、④可能なら側壁縫合、困難なら結紮やパッキングでのダメージコントロール、といった手段が用いられる。IVCの結紮は、infrarenalであれば比較的許容される（推奨79の関連）。この推奨は「歴史的に行われてきた手技でも、転帰とエビデンスが伴わなければ適応としない」という、ガイドラインの姿勢を示す例である。現在の実務では、肝後部IVC損傷に対して、Pringle法や肝右葉の授動による露出、大動脈遮断による中枢側制御、パッキングやバルーンカテーテルによる一時的制御、可能なら側壁縫合、困難なら結紮やパッキングでのダメージコントロールが用いられる。歴史的に行われてきた手技でも、転帰とエビデンスが伴わなければ適応としないという姿勢の例である。","detp":["下大静脈（IVC）損傷の管理において、atriocaval shuntは適応ではないとされる。atriocaval shuntは、IVCの肝後部（retrohepatic）損傷に対して、右心房かIVC内にバルーン付きチューブを挿入して血流を迂回させる手技で、歴史的に試みられてきたが、報告例の転帰は不良であり、有用性を示すエビデンスが欠如している。手技自体が複雑で時間を要し、外傷急性期の破綻した生理状態では現実的でない。","現在の実務では、肝後部IVC損傷に対しては、①Pringle法や肝のmobilization（右葉の授動）による露出、②大動脈のclampによる中枢側制御、③パッキングやバルーンカテーテルによる一時的制御、④可能なら側壁縫合、困難なら結紮やパッキングでのダメージコントロール、といった手段が用いられる。IVCの結紮は、infrarenalであれば比較的許容される（推奨79の関連）。","この推奨は「歴史的に行われてきた手技でも、転帰とエビデンスが伴わなければ適応としない」という、ガイドラインの姿勢を示す例である。現在の実務では、肝後部IVC損傷に対して、Pringle法や肝右葉の授動による露出、大動脈遮断による中枢側制御、パッキングやバルーンカテーテルによる一時的制御、可能なら側壁縫合、困難なら結紮やパッキングでのダメージコントロールが用いられる。歴史的に行われてきた手技でも、転帰とエビデンスが伴わなければ適応としないという姿勢の例である。"]},{"n":82,"ja":"出血性・虚血性血管損傷を同定するため、すべての四肢外傷患者に綿密な臨床的血管診察を推奨する","en":"Careful clinical vascular examination is recommended in all patients with extremity trauma to identify potential haemorrhagic or ischaemic vascular injuries.","cls":"I","lvl":"C","sec":"四肢","page":35,"det":"出血性または虚血性の血管損傷を同定するため、すべての四肢外傷患者に綿密な臨床的血管診察が推奨される。四肢血管外傷では、活動性出血（外部への出血、拡大する血腫）または触知不能な脈拍が、臨床的に有意な血管損傷（ESVS Grade 2またはX）の指標となる。しかし、これらの徴候がないことは血管損傷を除外しない。損傷肢と健側肢の両方を診察し、末梢脈拍の触知、毛細血管再充満時間、蒼白、感覚異常、疼痛、麻痺を系統的に評価する。\n\n特に、肘関節・膝関節の脱臼に伴う神経損傷は血管評価を妨げるため注意する。上肢・下肢のいずれでも末梢脈拍が容易に触知できることは、大規模な後ろ向き研究で示されているように、有意な血管損傷を除外するうえで重要である。逆に、末梢脈拍が容易に触知できない場合には、動脈損傷を除外するために速やかに画像検査を行う。実務では、整復前後の診察を必ず記録し（脈拍、ABIは診断に用いない［推奨83］が参考所見として記載）、経時的な変化を追うことが見逃しを防ぐ。実務では、整復前後の診察を必ず記録し（脈拍、ABIは診断に用いないが参考所見として記載）、経時的な変化を追うことが見逃しを防ぐ。脈拍が触知できても、外傷性の内膜損傷や偽動脈瘤が後から顕在化することがあり、近接創や神経損傷の合併は画像検査へ進む判断材料となる。","detp":["出血性または虚血性の血管損傷を同定するため、すべての四肢外傷患者に綿密な臨床的血管診察が推奨される。四肢血管外傷では、活動性出血（外部への出血、拡大する血腫）または触知不能な脈拍が、臨床的に有意な血管損傷（ESVS Grade 2またはX）の指標となる。しかし、これらの徴候がないことは血管損傷を除外しない。損傷肢と健側肢の両方を診察し、末梢脈拍の触知、毛細血管再充満時間、蒼白、感覚異常、疼痛、麻痺を系統的に評価する。","特に、肘関節・膝関節の脱臼に伴う神経損傷は血管評価を妨げるため注意する。上肢・下肢のいずれでも末梢脈拍が容易に触知できることは、大規模な後ろ向き研究で示されているように、有意な血管損傷を除外するうえで重要である。逆に、末梢脈拍が容易に触知できない場合には、動脈損傷を除外するために速やかに画像検査を行う。実務では、整復前後の診察を必ず記録し（脈拍、ABIは診断に用いない［推奨83］が参考所見として記載）、経時的な変化を追うことが見逃しを防ぐ。","実務では、整復前後の診察を必ず記録し（脈拍、ABIは診断に用いないが参考所見として記載）、経時的な変化を追うことが見逃しを防ぐ。脈拍が触知できても、外傷性の内膜損傷や偽動脈瘤が後から顕在化することがあり、近接創や神経損傷の合併は画像検査へ進む判断材料となる。"]},{"n":83,"ja":"四肢外傷患者で血管損傷の診断・否定のためにABI(足関節上腕血圧比)は適応ではない","en":"An ankle brachial index is not indicated to diagnose or rule out vascular injury in patients with extremity trauma.","cls":"IIIa","lvl":"C","sec":"四肢","page":35,"det":"四肢外傷患者において、血管損傷の診断または否定のために足関節上腕血圧比（ABI）は適応ではないとされる。ABIの有用性を検討した複数の研究は、鈍的・穿通性のいずれにおいても有意な動脈損傷を除外する能力について相反する結果を報告している。経験ある医師による入念な診察と比べた付加価値は限られており、正確なABIを得るには時間と技能を要する。\n\n外傷急性期には、疼痛、冷感、体動、創部の状態、血圧の変動により測定値が不安定となり、偽陰性・偽陽性の両方が生じる。したがって「ABIが正常だから大丈夫」という判断は避ける。一方、ABIは慢性動脈疾患の評価や、経過観察中の補助指標としては有用であり、診療の場面を区別して用いる。実務では、診察で有意な血管損傷を否定できない場合には即時のCTA（推奨84）へ進むという流れを徹底し、ABIは「あれば参考にする」程度の位置づけにとどめる。外傷急性期には疼痛、冷感、体動、創部の状態、血圧の変動により測定値が不安定となり、偽陰性・偽陽性の両方が生じる。実務では、診察で有意な血管損傷を否定できない場合には即時のCTAへ進むという流れを徹底し、ABIは「あれば参考にする」程度の位置づけにとどめる。慢性動脈疾患の評価とは場面を区別する。","detp":["四肢外傷患者において、血管損傷の診断または否定のために足関節上腕血圧比（ABI）は適応ではないとされる。ABIの有用性を検討した複数の研究は、鈍的・穿通性のいずれにおいても有意な動脈損傷を除外する能力について相反する結果を報告している。経験ある医師による入念な診察と比べた付加価値は限られており、正確なABIを得るには時間と技能を要する。外傷急性期には、疼痛、冷感、体動、創部の状態、血圧の変動により測定値が不安定となり、偽陰性・偽陽性の両方が生じる。","したがって「ABIが正常だから大丈夫」という判断は避ける。一方、ABIは慢性動脈疾患の評価や、経過観察中の補助指標としては有用であり、診療の場面を区別して用いる。実務では、診察で有意な血管損傷を否定できない場合には即時のCTA（推奨84）へ進むという流れを徹底し、ABIは「あれば参考にする」程度の位置づけにとどめる。外傷急性期には疼痛、冷感、体動、創部の状態、血圧の変動により測定値が不安定となり、偽陰性・偽陽性の両方が生じる。","実務では、診察で有意な血管損傷を否定できない場合には即時のCTAへ進むという流れを徹底し、ABIは「あれば参考にする」程度の位置づけにとどめる。慢性動脈疾患の評価とは場面を区別する。"]},{"n":84,"ja":"臨床的血管診察(末梢動脈触知)で重要な血管損傷を否定できない四肢損傷患者には、即時CTAを第一画像法として推奨する","en":"Immediate computed tomography angiography is recommended as the primary imaging modality in patients with extremity injury where signi ficant vascular injury cannot be ruled out by clinical vascular examination (palpable peripheral pulses).","cls":"I","lvl":"C","sec":"四肢","page":35,"det":"臨床的血管診察（末梢動脈の触知）で有意な血管損傷を否定できない四肢損傷患者には、即時のCTAが第一画像法として推奨される。CTAは四肢の動脈損傷の検出において高い感受性と特異性を有する。重要なのは、画像検査が治療の遅延を生じないよう速やかに行われることであり、緊急例では画像を先行させずに直ちに治療を開始する。術前の画像検査が不可能な場合には、術中の血管造影が診断とopen/血管内アプローチの決定に有用である。\n\nMRIやduplex ultrasound（DUS）の役割は四肢血管外傷では十分に検討されていないが、偽動脈瘤や動静脈瘻が疑われる場合にはDUSが有用なことがある。実務では、①撮影範囲を損傷部位から上下の関節を越えて設定し、側副血行と末梢のrunoffまで評価する、②動脈相を主体とし、必要なら遅延相を追加する、③金属片によるアーチファクトがある場合は再構成で対応する、④所見は臨床像と突き合わせ、必要ならDSAや術中造影で補完する、という手順を標準化すると見逃しが減る。実務では、撮影範囲を損傷部位から上下の関節を越えて設定し側副血行と末梢のrunoffまで評価すること、動脈相を主体とし必要なら遅延相を追加すること、金属片によるアーチファクトは再構成で対応すること、所見は臨床像と突き合わせ必要ならDSAや術中造影で補完することを標準化すると見逃しが減る。","detp":["臨床的血管診察（末梢動脈の触知）で有意な血管損傷を否定できない四肢損傷患者には、即時のCTAが第一画像法として推奨される。CTAは四肢の動脈損傷の検出において高い感受性と特異性を有する。重要なのは、画像検査が治療の遅延を生じないよう速やかに行われることであり、緊急例では画像を先行させずに直ちに治療を開始する。術前の画像検査が不可能な場合には、術中の血管造影が診断とopen/血管内アプローチの決定に有用である。","MRIやduplex ultrasound（DUS）の役割は四肢血管外傷では十分に検討されていないが、偽動脈瘤や動静脈瘻が疑われる場合にはDUSが有用なことがある。実務では、①撮影範囲を損傷部位から上下の関節を越えて設定し、側副血行と末梢のrunoffまで評価する、②動脈相を主体とし、必要なら遅延相を追加する、③金属片によるアーチファクトがある場合は再構成で対応する、④所見は臨床像と突き合わせ、必要ならDSAや術中造影で補完する、という手順を標準化すると見逃しが減る。","実務では、撮影範囲を損傷部位から上下の関節を越えて設定し側副血行と末梢のrunoffまで評価すること、動脈相を主体とし必要なら遅延相を追加すること、金属片によるアーチファクトは再構成で対応すること、所見は臨床像と突き合わせ必要ならDSAや術中造影で補完することを標準化すると見逃しが減る。"]},{"n":85,"ja":"四肢血管外傷による急性虚血の臨床的証拠がある患者には、可能な限り入院1時間以内の血行再建を推奨する","en":"Revascularisation as soon as possible, ideally within one hour of admission, is recommended in patients with clinical evidence of acute ischaemia due to extremity vascular trauma.","cls":"I","lvl":"C","sec":"四肢","page":36,"det":"四肢血管外傷による急性虚血の臨床的証拠がある患者には、可能な限り早期の血行再建、理想的には入院から1時間以内の血行再建が推奨される。古典的な教訓では、主要動脈損傷（ESVS Grade X）による四肢虚血は発症（ほぼ受傷時点）から6時間までなら救肢可能とされてきたが、これは血栓塞栓症や動脈硬化による急性四肢虚血の臨床経験に基づくものである。血管外傷にこの閾値を適用した検討では、6時間を超える虚血時間が切断の独立した予後因子であることが示されている。\n\nさらに、米国の全国レジストリ研究では、受傷から血行再建のための手術室到着までの時間が45分以内の群で切断率が有意に低く、1〜3時間、3〜6時間の群と比較して差が示された。時間は、損傷重症度、受傷機転、年齢で調整した多変量解析でも救肢の有意な予測因子であった。米英の軍事的データセットでも、阻血時間と救肢成功の間に線形の関係が示され、受傷から血行再建までの1時間の遅延ごとに救肢成功の確率が減少し、阻血時間が1時間以内では救肢確率が最も高かった。ショックの存在は救肢失敗のリスクを2倍以上に高める。したがって、診断・搬送・準備の各段階で待ち時間を削り、手術室への直接搬入や並行作業を徹底することが、この推奨の実践的な意味である。","detp":["四肢血管外傷による急性虚血の臨床的証拠がある患者には、可能な限り早期の血行再建、理想的には入院から1時間以内の血行再建が推奨される。古典的な教訓では、主要動脈損傷（ESVS Grade X）による四肢虚血は発症（ほぼ受傷時点）から6時間までなら救肢可能とされてきたが、これは血栓塞栓症や動脈硬化による急性四肢虚血の臨床経験に基づくものである。血管外傷にこの閾値を適用した検討では、6時間を超える虚血時間が切断の独立した予後因子であることが示されている。","さらに、米国の全国レジストリ研究では、受傷から血行再建のための手術室到着までの時間が45分以内の群で切断率が有意に低く、1〜3時間、3〜6時間の群と比較して差が示された。時間は、損傷重症度、受傷機転、年齢で調整した多変量解析でも救肢の有意な予測因子であった。米英の軍事的データセットでも、阻血時間と救肢成功の間に線形の関係が示され、受傷から血行再建までの1時間の遅延ごとに救肢成功の確率が減少し、阻血時間が1時間以内では救肢確率が最も高かった。","ショックの存在は救肢失敗のリスクを2倍以上に高める。したがって、診断・搬送・準備の各段階で待ち時間を削り、手術室への直接搬入や並行作業を徹底することが、この推奨の実践的な意味である。"]},{"n":86,"ja":"患者の生理状態や骨格不安定性により時機を逃さず一次修復ができない場合、四肢血流を迅速に回復させる一時的血管シャントを推奨する","en":"The use of a temporary vascular shunt to rapidly restore blood flow in the extremity is recommended when timely primary de finitive vascular repair is not feasible due to patient physiology or skeletal instability.","cls":"I","lvl":"C","sec":"四肢","page":36,"det":"患者の生理状態や骨格の不安定性により、時機を逃さず一次的な確定的修復ができない場合には、四肢の血流を迅速に回復させる一時的血管シャントが推奨される。四肢血管外傷では、血流回復の遅れが直接切断率を上げるため（推奨85）、骨格の固定や軟部組織の処置を待つ間に血流を確保しておく戦略が有用である。シャントは、整形外科的固定の前や、静脈採取による再建の前のbridgeとして機能する。\n\n実務では、①inflowとbackflowの制御、②必要に応じたdistal thrombectomy、③短く口径の合ったシャントの選択（NGチューブや細い胸部ドレーンでも可、内径が血管と概ね一致することが条件）、④固定と創処置の間にシャントがkink・抜去されないよう配慮、⑤可能なら同一入院中、理想は初回手術中に確定的修復へ転換（推奨15）、という流れになる。シャント留置は血流を回復する一方で、閉塞・逸脱・塞栓のリスク（最大20%）を伴い、その後の修復の選択肢を変えうる。患者の生理が許せば一次修復を優先し、シャントは「時間を買う手段」として位置づける。シャント留置は血流を回復する一方で、閉塞・逸脱・塞栓のリスクを伴い、その後の修復の選択肢を変えうる。患者の生理が許せば一次修復を優先し、シャントは時間を買う手段として位置づけ、転換の時機を最初から計画しておくことが重要である。","detp":["患者の生理状態や骨格の不安定性により、時機を逃さず一次的な確定的修復ができない場合には、四肢の血流を迅速に回復させる一時的血管シャントが推奨される。四肢血管外傷では、血流回復の遅れが直接切断率を上げるため（推奨85）、骨格の固定や軟部組織の処置を待つ間に血流を確保しておく戦略が有用である。シャントは、整形外科的固定の前や、静脈採取による再建の前のbridgeとして機能する。実務では、①inflowとbackflowの制御、②必要に応じたdistal thrombectomy、③短く口径の合ったシャントの選択（NGチューブや細い胸部ドレーンでも可、内径が血管と概ね一致することが条件）、④固定と創処置の間にシャントがkink・抜去されないよう配慮、⑤可能なら同一入院中、理想は初回手術中に確定的修復へ転換（推奨15）、という流れになる。","シャント留置は血流を回復する一方で、閉塞・逸脱・塞栓のリスク（最大20%）を伴い、その後の修復の選択肢を変えうる。患者の生理が許せば一次修復を優先し、シャントは「時間を買う手段」として位置づける。シャント留置は血流を回復する一方で、閉塞・逸脱・塞栓のリスクを伴い、その後の修復の選択肢を変えうる。患者の生理が許せば一次修復を優先し、シャントは時間を買う手段として位置づけ、転換の時機を最初から計画しておくことが重要である。"]},{"n":87,"ja":"四肢温存か切断かの決定にスコアリングシステムを使用することは推奨しない","en":"The use of scoring systems when deciding upon limb salvage or amputation for patients with extremity trauma is not recommended.","cls":"IIIb","lvl":"B","sec":"四肢","page":36,"det":"四肢の温存か切断かの決定にスコアリングシステムを使用することは推奨されない（エビデンスレベルB）。複雑な四肢血管外傷において、血行再建か切断かの判断はきわめて難しい。損傷の形態だけでなく、患者因子、肢の因子、受傷機転、さらには局所の環境因子まで評価して治療を決める必要がある。MESS（Mangled Extremity Severity Score）やMESI（Mangled Extremity Syndrome Index）が代表的だが、いずれも後ろ向きデータから作成された。\n\n上肢では、大規模な系統的レビューでMESS単独では切断の必要性を正確に予測できないと示され、別のレビューも同様の結論である。MESIはより精密かもしれないが、単一の後ろ向き研究に基づく。下肢では、系統的レビューでMESSが最もよく用いられるスコアであるものの、機能的救肢の予測にも、切断か再建かの単独の判断にも有用でないと結論された。膝窩動脈単独損傷におけるdelayed amputationの予測にもならないとする後ろ向き研究もある。したがって、スコアは参考情報として用いるのはよいが、それ単独で切断を決定してはならない。判断は、患者の生理、阻血時間、合併損傷、神経損傷の程度、患者の希望と機能的要求、リハビリテーションの可能性を踏まえた多職種の協議（推奨88）で行う。","detp":["四肢の温存か切断かの決定にスコアリングシステムを使用することは推奨されない（エビデンスレベルB）。複雑な四肢血管外傷において、血行再建か切断かの判断はきわめて難しい。損傷の形態だけでなく、患者因子、肢の因子、受傷機転、さらには局所の環境因子まで評価して治療を決める必要がある。MESS（Mangled Extremity Severity Score）やMESI（Mangled Extremity Syndrome Index）が代表的だが、いずれも後ろ向きデータから作成された。","上肢では、大規模な系統的レビューでMESS単独では切断の必要性を正確に予測できないと示され、別のレビューも同様の結論である。MESIはより精密かもしれないが、単一の後ろ向き研究に基づく。下肢では、系統的レビューでMESSが最もよく用いられるスコアであるものの、機能的救肢の予測にも、切断か再建かの単独の判断にも有用でないと結論された。膝窩動脈単独損傷におけるdelayed amputationの予測にもならないとする後ろ向き研究もある。","したがって、スコアは参考情報として用いるのはよいが、それ単独で切断を決定してはならない。判断は、患者の生理、阻血時間、合併損傷、神経損傷の程度、患者の希望と機能的要求、リハビリテーションの可能性を踏まえた多職種の協議（推奨88）で行う。"]},{"n":88,"ja":"複雑四肢外傷患者では、血行再建 vs 一次切断について多職種意思決定を推奨する","en":"Multidisciplinary decision making regarding revascularisation vs. primary amputation is recommended in patients with complex extremity trauma.","cls":"I","lvl":"B","sec":"四肢","page":37,"det":"複雑四肢外傷患者では、血行再建か一次切断かについて多職種による意思決定が推奨される。複雑な四肢血管外傷におけるこの判断はきわめて困難で、損傷の形態だけでなく、患者因子と肢の因子、受傷機転、さらには局所の環境因子（搬送時間、施設の資源、戦争・災害状況）まで評価して治療を決める必要がある。スコアリングシステム単独での判断は推奨されない（推奨87）ため、判断の主軸は多職種・上級者による協議となる。\n\nPerkinsらの下肢血管再建のメタ解析では、切断の大幅な増加に関連する因子として、軟部組織損傷、コンパートメント症候群の存在、動脈損傷のレベル、損傷からの時間、合併骨折が同定された。要約すると、現代のスコアリングシステムを単独で救肢か切断かの決定に用いるべきではなく、肢の損傷範囲、虚血の程度、生理状態、患者全体の因子を考慮した多職種・上級者チームの決定を用いるべきとされる。実務では、血管外科・外傷外科・整形外科・形成外科・麻酔科・リハビリテーションが同一テーブルで、阻血時間と神経損傷の程度、患者の機能的要求と希望、義肢装具とリハビリの现实性を踏まえて結論を出す体制が望ましい。実務では、血管外科・外傷外科・整形外科・形成外科・麻酔科・リハビリテーションが同一テーブルで、阻血時間と神経損傷の程度、患者の機能的要求と希望、義肢装具とリハビリの現実性を踏まえて結論を出す体制が望ましい。判断が分かれる症例ほど、上級医を加えた記録の残る協議が必要となる。","detp":["複雑四肢外傷患者では、血行再建か一次切断かについて多職種による意思決定が推奨される。複雑な四肢血管外傷におけるこの判断はきわめて困難で、損傷の形態だけでなく、患者因子と肢の因子、受傷機転、さらには局所の環境因子（搬送時間、施設の資源、戦争・災害状況）まで評価して治療を決める必要がある。スコアリングシステム単独での判断は推奨されない（推奨87）ため、判断の主軸は多職種・上級者による協議となる。","Perkinsらの下肢血管再建のメタ解析では、切断の大幅な増加に関連する因子として、軟部組織損傷、コンパートメント症候群の存在、動脈損傷のレベル、損傷からの時間、合併骨折が同定された。要約すると、現代のスコアリングシステムを単独で救肢か切断かの決定に用いるべきではなく、肢の損傷範囲、虚血の程度、生理状態、患者全体の因子を考慮した多職種・上級者チームの決定を用いるべきとされる。実務では、血管外科・外傷外科・整形外科・形成外科・麻酔科・リハビリテーションが同一テーブルで、阻血時間と神経損傷の程度、患者の機能的要求と希望、義肢装具とリハビリの现实性を踏まえて結論を出す体制が望ましい。","実務では、血管外科・外傷外科・整形外科・形成外科・麻酔科・リハビリテーションが同一テーブルで、阻血時間と神経損傷の程度、患者の機能的要求と希望、義肢装具とリハビリの現実性を踏まえて結論を出す体制が望ましい。判断が分かれる症例ほど、上級医を加えた記録の残る協議が必要となる。"]},{"n":89,"ja":"四肢非閉塞性血管損傷(Grade 1/2)患者には、臨床・画像フォローアップ付き非手術管理を考慮してもよい","en":"Non-operative management with clinical and imaging follow up may be considered for patients with extremity non-occlusive vascular injuries (ESVS Grade 1 or 2).","cls":"IIb","lvl":"C","sec":"四肢","page":37,"det":"四肢の非閉塞性血管損傷（ESVS Grade 1/2）患者には、臨床・画像フォローアップ付きの非手術管理を考慮してもよい。非閉塞性損傷（flow limitingでない解離、内膜損傷、偽動脈瘤、動静脈瘻）は血管外科医にとって治療上のジレンマとなる。自然歴は十分に理解されておらず、管理方法に関するエビデンスは乏しく、研究は一般に非常に低品質であるため、確固たる推奨はできない。すべて症例研究または小規模後ろ向きseriesである。\n\nDennisらは非手術的に治療された非閉塞性四肢動脈損傷（内膜flap、狭窄、偽動脈瘤、1例の瘻）を追跡し、4例が1か月以内に臨床徴候を呈して手術を要した。残りのうち連絡が取れた患者は診察とDUSを受け、すべて無症状で残存狭窄は1例のみであった。Panらは非手術的に治療されなかった下肢外傷性偽動脈瘤をレビューし、Frykbergらは非閉塞性損傷を追跡して、平均数か月のフォローアップで大多数が治療不要、少数が悪化して即時介入を要したと報告した。したがって、非手術管理を選ぶ場合には「無条件の経過観察」ではなく、神経・灌流所見の定時評価と画像（DUSまたはCTA）による病変の安定性確認をセットで計画する。","detp":["四肢の非閉塞性血管損傷（ESVS Grade 1/2）患者には、臨床・画像フォローアップ付きの非手術管理を考慮してもよい。非閉塞性損傷（flow limitingでない解離、内膜損傷、偽動脈瘤、動静脈瘻）は血管外科医にとって治療上のジレンマとなる。自然歴は十分に理解されておらず、管理方法に関するエビデンスは乏しく、研究は一般に非常に低品質であるため、確固たる推奨はできない。すべて症例研究または小規模後ろ向きseriesである。","Dennisらは非手術的に治療された非閉塞性四肢動脈損傷（内膜flap、狭窄、偽動脈瘤、1例の瘻）を追跡し、4例が1か月以内に臨床徴候を呈して手術を要した。残りのうち連絡が取れた患者は診察とDUSを受け、すべて無症状で残存狭窄は1例のみであった。Panらは非手術的に治療されなかった下肢外傷性偽動脈瘤をレビューし、Frykbergらは非閉塞性損傷を追跡して、平均数か月のフォローアップで大多数が治療不要、少数が悪化して即時介入を要したと報告した。","したがって、非手術管理を選ぶ場合には「無条件の経過観察」ではなく、神経・灌流所見の定時評価と画像（DUSまたはCTA）による病変の安定性確認をセットで計画する。"]},{"n":90,"ja":"手術治療を要する四肢血管外傷(Grade 2/3/X)選択患者では、open repairの代替として血管内ステント/ステントグラフト修復を考慮してもよい","en":"Endovascular stent or stent graft repair may be considered as an alternative to open repair in selected patients with extremity vascular trauma requiring operative treatment (ESVS Grade 2, 3, or X).","cls":"IIb","lvl":"C","sec":"四肢","page":37,"det":"手術治療を要する四肢血管外傷（ESVS Grade 2/3/X）の選択患者では、open repairの代替として血管内ステントまたはステントグラフト修復を考慮してもよい。Open動脈修復は四肢血管外傷で最も多く行われる手術手技であり、primary repair、patch repair、interposition、bypass graftの各open修復类型的間には比較研究が存在しない。Open手術修復の类型は、血管損傷の範囲（ESVS Grade 2/3/X）、解剖、生理、既存の患者因子に基づいて選ぶべきである。\n\n血管内修復は増加しているが、報告例の10%未満に限られる。National Readmissions Databaseを用いたpropensity score matchingの比較研究では、血管内修復は再入院リスクが高く、30日open再手術率も有意に高かったが、死亡率と切断率に差はなかった。他の研究でも血管内修復後の開存喪失または再介入の有意なリスクが示されている。National Trauma Data Bankの後ろ向き解析（孤立性浅大腿・膝窩動脈損傷）では、amputation-free survivalは同等だったが、多変量ロジスティック回帰で血管内修復群の院内死亡率が高かった。血管内治療は、軟部組織のdebridementや合併静脈・神経損傷の評価が不十分になる点に留意し、到達困難部位や全身状態が危うい症例で選択する。","detp":["手術治療を要する四肢血管外傷（ESVS Grade 2/3/X）の選択患者では、open repairの代替として血管内ステントまたはステントグラフト修復を考慮してもよい。Open動脈修復は四肢血管外傷で最も多く行われる手術手技であり、primary repair、patch repair、interposition、bypass graftの各open修復类型的間には比較研究が存在しない。","Open手術修復の类型は、血管損傷の範囲（ESVS Grade 2/3/X）、解剖、生理、既存の患者因子に基づいて選ぶべきである。血管内修復は増加しているが、報告例の10%未満に限られる。National Readmissions Databaseを用いたpropensity score matchingの比較研究では、血管内修復は再入院リスクが高く、30日open再手術率も有意に高かったが、死亡率と切断率に差はなかった。","他の研究でも血管内修復後の開存喪失または再介入の有意なリスクが示されている。National Trauma Data Bankの後ろ向き解析（孤立性浅大腿・膝窩動脈損傷）では、amputation-free survivalは同等だったが、多変量ロジスティック回帰で血管内修復群の院内死亡率が高かった。血管内治療は、軟部組織のdebridementや合併静脈・神経損傷の評価が不十分になる点に留意し、到達困難部位や全身状態が危うい症例で選択する。"]},{"n":91,"ja":"四肢損傷患者の主要動脈側枝からの活動性出血には、血管内塞栓術を推奨する","en":"Endovascular embolisation is recommended for active bleeding from side branches of major arteries in patients with extremity injuries.","cls":"I","lvl":"C","sec":"四肢","page":37,"det":"四肢損傷患者の主要動脈の側枝からの活動性出血には、血管内塞栓術が推奨される。四肢血管外傷における血管内手技の中で、分枝（tributary arteries）からの出血に対する塞栓術が最も一般的で成功した用途である。臀部・大腿深部・上腕深部など、外科的到達が困難な部位の側枝出血は、開創して探索すると組織損傷が大きく、止血に時間を要する。選択的カテーテル塞栓は、こうした部位の出血を低侵襲かつ確実に制御できる。\n\n実務では、①CTAで血管外漏出の部位と供給血管を同定する、②superselectiveにカテーテルを進め、コイルまたは塞栓物質で出血点を閉塞する、③主要動脈本幹は塞栓しない（肢の灌流を犠牲にする）、④塞栓後に灌流評価（脈拍、皮膚温、必要ならDUS/CTA）を行い、側副血行での代償を確認する、⑤骨盤や肩部など骨に囲まれた部位では塞栓が特に有用である、という手順となる。外傷性動静脈瘻や偽動脈瘤に対する塞栓も同様の枠組みで行う。塞栓不能な場合は外科的結紮へ移行する。実務では、CTAで血管外漏出の部位と供給血管を同定し、superselectiveにカテーテルを進めてコイルまたは塞栓物質で出血点を閉塞する。主要動脈本幹は塞栓せず、塞栓後に灌流評価（脈拍、皮膚温、必要ならDUS/CTA）を行い、側副血行での代償を確認する。骨盤や肩部など骨に囲まれた部位では塞栓が特に有用である。","detp":["四肢損傷患者の主要動脈の側枝からの活動性出血には、血管内塞栓術が推奨される。四肢血管外傷における血管内手技の中で、分枝（tributary arteries）からの出血に対する塞栓術が最も一般的で成功した用途である。臀部・大腿深部・上腕深部など、外科的到達が困難な部位の側枝出血は、開創して探索すると組織損傷が大きく、止血に時間を要する。選択的カテーテル塞栓は、こうした部位の出血を低侵襲かつ確実に制御できる。","実務では、①CTAで血管外漏出の部位と供給血管を同定する、②superselectiveにカテーテルを進め、コイルまたは塞栓物質で出血点を閉塞する、③主要動脈本幹は塞栓しない（肢の灌流を犠牲にする）、④塞栓後に灌流評価（脈拍、皮膚温、必要ならDUS/CTA）を行い、側副血行での代償を確認する、⑤骨盤や肩部など骨に囲まれた部位では塞栓が特に有用である、という手順となる。外傷性動静脈瘻や偽動脈瘤に対する塞栓も同様の枠組みで行う。","塞栓不能な場合は外科的結紮へ移行する。実務では、CTAで血管外漏出の部位と供給血管を同定し、superselectiveにカテーテルを進めてコイルまたは塞栓物質で出血点を閉塞する。主要動脈本幹は塞栓せず、塞栓後に灌流評価（脈拍、皮膚温、必要ならDUS/CTA）を行い、側副血行での代償を確認する。骨盤や肩部など骨に囲まれた部位では塞栓が特に有用である。"]},{"n":92,"ja":"修復が容易でなく遠位虚血の証拠がない孤立性橈骨/尺骨動脈損傷には、結紮を推奨する","en":"If repair is not easily achievable, ligation is recommended in isolated radial or ulnar arterial injury without evidence of distal ischaemia.","cls":"I","lvl":"C","sec":"四肢","page":38,"det":"修復が容易でなく、遠位虚血の証拠がない孤立性橈骨動脈または尺骨動脈損傷には、結紮が推奨される。肘・膝より末梢では、手掌弓・足底弓という側副血行が存在するため、損傷したすべての血管を修復する必要は減る。手掌弓が保たれている患者における橈骨動脈または尺骨動脈の結紮は、許容される治療法である。Allen testや術中の弓の拍出確認（必要なら術中造影）で側副血行を評価したうえで結紮する。\n\n実務の注意点は、①手掌弓が不完全な症例（variationは数%存在）では結紮後に手指虚血を生じうるため、可能な限り修復を考慮する、②両側（橈骨＋尺骨）の損傷では少なくとも1本の修復が必要、③結紮後は手指の色調・温度・毛細血管再充満を観察し、虚血徴候が出現すれば再探索する、④神経（正中・尺骨神経）の合併損傷の評価を忘れない、である。深部・時間のかかる修復のために全身状態を犠牲にしないことが、ダメージコントロールの観点からも重要である。実務の注意点は、手掌弓が不完全な症例（variationは数%存在）では結紮後に手指虚血を生じうるため可能な限り修復を考慮すること、両側（橈骨＋尺骨）の損傷では少なくとも1本の修復が必要なこと、結紮後は手指の色調・温度・毛細血管再充満を観察し虚血徴候が出現すれば再探索することである。","detp":["修復が容易でなく、遠位虚血の証拠がない孤立性橈骨動脈または尺骨動脈損傷には、結紮が推奨される。肘・膝より末梢では、手掌弓・足底弓という側副血行が存在するため、損傷したすべての血管を修復する必要は減る。手掌弓が保たれている患者における橈骨動脈または尺骨動脈の結紮は、許容される治療法である。Allen testや術中の弓の拍出確認（必要なら術中造影）で側副血行を評価したうえで結紮する。","実務の注意点は、①手掌弓が不完全な症例（variationは数%存在）では結紮後に手指虚血を生じうるため、可能な限り修復を考慮する、②両側（橈骨＋尺骨）の損傷では少なくとも1本の修復が必要、③結紮後は手指の色調・温度・毛細血管再充満を観察し、虚血徴候が出現すれば再探索する、④神経（正中・尺骨神経）の合併損傷の評価を忘れない、である。深部・時間のかかる修復のために全身状態を犠牲にしないことが、ダメージコントロールの観点からも重要である。","実務の注意点は、手掌弓が不完全な症例（variationは数%存在）では結紮後に手指虚血を生じうるため可能な限り修復を考慮すること、両側（橈骨＋尺骨）の損傷では少なくとも1本の修復が必要なこと、結紮後は手指の色調・温度・毛細血管再充満を観察し虚血徴候が出現すれば再探索することである。"]},{"n":93,"ja":"前/後脛骨動脈のいずれかが開存する、遠位虚血のない孤立性膝下動脈損傷には、結紮または塞栓を考慮してもよい","en":"Ligation or embolisation of an isolated infragenicular arterial injury without evidence of distal ischaemia may be considered in patients with one of the anterior or posterior tibial arteries intact and patent.","cls":"IIb","lvl":"C","sec":"四肢","page":38,"det":"前脛骨動脈または後脛骨動脈のいずれかが開存し、遠位虚血のない孤立性膝下動脈損傷には、結紮または塞栓を考慮してもよい。膝下・肘下の側副血行（足底弓）により、損傷血管のすべてを修復する必要は減る。複数の脛骨血管損傷では、修復すべき本数に関するエビデンスは限られるが、標準的な教訓は、足関節より末梢へrunoffを持つ1本の健常または修復された動脈が通常は救肢に十分というものである。 multiple tibial vessel injuryは肢喪失率が高い。\n\n興味深いのは、損傷血管の総数よりも「どの動脈が損傷したか」が救肢と関連したとする単施設研究で、鈍的外傷後の単一脛骨血管損傷では、前脛骨動脈損傷は後脛骨動脈または腓骨動脈損傷と比較して切断率が有意に高かった（調整ORも有意）。したがって、前脛骨動脈が損傷している症例では修復の優先度を上げ、後脛骨・腓骨動脈の孤立損傷で遠位虚血がなければ結紮や塞栓が許容される。塞栓は活動性出血がある症例、結紮は開創中の症例で選択する。結紮・塞栓後は足部の灌流とコンパートメント圧の観察を継続する。したがって前脛骨動脈が損傷している症例では修復の優先度を上げ、後脛骨・腓骨動脈の孤立損傷で遠位虚血がなければ結紮や塞栓が許容される。塞栓は活動性出血がある症例、結紮は開創中の症例で選択し、いずれも足部の灌流とコンパートメント圧の観察を継続する。","detp":["前脛骨動脈または後脛骨動脈のいずれかが開存し、遠位虚血のない孤立性膝下動脈損傷には、結紮または塞栓を考慮してもよい。膝下・肘下の側副血行（足底弓）により、損傷血管のすべてを修復する必要は減る。複数の脛骨血管損傷では、修復すべき本数に関するエビデンスは限られるが、標準的な教訓は、足関節より末梢へrunoffを持つ1本の健常または修復された動脈が通常は救肢に十分というものである。multiple tibial vessel injuryは肢喪失率が高い。","興味深いのは、損傷血管の総数よりも「どの動脈が損傷したか」が救肢と関連したとする単施設研究で、鈍的外傷後の単一脛骨血管損傷では、前脛骨動脈損傷は後脛骨動脈または腓骨動脈損傷と比較して切断率が有意に高かった（調整ORも有意）。したがって、前脛骨動脈が損傷している症例では修復の優先度を上げ、後脛骨・腓骨動脈の孤立損傷で遠位虚血がなければ結紮や塞栓が許容される。塞栓は活動性出血がある症例、結紮は開創中の症例で選択する。","結紮・塞栓後は足部の灌流とコンパートメント圧の観察を継続する。したがって前脛骨動脈が損傷している症例では修復の優先度を上げ、後脛骨・腓骨動脈の孤立損傷で遠位虚血がなければ結紮や塞栓が許容される。塞栓は活動性出血がある症例、結紮は開創中の症例で選択し、いずれも足部の灌流とコンパートメント圧の観察を継続する。"]},{"n":94,"ja":"四肢外傷患者の術中全身ヘパリン化は、修復範囲・血流遮断時間・合併損傷・出血リスク・外傷性凝固障害を踏まえ個別に考慮してもよい","en":"Intra-operative systemic heparinisation in patients with extremity trauma may be considered on an individual basis, including the extent of repair, duration of interrupted blood flow, concomitant injuries and overall risk of bleeding, and
